name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, clippy, tests, dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out niuse
        uses: actions/checkout@v5
        with:
          path: niuse

      - name: Read pinned niucode revision
        id: niucode
        working-directory: niuse
        run: echo "rev=$(cat niucode.rev)" >> "$GITHUB_OUTPUT"

      # niuse declares path dependencies on ../niuverse/niucode, so the
      # sibling repository must exist at the same relative path in CI.
      - name: Check out niucode
        uses: actions/checkout@v5
        with:
          repository: niuverse/niucode
          ref: ${{ steps.niucode.outputs.rev }}
          path: niuverse/niucode

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: niuse -> target

      - name: Format
        working-directory: niuse
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: niuse
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docs
        working-directory: niuse
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Tests
        working-directory: niuse
        run: cargo test --workspace

      - name: Package niuse-core
        working-directory: niuse
        run: cargo package -p niuse-core

      - name: Dashboard is fresh
        working-directory: niuse
        run: cargo xtask dashboard --check
