l":"\u003ch2\u003eIn one sentence\u003c/h2\u003e\n\u003cp\u003eAdd a persistent identity and memory layer above niucode so the same agent knows you across projects and sessions. No resident service, no vector search, no automatic edits to your repositories.\u003c/p\u003e\n\u003ch2\u003e1. Positioning\u003c/h2\u003e\n\u003cp\u003eniucode owns \"can do\": loop, tools, sandbox, event log. niuse owns \"who\": what it remembers, what it promised, and when it should disagree with you.\u003c/p\u003e\n\u003cp\u003eOne test decides whether a feature belongs here: \u003cstrong\u003edoes it shape an identity, or is it just another capability?\u003c/strong\u003e Capabilities stay in niucode or are not built.\u003c/p\u003e\n\u003ch2\u003e2. Decisions\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003eQuestion\u003c/th\u003e\u003cth\u003eDecision\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eD1\u003c/td\u003e\u003ctd\u003ePositioning\u003c/td\u003e\u003ctd\u003eCross-project engineering memory\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD2\u003c/td\u003e\u003ctd\u003eContent\u003c/td\u003e\u003ctd\u003ePreferences, decisions, pitfalls; few, high-value, reviewable\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD3\u003c/td\u003e\u003ctd\u003eOwnership\u003c/td\u003e\u003ctd\u003eGlobal preferences in niuse; project knowledge in the repo's \u003ccode\u003eAGENTS.md\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD4\u003c/td\u003e\u003ctd\u003eWriting\u003c/td\u003e\u003ctd\u003eThe agent proposes, one key confirms; at most one per turn\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD5\u003c/td\u003e\u003ctd\u003eReading\u003c/td\u003e\u003ctd\u003eFull injection filtered by scope\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD6\u003c/td\u003e\u003ctd\u003eArchitecture\u003c/td\u003e\u003ctd\u003eSeparate repo, depends on niucode libs, drives turns itself\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD7\u003c/td\u003e\u003ctd\u003eStorage\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e~/.niuse/\u003c/code\u003e, plain Markdown, \u003ccode\u003e0600\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD8\u003c/td\u003e\u003ctd\u003eInterface\u003c/td\u003e\u003ctd\u003eInteractive REPL; TUI deferred\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD9\u003c/td\u003e\u003ctd\u003eExpiry\u003c/td\u003e\u003ctd\u003eSoft expiry, replace on conflict\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD10\u003c/td\u003e\u003ctd\u003ePrivacy\u003c/td\u003e\u003ctd\u003eSecret-pattern blacklist, refuse on match\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD11\u003c/td\u003e\u003ctd\u003eMVP\u003c/td\u003e\u003ctd\u003eOnly the global-preference loop\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD12\u003c/td\u003e\u003ctd\u003eTop risk\u003c/td\u003e\u003ctd\u003eConfirmation fatigue\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD13\u003c/td\u003e\u003ctd\u003eShape\u003c/td\u003e\u003ctd\u003eIdentity layer plus resumable session, no resident process\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD14\u003c/td\u003e\u003ctd\u003eCold start\u003c/td\u003e\u003ctd\u003eMine history; you define \u003ccode\u003eidentity\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eD15\u003c/td\u003e\u003ctd\u003eCharacter\u003c/td\u003e\u003ctd\u003eAn opinionated collaborator\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eRationale for each trade-off lives in \u003ca href=\"adr/0001-memory-layer.md\"\u003eADR-0001\u003c/a\u003e and \u003ca href=\"adr/0002-identity-layer.md\"\u003eADR-0002\u003c/a\u003e.\u003c/p\u003e\n\u003ch3\u003eAdmission criteria for memory\u003c/h3\u003e\n\u003cp\u003eA piece of information may enter \u003ccode\u003ememory/\u003c/code\u003e only if all three hold:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eIt is still useful across sessions.\u003c/li\u003e\n\u003cli\u003eIt cannot be found by \u003ccode\u003egrep\u003c/code\u003e in the repository.\u003c/li\u003e\n\u003cli\u003eIt fits in one sentence a human can review.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eAnything else is rejected. This is what keeps \"index every session\" and \"environment facts\" out: they look like memory but are really retrieval and configuration.\u003c/p\u003e\n\u003ch2\u003e3. Stores and injection\u003c/h2\u003e\n\u003ch3\u003e3.1 The five stores\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e~/.niuse/\n  identity.md          who it is: name, voice, values, boundaries\n  user.md              who you are: goals, rhythm, taste, red lines, current work\n  memory/\n    preferences.md\n    lessons.md         decisions and pitfalls\n  journal/\n    2026-10.md         experience, one file per month\n  loops.md             promises: things it said it would do\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003eUTF-8 Markdown only; directories \u003ccode\u003e0700\u003c/code\u003e, files \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ememory/\u003c/code\u003e may be its own git repository for backup and diffs; \u003ccode\u003ejournal/\u003c/code\u003e is not committed by default.\u003c/li\u003e\n\u003cli\u003eNo database. For a single user and under 200 entries, files are the best query engine.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch3\u003e3.2 Injection order and budget\u003c/h3\u003e\n\u003cp\u003eStable before volatile; the system prompt is assembled once per session (never rebuilt mid-session, to avoid a cache miss on every turn):\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eSection\u003c/th\u003e\u003cth\u003eSource\u003c/th\u003e\u003cth\u003eBudget\u003c/th\u003e\u003cth\u003eChange rate\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eIdentity\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eidentity.md\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e≤ 600 tok\u003c/td\u003e\u003ctd\u003every low\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eUser\u003c/td\u003e\u003ctd\u003e\u003ccode\u003euser.md\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e≤ 600 tok\u003c/td\u003e\u003ctd\u003elow\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eFacts\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ememory/*.md\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e≤ 2 000 tok\u003c/td\u003e\u003ctd\u003elow\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003ePromises\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eloops.md\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e≤ 300 tok\u003c/td\u003e\u003ctd\u003emedium\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eRecent experience\u003c/td\u003e\u003ctd\u003elast 3 \u003ccode\u003ejournal/\u003c/code\u003e days\u003c/td\u003e\u003ctd\u003e≤ 600 tok\u003c/td\u003e\u003ctd\u003ehigh\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eAbout 4k tokens in total. Over budget, drop the oldest \u003ccode\u003eunverified\u003c/code\u003e facts first, then truncate the journal; never silently drop \u003ccode\u003eidentity\u003c/code\u003e or \u003ccode\u003euser\u003c/code\u003e.\u003c/p\u003e\n\u003ch3\u003e3.3 Entry format\u003c/h3\u003e\n\u003cp\u003eOne memory is one section: machine-parseable and human-readable.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-markdown\"\u003e### m-7f3a\n\n- Conclusion: Rust repositories use `cargo nextest`, never `cargo test`\n- Tags: rust, testing\n- Created: 2026-10-21\n- Last confirmed: 2026-10-21\n- Source: `1792493790852-350850-0`\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eid\u003c/code\u003e is four random hex digits and is never reused. \u003ccode\u003eSource\u003c/code\u003e points at the niucode session id and is the only audit trail.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eloops.md\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-markdown\"\u003e- [ ] l-7f3a Confirm whether niucode supports per-turn cwd (due 2026-10-22)\n- [x] l-91cc Cap the bootstrap sample (2026-10-21)\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003e4. Turn lifecycle\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003estartup\n  ├─ read the five stores\n  ├─ assemble the system prompt (once)\n  └─ restore thread history via project_history\n\neach input\n  ├─ run_with_history(config, prompt, history)\n  ├─ stream events (own renderer)\n  ├─ tail buffer: strip \u0026lt;\u0026lt;niuse:memory\u0026gt;\u0026gt; / \u0026lt;\u0026lt;niuse:loop\u0026gt;\u0026gt; / \u0026lt;\u0026lt;niuse:journal\u0026gt;\u0026gt; blocks\n  ├─ candidate? print it → y / n / e\n  ├─ accept → write memory (or loops)\n  └─ append to the journal buffer\n\nexit / project switch\n  └─ journal is already on disk\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ehistory\u003c/code\u003e is projected by niucode's \u003ccode\u003eproject_history\u003c/code\u003e from session events; there is no second copy of the conversation. Replay, fork, and compaction therefore behave exactly as in niucode, and niuse does not reinvent them.\u003c/p\u003e\n\u003ch2\u003e5. Write thresholds\u003c/h2\u003e\n\u003ch3\u003e5.1 Candidate protocol\u003c/h3\u003e\n\u003cp\u003eNo extra model call. The system prompt states that the model may append a block when a turn produced something durable:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e\u0026lt;\u0026lt;niuse:memory kind=preference tags=rust,testing\u0026gt;\u0026gt;\nRust repositories use cargo nextest, never cargo test\n\u0026lt;\u0026lt;/niuse:memory\u0026gt;\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRules:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eAt most one block per turn; if there is nothing, say nothing. \u003cstrong\u003eLong runs without a candidate are normal.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eOnly \u003ccode\u003ememory\u003c/code\u003e and \u003ccode\u003eloop\u003c/code\u003e and \u003ccode\u003ejournal\u003c/code\u003e blocks are recognised.\u003c/li\u003e\n\u003cli\u003eAfter a \u003ccode\u003ememory\u003c/code\u003e rejection, the same tags are not proposed again in that session.\u003c/li\u003e\n\u003cli\u003eA parse failure counts as \"no candidate\": no error, no guessing.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe cost is that the model may miss things. Missing is acceptable; recording something wrong is not — the same value as D9. If dogfooding shows serious under-recording after two weeks, add an offline proposer then, not now.\u003c/p\u003e\n\u003ch3\u003e5.2 Confirmation\u003c/h3\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eMemory candidate [global · rust,testing]\n  Rust repositories use cargo nextest, never cargo test\n  [y] accept   [n] discard   [e] edit   [s] stop proposing this session\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ee\u003c/code\u003e opens \u003ccode\u003e$EDITOR\u003c/code\u003e. A conflict does not overwrite silently:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eConflicts with m-91cc:\n  old: Rust projects use cargo test\n  new: Rust repositories use cargo nextest\n  [r] replace   [k] keep both   [d] discard\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch3\u003e5.3 Journal\u003c/h3\u003e\n\u003cp\u003eWritten automatically, no confirmation, but only under strict rules:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThree to five lines, only what \u003cstrong\u003ediffers from last time\u003c/strong\u003e: decisions, turning points, open questions, mood shifts.\u003c/li\u003e\n\u003cli\u003eNo activity logs (\"fixed a bug today\"), no duplication of \u003ccode\u003ememory/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEvents and judgements only, not code detail. Paths may be referenced; code is not copied.\u003c/li\u003e\n\u003cli\u003eScanned for secrets before writing, since transcripts may contain keys.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe journal is not a log; it is compressed shared experience. The test: read it three months later and see whether the trade-off comes back.\u003c/p\u003e\n\u003ch3\u003e5.4 Loops\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003eWhen it says \"I'll check next time\" or \"I'll follow up\", that goes into \u003ccode\u003eloops.md\u003c/code\u003e; otherwise trust erodes.\u003c/li\u003e\n\u003cli\u003eEach entry may carry a due date; entries without one surface after two weeks.\u003c/li\u003e\n\u003cli\u003eClosing a loop needs evidence (a verification, a conclusion), not a feeling of completion.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e6. Expiry, conflicts, privacy\u003c/h2\u003e\n\u003ch3\u003e6.1 Soft expiry\u003c/h3\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eAge since \u003ccode\u003elast confirmed\u003c/code\u003e\u003c/th\u003e\u003cth\u003eInjection behaviour\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e≤ 30 days\u003c/td\u003e\u003ctd\u003einjected normally\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e31–90 days\u003c/td\u003e\u003ctd\u003einjected, marked \u003ccode\u003e(unverified since YYYY-MM-DD)\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u0026gt; 90 days\u003c/td\u003e\u003ctd\u003enot injected automatically; visible via \u003ccode\u003e/mem recall\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eNo automatic deletion. Deletion is irreversible and you would never know what it removed. \u003ccode\u003e/mem review\u003c/code\u003e supports bulk re-confirmation and cleanup.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ejournal\u003c/code\u003e is exempt from expiry: experience does not become invalid, only old. \u003ccode\u003eloops\u003c/code\u003e uses due dates, not age.\u003c/p\u003e\n\u003ch3\u003e6.2 Conflicts\u003c/h3\u003e\n\u003cp\u003eBefore writing, a new memory is compared with the existing store:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003enormalise (lowercase, strip punctuation), take character bigrams, Jaccard ≥ 0.5 is a likely conflict;\u003c/li\u003e\n\u003cli\u003esame tag and similarity ≥ 0.35 also counts;\u003c/li\u003e\n\u003cli\u003ea hit opens replace / keep both / discard; never merge automatically.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe 0.5 threshold is a starting point and will be adjusted after two weeks of false positives. No embeddings: at 200 entries the complexity outweighs the benefit.\u003c/p\u003e\n\u003ch3\u003e6.3 Privacy\u003c/h3\u003e\n\u003cp\u003eMemory is sent to the provider every turn, so leaked content leaks far more often than in an ordinary file. Every write is scanned; a hit is refused with a reason:\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePattern\u003c/th\u003e\u003cth\u003eExample\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esk-[A-Za-z0-9]{20,}\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOpenAI / DeepSeek key\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eghp_\u003c/code\u003e / \u003ccode\u003egithub_pat_\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eGitHub token\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eAKIA[0-9A-Z]{16}\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAWS access key\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e-----BEGIN .* PRIVATE KEY-----\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eprivate key\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003exox[baprs]-\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eSlack token\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e32+ hex / base64 run\u003c/td\u003e\u003ctd\u003egeneric key shape\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eScanning is a backstop, not a guarantee. Private projects, client names, and internal addresses still depend on human judgement at confirmation time. \u003ccode\u003eNIUSE_MEMORY=off\u003c/code\u003e disables injection entirely, for A/B runs and trust recovery.\u003c/p\u003e\n\u003ch2\u003e7. Cold start\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniuse bootstrap\u003c/code\u003e turns history into \u003ccode\u003euser.md\u003c/code\u003e and memory candidates once:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eEnumerate \u003ccode\u003e~/.niucode/sessions/*.jsonl\u003c/code\u003e, last 90 days, at most 40; prefer sessions with multiple turns and tool calls.\u003c/li\u003e\n\u003cli\u003eSend only user / assistant text, \u003cstrong\u003edropping tool output\u003c/strong\u003e, through one tool-free extraction that returns \u003ccode\u003e{type, text, evidence}\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eDeduplicate, group by type, and write \u003ccode\u003e~/.niuse/inbox.md\u003c/code\u003e with the source session id on every line.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse review\u003c/code\u003e walks the queue: \u003ccode\u003ey\u003c/code\u003e accept, \u003ccode\u003en\u003c/code\u003e discard, \u003ccode\u003ee\u003c/code\u003e edit.\u003c/li\u003e\n\u003cli\u003eWith \u003ccode\u003e--profile\u003c/code\u003e, one extra call drafts \u003ccode\u003euser.md\u003c/code\u003e from the same sessions when the file is missing; \u003ccode\u003e--force-profile\u003c/code\u003e overwrites.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eidentity.md\u003c/code\u003e is not mined: \u003ccode\u003eniuse identity init\u003c/code\u003e asks eight questions, records your answers, and lets you edit them.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eCost estimate: 40 sessions × about 2k input tokens ≈ 100k tokens, one-off.\u003c/p\u003e\n\u003cp\u003eMining boundary: only the three kinds from D2. No code facts, no environment configuration, no information about other people.\u003c/p\u003e\n\u003ch2\u003e8. Architecture\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003ecrates/niuse-cli     REPL, commands, renderer, driver, bootstrap\n    │\ncrates/niuse-core    date / model / store / prompt / candidate / policy\n    │\nniucode-agent        run_with_history / AgentConfig / project_history\nniucode-core         SessionLog / Event\nniucode-provider / auth / tools\n\u003c/code\u003e\u003c/pre\u003e\n\u003cul\u003e\n\u003cli\u003eTwo crates: \u003ccode\u003eniuse-core\u003c/code\u003e depends only on \u003ccode\u003eanyhow\u003c/code\u003e and \u003ccode\u003eregex\u003c/code\u003e, and its 38 tests need no API key; \u003ccode\u003eniuse-cli\u003c/code\u003e owns the terminal, provider wiring, and driver.\u003c/li\u003e\n\u003cli\u003eThe dependency currently points at a sibling checkout via a path. Publishing or moving machines requires a pinned git revision instead.\u003c/li\u003e\n\u003cli\u003eA \u003ccode\u003eNiucodeDriver\u003c/code\u003e-style seam (about 200 lines) isolates API churn: config assembly, history projection, event forwarding.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniucode-cli\u003c/code\u003e is a binary with no library target, so the MVP does not reuse its TUI or renderer. It writes a minimal renderer and can swap later once upstream exposes a library or a hook.\u003c/li\u003e\n\u003cli\u003eNo changes to niucode's loop, no memory hook in the kernel. Memory is a product layer; the kernel stays minimal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e9. Three assumptions verified in W1\u003c/h2\u003e\n\u003cp\u003eWritten down is not verified. Each was tested in the first week; if any had failed, the design would have changed.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003ePer-turn cwd on one session\u003c/strong\u003e — passes: reading in one directory, \u003ccode\u003e/cd /tmp\u003c/code\u003e, reading in another, both succeed in the same \u003ccode\u003ethread.jsonl\u003c/code\u003e, with history rebuilt correctly.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eReliable stripping of trailing candidate blocks in a stream\u003c/strong\u003e — passes: the filter covers blocks split across chunks, partial prefixes, false markers, and unterminated blocks; real calls show the block removed and the prose intact.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003eniucode-agent\u003c/code\u003e's public API fits a thin adapter\u003c/strong\u003e — passes: \u003ccode\u003edriver.rs\u003c/code\u003e is about 200 lines with nothing to fork or bypass. The only thing written from scratch is the renderer, because \u003ccode\u003eniucode-cli\u003c/code\u003e has no library target.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003e10. Milestones\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eWeek\u003c/th\u003e\u003cth\u003eDeliverable\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eW1\u003c/td\u003e\u003ctd\u003eThree spikes; crate skeleton; five-store reads/writes; prompt assembly; one real turn in the REPL\u003c/td\u003e\u003ctd\u003edone\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eW2\u003c/td\u003e\u003ctd\u003eCandidate block and confirmation; journal; loops; soft expiry; secret scan\u003c/td\u003e\u003ctd\u003edone (approval preview is still a summary, not a full diff)\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eW3\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eniuse bootstrap\u003c/code\u003e; dogfood; acceptance data\u003c/td\u003e\u003ctd\u003ebootstrap and review done; dogfood pending\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e11. Acceptance\u003c/h2\u003e\n\u003cp\u003eTechnical checks passed on 2026-10-21: five-store reads/writes and \u003ccode\u003e0600\u003c/code\u003e, candidate protocol, streaming strip, soft expiry, secret scan, the full \u003ccode\u003ebootstrap → review → memory\u003c/code\u003e chain, per-turn cwd in one session, and \u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eWhat remains is product acceptance, which requires real use:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nTen consecutive working days, at least one real task per day through niuse\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nCandidate acceptance rate ≥ 60% (accepted / proposed)\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nAt least 3 cases where it cites a past judgement and the citation is correct\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nAt least 1 case where it disagrees and you change your mind\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nMemory store ≤ 50 entries (more means the bar is too low)\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nAt least 1 A/B case where \u003ccode\u003eNIUSE_MEMORY=off\u003c/code\u003e produces a different answer\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe last item is the anti-placebo check: if turning memory off changes nothing, the layer has no reason to exist.\u003c/p\u003e\n\u003ch2\u003e12. Non-goals\u003c/h2\u003e\n\u003cp\u003eDaemon, web UI, WeChat / Feishu bridges, scheduled push, vector search, full session indexing, automatic repo edits, multi-user support, a TUI (for now), a general agent framework.\u003c/p\u003e\n\u003ch2\u003e13. Risks\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eRisk\u003c/th\u003e\u003cth\u003eSymptom\u003c/th\u003e\u003cth\u003eMitigation\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eConfirmation fatigue (top)\u003c/td\u003e\u003ctd\u003eBlind \u003ccode\u003ey\u003c/code\u003e presses, then the feature is switched off\u003c/td\u003e\u003ctd\u003eAt most one per turn; no repeated tags after rejection; observable acceptance rate; \u003ccode\u003eNIUSE_MEMORY=off\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003ePersona performance\u003c/td\u003e\u003ctd\u003eLines like \"I missed you\"\u003c/td\u003e\u003ctd\u003eHard rules in \u003ccode\u003eidentity.md\u003c/code\u003e; companionship rests on memory, promises, disagreement\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eJournal becomes an activity log\u003c/td\u003e\u003ctd\u003e\"Fixed a bug today\"\u003c/td\u003e\u003ctd\u003eOnly changes and judgements; monthly review removes empty entries\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eDependency rot\u003c/td\u003e\u003ctd\u003eniucode moves and the build breaks\u003c/td\u003e\u003ctd\u003ePin the revision; thin adapter; upstream a library split if needed\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eCold-start noise\u003c/td\u003e\u003ctd\u003e\"User likes clean code\" × 20\u003c/td\u003e\u003ctd\u003eOnly three kinds; every candidate carries a source; batch review, not accept-all\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003e14. Open questions\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eIts name: \u003ccode\u003eniuse\u003c/code\u003e is the project name, not necessarily what you call it; define that in \u003ccode\u003eidentity.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eBootstrap sample size and cost: decide after one real run.\u003c/li\u003e\n\u003cli\u003eWhether it may propose changes to \u003ccode\u003eidentity.md\u003c/code\u003e: proposal yes, confirmation required.\u003c/li\u003e\n\u003cli\u003eSession model beyond a single thread: \u003ccode\u003e/new\u003c/code\u003e, per-project sessions; wait for real usage to expose the need.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003e15. Implementation map and deviations\u003c/h2\u003e\n\u003cp\u003eImplemented in \u003ccode\u003ecrates/niuse-core\u003c/code\u003e and \u003ccode\u003ecrates/niuse-cli\u003c/code\u003e:\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePlan item\u003c/th\u003e\u003cth\u003eLocation\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eFive stores, \u003ccode\u003e0600\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003estore.rs\u003c/code\u003e, atomic write plus \u003ccode\u003echmod\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eInjection and budgets\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eprompt.rs\u003c/code\u003e, stable sections first\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eProtocol blocks and streaming strip\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ecandidate.rs\u003c/code\u003e, six boundary tests\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eSoft expiry / conflicts / secret scan\u003c/td\u003e\u003ctd\u003e\u003ccode\u003epolicy.rs\u003c/code\u003e plus \u003ccode\u003eprompt.rs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eREPL, confirmation, \u003ccode\u003e/mem\u003c/code\u003e and friends\u003c/td\u003e\u003ctd\u003e\u003ccode\u003erepl.rs\u003c/code\u003e, \u003ccode\u003ecommands.rs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eSession resume and per-turn cwd\u003c/td\u003e\u003ctd\u003e\u003ccode\u003edriver.rs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eCold start\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ebootstrap.rs\u003c/code\u003e (bootstrap + review)\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eArchitecture dashboard\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ecrates/xtask\u003c/code\u003e plus \u003ccode\u003edocs/dashboard/project.json\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eMemory kill switch\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eNIUSE_MEMORY=off\u003c/code\u003e in \u003ccode\u003erepl.rs\u003c/code\u003e\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThree deviations from the plan:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eA third protocol block, \u003ccode\u003ejournal\u003c/code\u003e.\u003c/strong\u003e The plan had memory and loop only; to avoid an extra model call, the main model emits a journal block and niuse writes it automatically.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003e\u003ccode\u003eexec\u003c/code\u003e never writes memory.\u003c/strong\u003e It prints candidates to stderr so scripted calls cannot change the store silently.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eApproval shows a summary and +/- counts.\u003c/strong\u003e A structured unified diff is deferred; the security boundary is unchanged.\u003c/li\u003e\n\u003c/ol\u003e\n","path":"docs/plan.md","excerpt":"Fifteen decisions, the five stores, turn lifecycle, write thresholds, milestones, and verifiable acceptance."},{"id":"adr-0001","title":"ADR-0001: A global memory layer","kind":"adr","status":"accepted","order":20,"summary":"Memory is a small global store, not a session index: plain Markdown, full injection, soft expiry, confirmation before writing; project knowledge stays in AGENTS.md.","body_html":"\u003ch2\u003eStatus\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-21. The W1 spike passed; the MVP is implemented in \u003ccode\u003ecrates/niuse-core\u003c/code\u003e (\u003ccode\u003estore\u003c/code\u003e, \u003ccode\u003epolicy\u003c/code\u003e, \u003ccode\u003eprompt\u003c/code\u003e, \u003ccode\u003ecandidate\u003c/code\u003e).\u003c/p\u003e\n\u003ch2\u003eContext\u003c/h2\u003e\n\u003cp\u003eniucode already has \u003ccode\u003eAGENTS.md\u003c/code\u003e, skills, session resume, compaction, and fork, but it deliberately does not provide memory across sessions or projects (the roadmap lists it as deferred). The result: every new project starts by repeating preferences, decisions, and old pitfalls.\u003c/p\u003e\n\u003cp\u003eThe obvious temptation is to index every session and retrieve from it. That direction has three concrete problems:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eCode facts are one \u003ccode\u003egrep\u003c/code\u003e away; indexing duplicates the repository.\u003c/li\u003e\n\u003cli\u003eRetrieval quality needs an evaluation set, and niuse does not have one.\u003c/li\u003e\n\u003cli\u003eVectorising turns \"reviewable\" into \"opaque\": a wrong memory cannot be spotted at a glance.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eDecision\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eMemory is global, not per-session.\u003c/strong\u003e It stores only what still holds across projects; project-level knowledge stays in the repository's \u003ccode\u003eAGENTS.md\u003c/code\u003e, and niuse never writes there automatically.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThree kinds only\u003c/strong\u003e: preferences, decisions, pitfalls. Admission requires: useful across sessions, not greppable in the repo, expressible in one reviewable sentence.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePlain Markdown\u003c/strong\u003e, under \u003ccode\u003e~/.niuse/memory/\u003c/code\u003e, files \u003ccode\u003e0600\u003c/code\u003e, optionally its own git repo. No SQLite, no JSONL.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFull injection\u003c/strong\u003e, filtered by scope, 2k-token budget. No query-time retrieval, so the system-prompt prefix stays stable and prompt caching survives.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConfirmation before writing\u003c/strong\u003e, at most one candidate per turn. The candidate is emitted in-band by the main model; no extra model call.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSoft expiry\u003c/strong\u003e: normal within 30 days, marked \u003ccode\u003eunverified\u003c/code\u003e from 31 to 90 days, not injected after 90. Never deleted automatically.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eConflicts are never merged silently\u003c/strong\u003e: lexical similarity above threshold offers replace / keep both / discard.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSecret-pattern scan before writing\u003c/strong\u003e; a match is refused. Memory is sent to the provider every turn, so the leak surface is much larger than an ordinary file.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eConsequences\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eBetter:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMemory is readable, editable, diffable, and revertible; mistakes are visible and fixable.\u003c/li\u003e\n\u003cli\u003eNo retrieval dependency, works offline, no embedding service or evaluation set required.\u003c/li\u003e\n\u003cli\u003eThe stable prompt prefix preserves the prompt-cache behaviour niucode relies on.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eWorse:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eA hard capacity limit around 200 entries; beyond that, manual merging or pruning is required.\u003c/li\u003e\n\u003cli\u003eRecall is \"inject everything and let the model judge\"; no relevance ranking, and too much memory dilutes attention.\u003c/li\u003e\n\u003cli\u003eCandidates depend on the main model volunteering them; missing one is normal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAccepted trade-off:\u003c/strong\u003e prefer missing a memory to recording a wrong one. A wrong memory enters every subsequent turn and is hard to notice; a missing one costs at most one repeated mistake.\u003c/p\u003e\n\u003ch2\u003eAlternatives\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOption\u003c/th\u003e\u003cth\u003eRejected because\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eVector index over all sessions\u003c/td\u003e\u003ctd\u003eNo evaluation set, not reviewable, duplicates grep, breaks the stable prefix\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eSQLite storage\u003c/td\u003e\u003ctd\u003eNo benefit at single-user, 200-entry scale; unreadable to humans and to diffs\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eAutomatic distillation\u003c/td\u003e\u003ctd\u003eNoisy, and a wrong memory pollutes a turn before anyone can catch it; conflicts with \"prefer missing\"\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eProject memory in the global store\u003c/td\u003e\u003ctd\u003eDuplicates \u003ccode\u003eAGENTS.md\u003c/code\u003e and drifts away from the code\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eBuild it into the niucode kernel\u003c/td\u003e\u003ctd\u003eViolates niucode's minimal-harness boundary; memory should be a replaceable product layer\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n","path":"docs/adr/0001-memory-layer.md","excerpt":"Memory is a small global store, not a session index: plain Markdown, full injection, soft expiry, confirmation before writing; project knowledge stays in AGENTS.md."},{"id":"adr-0002","title":"ADR-0002: An identity layer, not a daemon","kind":"adr","status":"accepted","order":21,"summary":"Identity is five Markdown stores, not prompt magic; companionship comes from memory, promises, and disagreement, not tone; what persists is the identity, not a process.","body_html":"\u003ch2\u003eStatus\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-21. The identity layer and REPL are implemented; journal and loops are written automatically from in-band protocol blocks.\u003c/p\u003e\n\u003ch2\u003eContext\u003c/h2\u003e\n\u003cp\u003eThe goal is a personal companion, not a smarter tool. Two shapes exist in the ecosystem:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003epi-memory style\u003c/strong\u003e: \u003ccode\u003eIDENTITY.md\u003c/code\u003e / \u003ccode\u003eUSER.md\u003c/code\u003e / \u003ccode\u003eMEMORY.md\u003c/code\u003e / \u003ccode\u003edaily/\u003c/code\u003e, injected at session start. Lightweight, but only a memory extension.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003epi-durable-assistant style\u003c/strong\u003e: a resident runtime, web UI, scheduled tasks, background subagents, a WeChat channel, and approval-gated memory. Heavy, and it turns a personal project into an operations project.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe cheap way to fake a companion is to give it a persona and a warm tone. That slides quickly into role-play: it talks a lot, remembers little, never disagrees, and does not improve your judgement.\u003c/p\u003e\n\u003ch2\u003eDecision\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eIdentity is files, not prompt magic.\u003c/strong\u003e \u003ccode\u003eidentity.md\u003c/code\u003e, \u003ccode\u003euser.md\u003c/code\u003e, \u003ccode\u003ememory/\u003c/code\u003e, \u003ccode\u003ejournal/\u003c/code\u003e, and \u003ccode\u003eloops.md\u003c/code\u003e are five persistent stores, all human-readable and editable. You can rewrite its values without touching code.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eYou write the identity; it may only propose changes.\u003c/strong\u003e History can mine \u003ccode\u003euser.md\u003c/code\u003e and memory candidates, but it cannot mine who it is.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eInjection order is stable-to-volatile\u003c/strong\u003e: \u003ccode\u003eidentity → user → memory → loops → recent journal\u003c/code\u003e. The system prompt is assembled once per session.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eGraded write thresholds\u003c/strong\u003e: journal and loops are automatic; memory requires confirmation; identity is human-only.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNo daemon.\u003c/strong\u003e No web UI, no WeChat, no scheduled push. It exists while the terminal is open and does not pretend to live in the background.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCompanionship rests on three things\u003c/strong\u003e: remembering your judgements, tracking its own promises, and speaking up when you are wrong. Not emotional performance, not pet names, not spontaneous sentiment.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIt keeps a right to disagree.\u003c/strong\u003e \u003ccode\u003eidentity.md\u003c/code\u003e must state its judgement criteria and boundaries; disagreement comes with reasons, about the work rather than the person.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eThe journal records change only.\u003c/strong\u003e Three to five lines covering decisions, turning points, open questions, and shifts in mood; no activity logs, no duplication of memory.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eConsequences\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eBetter:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe identity is fully auditable: one \u003ccode\u003egit diff\u003c/code\u003e shows what changed about its character.\u003c/li\u003e\n\u003cli\u003eNo operational burden: no servers, ports, certificates, or backup strategy.\u003c/li\u003e\n\u003cli\u003eCold start can borrow history, so the first two weeks do not feel like meeting a stranger.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eWorse:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eIt only exists while the terminal is open; it cannot remind you on a commute.\u003c/li\u003e\n\u003cli\u003eWithout push, the freshness of \u003ccode\u003eloops\u003c/code\u003e depends on you opening the terminal.\u003c/li\u003e\n\u003cli\u003eIdentity quality depends on whether you answer the eight questions; skip them and it degrades into a generic assistant.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAccepted trade-off:\u003c/strong\u003e prove that \"remembers, reliable, willing to disagree\" is valuable before adding reach. Doing it the other way around produces a role-playing bot that interrupts you everywhere.\u003c/p\u003e\n\u003ch2\u003eAlternatives\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOption\u003c/th\u003e\u003cth\u003eRejected because\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eResident daemon plus push\u003c/td\u003e\u003ctd\u003eAbout five times the work, and it turns a personal project into an operations project; reach can come later\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eA persona paragraph in the system prompt\u003c/td\u003e\u003ctd\u003eNot auditable, not revertible, and it drifts on every startup\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eLet the model self-update its identity\u003c/td\u003e\u003ctd\u003eIt slowly drifts toward pleasing you, which destroys the willingness to disagree\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eReuse pi-durable-assistant\u003c/td\u003e\u003ctd\u003eA complete Node + SQLite runtime, incompatible with \"built on niucode\"\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eRebuild the persona from memory each session\u003c/td\u003e\u003ctd\u003eNo shared history, nowhere for the journal to accumulate, no relationship to grow\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n","path":"docs/adr/0002-identity-layer.md","excerpt":"Identity is five Markdown stores, not prompt magic; companionship comes from memory, promises, and disagreement, not tone; what persists is the identity, not a process."},{"id":"adr-0003","title":"ADR-0003: niucode is the kernel and UI; niuse is the product","kind":"adr","status":"accepted","order":22,"summary":"Keep two repositories. Upstream a reusable CLI library and turn hooks; niuse owns identity, memory, policy, and product defaults. Merge only if the product layer becomes thin enough that separate releases stop mattering.","body_html":"\u003ch2\u003eStatus\u003c/h2\u003e\n\u003cp\u003eAccepted · 2026-10-21.\u003c/p\u003e\n\u003cp\u003eUpstream proposal: \u003ca href=\"https://github.com/niuverse/niucode/blob/main/docs/adr/0032-embedding-library-surface.md\"\u003eniucode ADR-0032\u003c/a\u003e · \u003ca href=\"https://github.com/niuverse/niucode/issues/1\"\u003eniuverse/niucode#1\u003c/a\u003e.\u003c/p\u003e\n\u003ch2\u003eContext\u003c/h2\u003e\n\u003cp\u003eniuse currently drives niucode's turn loop itself and owns a small renderer, because \u003ccode\u003eniucode-cli\u003c/code\u003e is a binary with no library target. Reusing niucode's TUI would remove the duplicate front end, which raises the obvious question: if niuse reuses the TUI, why not merge it into niucode?\u003c/p\u003e\n\u003cp\u003eTwo facts make the merge tempting:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe shared surface is large: loop, session, tools, renderer, approval UI, diff preview.\u003c/li\u003e\n\u003cli\u003eEvery shared change currently costs a revision bump and a contract test.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eTwo facts push the other way:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eniucode's positioning is a \u003cstrong\u003eminimal, observable coding harness\u003c/strong\u003e that deliberately refuses long-term memory, resident services, and product defaults. Merging a companion into that repo changes what niucode is.\u003c/li\u003e\n\u003cli\u003eThe two projects have different release cadences and different failure modes: kernel breakage versus product annoyance.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eDecision\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eKeep two repositories.\u003c/strong\u003e niucode is the kernel and the reference UI; niuse is the product layer and the identity.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eMove the front end upstream, not the product.\u003c/strong\u003e \u003ccode\u003eniucode-cli\u003c/code\u003e should expose a reusable library (TUI, runtime entry) plus a small turn-hook surface:\n\u003cul\u003e\n\u003cli\u003eaugment the system prompt before a turn;\u003c/li\u003e\n\u003cli\u003eobserve a finished turn (for candidate extraction);\u003c/li\u003e\n\u003cli\u003ereceive session lifecycle events.\nniuse implements the hooks and deletes its own renderer once the shared TUI is usable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eKeep the product in niuse\u003c/strong\u003e: identity, user model, memory, journal, loops, protocol blocks, expiry/conflict/privacy policy, product defaults (model, permissions, persona).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePin what you consume.\u003c/strong\u003e \u003ccode\u003eniucode.rev\u003c/code\u003e fixes the revision required CI and deployments build against. The pin moves at most weekly through \u003ccode\u003escripts/sync-niucode.sh\u003c/code\u003e; a nightly job tests niucode \u003ccode\u003emain\u003c/code\u003e so drift is visible early.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eUpstream first.\u003c/strong\u003e Any capability that a generic niucode user would want lands in niucode first. niuse never forks kernel files.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eSet a merge trigger instead of debating forever.\u003c/strong\u003e After the library split lands, if niuse's product-only surface falls below roughly 1,000 lines and separate releases stop mattering, merging becomes reasonable. Until then, two repos buy a clean kernel story and independent cadence.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2\u003eConsequences\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eBetter:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eReusing the TUI removes the largest duplication without diluting niucode's positioning.\u003c/li\u003e\n\u003cli\u003eThe contract test plus pinned revision turns \"did upstream break us?\" into a CI signal.\u003c/li\u003e\n\u003cli\u003eProduct decisions and kernel decisions keep separate ADR trails and release notes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eWorse:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eniucode must grow a library API and hooks, which is real design work and must stay generic.\u003c/li\u003e\n\u003cli\u003eniuse still carries a binary, product defaults, and the hook implementation.\u003c/li\u003e\n\u003cli\u003eThe weekly bump is a recurring chore, even if a small one.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAccepted trade-off:\u003c/strong\u003e a little ceremony now beats either a fork or a premature monorepo. If the ceremony stops paying for itself, the merge trigger is explicit.\u003c/p\u003e\n\u003ch2\u003eAlternatives\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eOption\u003c/th\u003e\u003cth\u003eRejected because\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eMerge niuse into niucode now\u003c/td\u003e\u003ctd\u003eChanges what niucode is, couples releases, and mixes two boards and two audiences before the boundary is settled\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eAdd \u003ccode\u003e--profile personal\u003c/code\u003e to niucode\u003c/td\u003e\u003ctd\u003eHides a product inside the kernel; the personal layer would inherit kernel release pressure and vice versa\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eFork niucode inside niuse\u003c/td\u003e\u003ctd\u003eDuplicates the loop and the front end, and guarantees drift\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eKeep the duplicate renderer forever\u003c/td\u003e\u003ctd\u003eCheapest this month, most expensive this year; every TUI improvement has to be rebuilt twice\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n","path":"docs/adr/0003-kernel-product-boundary.md","excerpt":"Keep two repositories. Upstream a reusable CLI library and turn hooks; niuse owns identity, memory, policy, and product defaults. Merge only if the product layer becomes thin enough that separate releases stop mattering."},{"id":"compat","title":"niucode compatibility","kind":"doc","status":"living","order":30,"summary":"Pinned niucode revision, the weekly bump ritual, and the nightly check against main.","body_html":"\u003ch2\u003ePolicy\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eniuse pins niucode in \u003ccode\u003eniucode.rev\u003c/code\u003e; required CI and Pages check out exactly that commit.\u003c/li\u003e\n\u003cli\u003eThe pin moves at most once a week, through \u003ccode\u003escripts/sync-niucode.sh\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eA nightly workflow runs the same tests against niucode \u003ccode\u003emain\u003c/code\u003e. Failures are an early signal, not a pull-request gate.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003escripts/check-niucode-drift.sh\u003c/code\u003e reports when the local sibling checkout no longer matches the pin.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe front-end seam is proposed upstream in \u003ca href=\"https://github.com/niuverse/niucode/blob/main/docs/adr/0032-embedding-library-surface.md\"\u003eADR-0032\u003c/a\u003e; this document tracks the call surface niuse uses today.\u003c/p\u003e\n\u003cp\u003eThe contract is deliberately small: \u003ccode\u003erun_with_history\u003c/code\u003e, \u003ccode\u003eAgentConfig\u003c/code\u003e, \u003ccode\u003eproject_history\u003c/code\u003e, \u003ccode\u003eSessionLog\u003c/code\u003e and \u003ccode\u003eEvent\u003c/code\u003e, the provider trait, credentials, sandbox and approval types, per-turn \u003ccode\u003eworking_dir\u003c/code\u003e on one session, and approval denial carrying a structured preview. \u003ccode\u003ecrates/niuse-cli/tests/niucode_contract.rs\u003c/code\u003e exercises them offline with \u003ccode\u003eScriptedProvider\u003c/code\u003e, so the check costs no tokens.\u003c/p\u003e\n\u003ch2\u003eMatrix\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eniuse\u003c/th\u003e\u003cth\u003eniucode\u003c/th\u003e\u003cth\u003estatus\u003c/th\u003e\u003cth\u003eupdated\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e0.1.0\u003c/td\u003e\u003ctd\u003e\u003ccode\u003e95f5303\u003c/code\u003e\u003c/td\u003e\u003ctd\u003ecurrent pin; contract tests pass\u003c/td\u003e\u003ctd\u003e2026-10-21\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e0.1.0\u003c/td\u003e\u003ctd\u003e\u003ccode\u003eb5f66ba\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eprevious pin; contract tests pass\u003c/td\u003e\u003ctd\u003e2026-10-21\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003eWeekly ritual\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003e./scripts/sync-niucode.sh \u0026lt;rev\u0026gt;   # writes niucode.rev, runs tests + dashboard check\ncargo xtask dashboard             # refresh the board\n# update the matrix above, commit niucode.rev and the generated board\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIf the nightly job is red, read the contract test failure first. A break there usually means one of two things: an API niuse uses changed shape, or the behaviour behind it changed. Fix upstream when the change is generic; adapt niuse when it is product-specific.\u003c/p\u003e\n","path":"docs/compat.md","excerpt":"Pinned niucode revision, the weekly bump ritual, and the nightly check against main."},{"id":"dogfood","title":"Dogfood log","kind":"guide","status":"living","order":40,"summary":"Ten-day protocol: one row per day, numbers from stats --json, plus one concrete memory win or disagreement.","body_html":"\u003ch2\u003eWhy\u003c/h2\u003e\n\u003cp\u003eM2-001 is a product acceptance gate, not a coding task. It needs ten days of real use, recorded while the context is fresh. The record is deliberately small: one row per day, two numbers, one sentence.\u003c/p\u003e\n\u003ch2\u003eDaily ritual (two minutes)\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniuse stats --days 1 --json\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAppend one row below. \u003ccode\u003eproposed\u003c/code\u003e / \u003ccode\u003eaccepted\u003c/code\u003e come from the JSON; \u003ccode\u003enote\u003c/code\u003e is a concrete memory win, a disagreement, or \u003ccode\u003e-\u003c/code\u003e. Do not reconstruct a missed day later; a gap is honest data.\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003edate\u003c/th\u003e\u003cth\u003eturns\u003c/th\u003e\u003cth\u003eproposed\u003c/th\u003e\u003cth\u003eaccepted\u003c/th\u003e\u003cth\u003enote\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003eYYYY-MM-DD\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003e-\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003eRules\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA \"memory win\" means it cited a past judgement and saved a round of explanation, or avoided a repeated mistake. Name the entry id if possible.\u003c/li\u003e\n\u003cli\u003eA \"disagreement\" means it pushed back and you changed your mind. Record what changed.\u003c/li\u003e\n\u003cli\u003eIf acceptance is zero for several days, stop and inspect the candidates instead of pushing through. Noise is a product bug.\u003c/li\u003e\n\u003cli\u003eKeep the store under 50 entries. If it grows faster, the proposal bar is too low.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eWeekly check\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003eniuse stats --days 7 --trend\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLook for the direction, not the absolute number: acceptance should rise as the store matures, and the notes should become more specific.\u003c/p\u003e\n\u003ch2\u003eDone\u003c/h2\u003e\n\u003cp\u003eTen rows, acceptance at or above 60%, at least three cited judgements, at least one recorded disagreement. Then M2-001 can move to review, and the next milestone is decided from the notes rather than from the backlog.\u003c/p\u003e\n","path":"docs/dogfood.md","excerpt":"Ten-day protocol: one row per day, numbers from stats --json, plus one concrete memory win or disagreement."},{"id":"docs-readme","title":"Dashboard guide","kind":"guide","status":"living","order":90,"summary":"Sources, generation commands, the four views, and the ritual for adding modules, cards, and docs.","body_html":"\u003ch2\u003eWhat this is\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003edocs/index.html\u003c/code\u003e is the project's only architecture reading surface: Architecture, Work, Docs, and Decisions share one three-column shell. It is generated from repository sources, opens offline, and needs no server.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sh\"\u003ecargo xtask dashboard          # writes docs/index.html and docs/dashboard/model.json\ncargo xtask dashboard --check  # CI: fails when generated output is stale or references break\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eGeneration is deterministic: the same inputs produce the same HTML. \u003ccode\u003ereceipt.json\u003c/code\u003e records the build time, git revision, and input list, but is not part of the staleness check.\u003c/p\u003e\n\u003ch2\u003eFour views\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eArchitecture (default)\u003c/strong\u003e: modules by layer, dependency arrows, contracts, and source. Selecting a module focuses its relations; status only shows implementation state, not progress.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eWork\u003c/strong\u003e: one file per card, a handoff surface filtered by milestone. No completion rates, WIP counts, or progress bars.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDocs\u003c/strong\u003e: a Markdown index with a reading pane; supports deep links such as \u003ccode\u003e#/docs/adr-0001\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eDecisions\u003c/strong\u003e: ADR cards plus a \u003ccode\u003ekind = \"decision\"\u003c/code\u003e timeline. Completion logs do not belong here.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eSources\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003edocs/\n  index.html                # generated, committed, openable via file://\n  dashboard/\n    project.json            # project, milestones, layers, modules, relations, decisions\n    template.html           # single-file shell\n    style.css               # three-column layout and views\n    app.js                  # framework-free rendering\n    model.json              # generated\n    receipt.json            # build receipt, gitignored\n  board/\n    M0-001-five-stores.md   # one card per file\n  adr/\n    0001-memory-layer.md\n    0002-identity-layer.md\n    0003-kernel-product-boundary.md\n  architecture.md\n  compat.md\n  plan.md\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2\u003eAdding things\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eAdd a module\u003c/strong\u003e: add an entry to \u003ccode\u003emodules\u003c/code\u003e in \u003ccode\u003eproject.json\u003c/code\u003e. Its \u003ccode\u003elayer\u003c/code\u003e must exist and \u003ccode\u003epaths\u003c/code\u003e must point at real files; any module not marked \u003ccode\u003eplanned\u003c/code\u003e needs at least one existing path.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdd a work card\u003c/strong\u003e: create a Markdown file under \u003ccode\u003edocs/board/\u003c/code\u003e. The TOML frontmatter must include \u003ccode\u003eid\u003c/code\u003e, \u003ccode\u003etitle\u003c/code\u003e, \u003ccode\u003estatus\u003c/code\u003e, \u003ccode\u003emilestone\u003c/code\u003e, \u003ccode\u003esize\u003c/code\u003e, and \u003ccode\u003eupdated\u003c/code\u003e; \u003ccode\u003edone\u003c/code\u003e requires \u003ccode\u003ecompleted\u003c/code\u003e, and \u003ccode\u003eblocked\u003c/code\u003e requires \u003ccode\u003eblocked_reason\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdd a doc\u003c/strong\u003e: any \u003ccode\u003e.md\u003c/code\u003e under \u003ccode\u003edocs/\u003c/code\u003e with TOML frontmatter between \u003ccode\u003e+++\u003c/code\u003e lines, including at least \u003ccode\u003eid\u003c/code\u003e, \u003ccode\u003etitle\u003c/code\u003e, and \u003ccode\u003ekind\u003c/code\u003e. ADR \u003ccode\u003estatus\u003c/code\u003e accepts only \u003ccode\u003eproposed\u003c/code\u003e, \u003ccode\u003eaccepted\u003c/code\u003e, \u003ccode\u003esuperseded\u003c/code\u003e, \u003ccode\u003erejected\u003c/code\u003e, or \u003ccode\u003edraft\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAdd a decision\u003c/strong\u003e: write an ADR, or add a \u003ccode\u003ekind = \"decision\"\u003c/code\u003e event to \u003ccode\u003eproject.json\u003c/code\u003e. When doing both, link them with \u003ccode\u003erefs\u003c/code\u003e.\u003c/p\u003e\n\u003ch2\u003eDiscipline\u003c/h2\u003e\n\u003cp\u003eThe board is read-only; the browser cannot write back. State changes go through the repository, so the board never becomes a second source of truth. Run \u003ccode\u003e--check\u003c/code\u003e before committing.\u003c/p\u003e\n","path":"docs/README.md","excerpt":"Sources, generation commands, the four views, and the ritual for adding modules, cards, and docs."}],"events":[{"date":"2026-10-21","kind":"decision","title":"Position niuse as cross-project engineering memory","detail":"Not a general agent, not a second brain. Only preferences, decisions, and pitfalls; project knowledge stays in AGENTS.md.","refs":["adr-0001","plan"]},{"date":"2026-10-21","kind":"decision","title":"Keep the identity layer separate from memory","detail":"identity is human-written and the agent may only propose; journal and loops are automatic; memory requires confirmation. What persists is the identity, not a process.","refs":["adr-0002"]},{"date":"2026-10-21","kind":"decision","title":"Emit protocol blocks in-band from the main model","detail":"No extra model call. Missing a memory is acceptable; recording a wrong one is not. Streaming needs a tail buffer.","refs":["plan","M0-002"]},{"date":"2026-10-21","kind":"milestone","title":"MVP implemented","detail":"Five stores, prompt, protocol, REPL, driver, and bootstrap landed; 35 core tests and 2 bootstrap tests pass.","refs":["M0-001","M0-002","M0-003","M0-004","M0-005"]},{"date":"2026-10-21","kind":"decision","title":"Reuse niucode's architecture-first board","detail":"Same xtask generator and three-column shell, with a niuse project model. The board records architecture and implementation, not runtime monitoring.","refs":["M0-006"]},{"date":"2026-10-21","kind":"decision","title":"Keep two repos and move the front end upstream","detail":"niucode owns the kernel, TUI, and hooks; niuse owns identity, memory, policy, and defaults. Merge only if the product layer becomes thin enough that separate releases stop mattering.","refs":["adr-0003","M4-001"]}],"meta":{"schema_version":1,"cards":33,"modules":10,"docs":8,"generator":"cargo xtask dashboard"}}</script>
<script>
(() => {
  'use strict';

  const DATA = JSON.parse(document.getElementById('niuse-data').textContent);

  const VIEWS = ['arch', 'work', 'docs', 'decisions'];
  const VIEW_ALIASES = { board: 'work', timeline: 'decisions' };
  const STATUS_COLUMNS = ['backlog', 'ready', 'doing', 'review', 'done'];
  const STATUS_LABEL = {
    backlog: 'Backlog',
    ready: 'Ready',
    doing: 'Doing',
    review: 'Review',
    done: 'Done',
    blocked: 'Blocked',
    planned: 'Planned',
    active: 'Active',
  };
  const STATUS_COLORS = {
    backlog: 'var(--st-backlog)',
    ready: 'var(--st-ready)',
    doing: 'var(--st-doing)',
    review: 'var(--st-review)',
    done: 'var(--st-done)',
    blocked: 'var(--st-blocked)',
  };
  const LAYER_COLORS = {
    interface: 'var(--layer-interface)',
    engine: 'var(--layer-engine)',
    adapters: 'var(--layer-adapters)',
    state: 'var(--layer-state)',
    engineering: 'var(--layer-engineering)',
  };
  const KIND_LABEL = { adr: 'ADR', doc: 'Doc', guide: 'Guide' };

  const canvas = document.getElementById('canvas');
  const details = document.getElementById('details');
  const search = document.getElementById('search');
  const themeButton = document.getElementById('theme-toggle');

  const cardById = new Map(DATA.cards.map((card) => [card.id, card]));
  const moduleById = new Map(DATA.modules.map((module) => [module.id, module]));
  const docById = new Map(DATA.docs.map((doc) => [doc.id, doc]));
  const milestoneById = new Map(DATA.milestones.map((milestone) => [milestone.id, milestone]));
  const layerById = new Map(DATA.layers.map((layer) => [layer.id, layer]));

  const state = {
    view: 'arch',
    milestone: currentMilestoneId(),
    selection: null,
    hoverModule: null,
    query: '',
    sourceIndex: 0,
  };

  let edgeFrame = 0;

  function currentMilestoneId() {
    const active = DATA.milestones.find((milestone) => milestone.status === 'active');
    return active ? active.id : 'all';
  }

  function normalizeView(view) {
    return VIEW_ALIASES[view] || view;
  }

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (character) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    }[character]));
  }

  function fmtDate(value) {
    return value ? value.slice(5) : '—';
  }

  function docKind(kind) {
    return KIND_LABEL[kind] || String(kind || 'doc').toUpperCase();
  }

  function layerColor(id) {
    return LAYER_COLORS[id] || 'var(--layer-engineering)';
  }

  function layerName(id) {
    const layer = layerById.get(id);
    return layer ? layer.name : id;
  }

  function moduleTitle(id) {
    const module = moduleById.get(id);
    return module ? module.title : id;
  }

  function isCardSelected(id) {
    return state.selection?.type === 'card' && state.selection.id === id;
  }

  function isModuleSelected(id) {
    return state.selection?.type === 'module' && state.selection.id === id;
  }

  function isDocSelected(id) {
    return state.selection?.type === 'doc' && state.selection.id === id;
  }

  function statusBadge(status) {
    const label = STATUS_LABEL[status] || status;
    return `<span class="badge badge-${esc(status)}"><span class="dot"></span>${esc(label)}</span>`;
  }

  function currentFocus() {
    const milestone = DATA.milestones.find((item) => item.status === 'active');
    if (!milestone) return null;
    const cards = DATA.cards.filter((card) => card.milestone === milestone.id && card.status !== 'done');
    const card = cards.find((item) => item.status === 'doing')
      || cards.find((item) => item.status === 'ready')
      || cards.find((item) => item.status === 'review')
      || cards.find((item) => item.status === 'backlog');
    return { milestone, card };
  }

  function relatedModules(id) {
    const related = new Set();
    DATA.relations.forEach((relation) => {
      if (relation.from === id) related.add(relation.to);
      if (relation.to === id) related.add(relation.from);
    });
    return related;
  }

  function cardMatches(card, query) {
    if (!query) return true;
    return [card.id, card.title, card.module, card.status, card.priority]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function moduleMatches(module, query) {
    if (!query) return true;
    return [module.id, module.title, module.summary, module.layer, module.status]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function docMatches(doc, query) {
    if (!query) return true;
    return [doc.id, doc.title, doc.kind, doc.status, doc.summary, doc.excerpt, doc.path]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function eventMatches(event, query) {
    if (!query) return true;
    return [event.date, event.kind, event.title, event.detail, ...(event.refs || [])]
      .filter(Boolean)
      .join(' ')
      .toLowerCase()
      .includes(query);
  }

  function viewHead(kicker, title, subtitle, stats) {
    return `<div class="view-head">
      <div class="view-head-main">
        <div class="kicker">${esc(kicker)}</div>
        <h1 class="view-title">${esc(title)}</h1>
        ${subtitle ? `<p class="view-sub">${esc(subtitle)}</p>` : ''}
      </div>
      ${stats ? `<div class="stats">${stats}</div>` : ''}
    </div>`;
  }

  function compareCards(a, b) {
    const priority = { P0: 0, P1: 1, P2: 2 };
    const pa = priority[a.priority] ?? 9;
    const pb = priority[b.priority] ?? 9;
    return pa - pb || a.id.localeCompare(b.id);
  }

  function renderTabs() {
    document.querySelectorAll('.tab').forEach((tab) => {
      const active = tab.dataset.view === state.view;
      tab.classList.toggle('active', active);
      if (active) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });
  }

  function renderChrome() {
    document.getElementById('project-status').textContent = DATA.project.status;
    document.getElementById('module-count').textContent = DATA.modules.length;
    document.getElementById('doc-count').textContent = DATA.docs.length;

    const focus = currentFocus();
    let foot = '';
    if (focus?.card) {
      foot += `<div class="focus-block"><div class="focus-kicker">Current focus · ${esc(focus.milestone.id)}</div><button class="focus-card" type="button" data-card="${esc(focus.card.id)}"><span class="focus-id">${esc(focus.card.id)} · ${esc(STATUS_LABEL[focus.card.status] || focus.card.status)}</span><span class="focus-title">${esc(focus.card.title)}</span></button></div>`;
    } else if (focus) {
      foot += `<div class="focus-block"><div class="focus-kicker">Current focus · ${esc(focus.milestone.id)}</div><div class="focus-empty">${esc(focus.milestone.goal)}</div></div>`;
    }
    foot += `<div class="rail-meta"><span>${DATA.modules.length} modules · ${DATA.relations.length} relations</span><span>offline · schema v${DATA.meta.schema_version}</span></div>`;
    document.getElementById('rail-foot').innerHTML = foot;

    const placeholders = {
      arch: 'Filter modules…',
      work: 'Filter cards…',
      docs: 'Filter documents…',
      decisions: 'Filter decisions…',
    };
    search.placeholder = placeholders[state.view] || 'Filter…';
  }

  function renderRail() {
    document.getElementById('map-nav').innerHTML = renderMapNav();
    document.getElementById('rail-docs').innerHTML = renderRailDocs();
  }

  function renderMapNav() {
    return DATA.layers.map((layer) => {
      const modules = DATA.modules.filter((module) => module.layer === layer.id);
      const rows = modules.map((module) => {
        const active = isModuleSelected(module.id);
        return `<button class="map-module${active ? ' active' : ''}" type="button" data-module="${esc(module.id)}" title="${esc(module.summary)}">
          <span class="map-dot ${esc(module.status)}"></span>
          <span class="map-title">${esc(module.title)}</span>
        </button>`;
      }).join('');
      return `<div class="map-layer">
        <div class="map-layer-head"><span class="map-layer-dot" style="--c:${layerColor(layer.id)}"></span><span>${esc(layer.name)}</span><span class="map-layer-n">${modules.length}</span></div>
        ${rows}
      </div>`;
    }).join('');
  }

  function renderRailDocs() {
    return DATA.docs.map((doc) => `<button class="rail-doc${isDocSelected(doc.id) ? ' active' : ''}" type="button" data-doc="${esc(doc.id)}" title="${esc(doc.title)}">
      <span class="rd-kind rd-kind-${esc(doc.kind)}">${esc(docKind(doc.kind))}</span><span class="rd-title">${esc(doc.title)}</span>
    </button>`).join('');
  }

  function render() {
    document.body.dataset.view = state.view;
    renderTabs();
    renderChrome();
    renderRail();
    renderCanvas();
    renderDetails();
  }

  function renderCanvas() {
    const previousView = canvas.dataset.view || '';
    const previousScroll = canvas.scrollTop;
    let html = '';

    if (state.view === 'arch') html = archView();
    else if (state.view === 'work') html = workView();
    else if (state.view === 'docs') html = docsView();
    else html = decisionsView();

    canvas.innerHTML = html;
    canvas.dataset.view = state.view;
    canvas.scrollTop = previousView === state.view ? previousScroll : 0;

    if (state.view === 'arch') scheduleEdges();
  }

  function activeArchModuleId() {
    if (state.selection?.type === 'module') return state.selection.id;
    return state.hoverModule;
  }

  function syncArchFocusClasses() {
    const arch = document.getElementById('arch-canvas');
    if (!arch) return;
    const focusId = activeArchModuleId();
    const related = focusId ? relatedModules(focusId) : new Set();
    arch.classList.toggle('has-focus', Boolean(focusId));
    arch.querySelectorAll('.module-card').forEach((card) => {
      const id = card.dataset.module;
      const isSelected = id === state.selection?.id && state.selection?.type === 'module';
      const isFocused = id === focusId;
      const isRel = related.has(id);
      card.classList.toggle('selected', isSelected);
      card.classList.toggle('related', Boolean(focusId && !isFocused && isRel));
      card.classList.toggle('muted', Boolean(focusId && !isFocused && !isRel));
    });
    scheduleEdges();
  }

  function archView() {
    const query = state.query.toLowerCase();
    const focusId = activeArchModuleId();
    const selected = state.selection?.type === 'module' ? moduleById.get(state.selection.id) : null;
    const related = focusId ? relatedModules(focusId) : new Set();
    const stats = `<span><strong>${DATA.modules.length}</strong> modules</span><span class="sep">·</span><span><strong>${DATA.layers.length}</strong> layers</span><span class="sep">·</span><span><strong>${DATA.relations.length}</strong> relations</span>`;

    let html = viewHead(
      'Architecture',
      'How niuse is shaped',
      'Semantic layers, not a directory tree. Hover or select a module to focus its dependency flow; status only shows implementation state.',
      stats,
    );

    if (selected) {
      html += `<div class="focus-bar"><span class="focus-label">Focused module</span><button class="focus-chip" type="button" data-close>${esc(selected.title)}<span aria-hidden="true">×</span></button></div>`;
    }

    html += `<div class="arch-canvas${focusId ? ' has-focus' : ''}" id="arch-canvas"><svg class="edges" id="arch-edges" aria-hidden="true"></svg><svg class="edges edges-fg" id="arch-edges-fg" aria-hidden="true"></svg>`;

    DATA.layers.forEach((layer, index) => {
      const modules = DATA.modules.filter((module) => module.layer === layer.id);
      html += `<section class="arch-layer" style="--layer-color:${layerColor(layer.id)}">
        <div class="layer-label">
          <div class="layer-head-row">
            <span class="layer-index">${String(index + 1).padStart(2, '0')}</span>
            <h2>${esc(layer.name)}</h2>
          </div>
          <p>${esc(layer.note)}</p>
        </div>
        <div class="layer-cards">${modules.map((module) => moduleCard(module, query, focusId, related)).join('') || '<div class="empty">No modules yet.</div>'}</div>
      </section>`;
    });

    html += `</div>`;

    if (!DATA.modules.some((module) => moduleMatches(module, query))) {
      html += `<div class="empty" style="margin-top:12px">No modules match this filter.</div>`;
    }

    return html;
  }

  function moduleCard(module, query, focusId, related) {
    const selected = isModuleSelected(module.id);
    const focused = module.id === focusId;
    const isRelated = related.has(module.id);
    const muted = focusId && !focused && !isRelated;
    const dim = query && !moduleMatches(module, query);
    const classes = [
      'module-card',
      module.status === 'planned' ? 'planned' : '',
      selected ? 'selected' : '',
      !focused && isRelated ? 'related' : '',
      muted ? 'muted' : '',
      dim ? 'dim' : '',
    ].filter(Boolean).join(' ');

    return `<button class="${classes}" type="button" data-module="${esc(module.id)}" style="--module-color:${layerColor(module.layer)}" aria-pressed="${selected}">
      <span class="module-head"><span class="module-id">${esc(module.id)}</span><span class="module-status">${esc(STATUS_LABEL[module.status] || module.status)}</span></span>
      <span class="module-title">${esc(module.title)}</span>
      <span class="module-summary">${esc(module.summary)}</span>
      <span class="module-path">${esc(module.paths?.[0] || '—')}</span>
    </button>`;
  }

  function workView() {
    const query = state.query.toLowerCase();
    const cards = DATA.cards.filter((card) => {
      const inMilestone = state.milestone === 'all' || card.milestone === state.milestone;
      return inMilestone && cardMatches(card, query);
    });
    const blocked = cards.filter((card) => card.status === 'blocked');

    let html = viewHead(
      'Work',
      'Handoff, not a dashboard',
      'Cards are the agent handoff surface. Progress lives here and in git, not on the Architecture screen.',
    );

    html += `<div class="filters">${milestoneFilter()}</div>`;

    if (blocked.length) {
      html += `<div class="blocked-strip"><div class="blocked-label">Blocked</div><div class="blocked-cards">${blocked.map(cardHtml).join('')}</div></div>`;
    }

    html += `<div class="board">${STATUS_COLUMNS.map((status) => boardColumn(status, cards)).join('')}</div>`;

    if (!cards.length) {
      html += `<div class="empty" style="margin-top:12px">No cards match this filter.</div>`;
    }

    return html;
  }

  function milestoneFilter() {
    const items = [
      ...DATA.milestones.map((milestone) => ({ id: milestone.id, label: `${milestone.id} · ${milestone.title}`, title: milestone.goal })),
      { id: 'all', label: 'All milestones', title: 'Every milestone' },
    ];
    return items.map((item) => `<button class="filter${state.milestone === item.id ? ' active' : ''}" type="button" data-milestone="${esc(item.id)}" title="${esc(item.title)}" aria-pressed="${state.milestone === item.id}">${esc(item.label)}</button>`).join('');
  }

  function boardColumn(status, cards) {
    const items = cards.filter((card) => card.status === status).sort(compareCards);
    return `<section class="column${items.length ? '' : ' empty'}">
      <div class="column-head"><span class="col-dot" style="--c:${STATUS_COLORS[status]}"></span>${esc(STATUS_LABEL[status])}</div>
      <div class="cards">${items.map(cardHtml).join('')}</div>
    </section>`;
  }

  function cardHtml(card) {
    const module = card.module ? moduleById.get(card.module) : null;
    const selected = isCardSelected(card.id);
    return `<button class="card${card.status === 'done' ? ' done' : ''}${card.status === 'blocked' ? ' blocked' : ''}${selected ? ' selected' : ''}" type="button" data-card="${esc(card.id)}" aria-pressed="${selected}">
      <span class="card-top"><span class="card-id">${esc(card.id)}</span><span class="card-badges">${card.priority ? `<span class="prio prio-${esc(card.priority.toLowerCase())}">${esc(card.priority)}</span>` : ''}<span class="size">${esc(card.size)}</span></span></span>
      <span class="card-title">${esc(card.title)}</span>
      <span class="card-foot"><span>${module ? esc(module.title) : '—'}</span><span>${esc(fmtDate(card.updated))}</span></span>
    </button>`;
  }

  function docsView() {
    const query = state.query.toLowerCase();
    const docs = DATA.docs.filter((doc) => docMatches(doc, query));
    const adrCount = DATA.docs.filter((doc) => doc.kind === 'adr').length;
    const stats = `<span><strong>${DATA.docs.length}</strong> documents</span><span class="sep">·</span><span><strong>${adrCount}</strong> ADRs</span>`;

    return viewHead(
      'Docs',
      'Source material',
      'ADRs, architecture notes, and maintenance guides. Open one in the right pane; deep links are shareable.',
      stats,
    ) + `<div class="doc-grid">${docs.map(docCard).join('')}${docs.length ? '' : '<div class="empty">No documents match this filter.</div>'}</div>`;
  }

  function docCard(doc) {
    const selected = isDocSelected(doc.id);
    return `<button class="doc-card${selected ? ' selected' : ''}" type="button" data-doc="${esc(doc.id)}" aria-pressed="${selected}">
      <span class="doc-top"><span class="doc-kind doc-kind-${esc(doc.kind)}">${esc(docKind(doc.kind))}</span>${doc.status ? `<span class="doc-status">${esc(doc.status)}</span>` : ''}</span>
      <span class="doc-title">${esc(doc.title)}</span>
      <span class="doc-excerpt">${esc(doc.excerpt)}</span>
      <span class="doc-path">${esc(doc.path)}</span>
    </button>`;
  }

  function decisionsView() {
