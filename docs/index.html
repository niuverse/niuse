 and sessions\"\n    },\n    {\n      \"id\": \"engineering\",\n      \"name\": \"Engineering\",\n      \"note\": \"build, dashboard, tests\"\n    }\n  ],\n  \"modules\": [\n    {\n      \"id\": \"cli\",\n      \"title\": \"CLI\",\n      \"layer\": \"interface\",\n      \"status\": \"done\",\n      \"summary\": \"Clap entry, subcommand dispatch, offline commands, and bootstrap / review wiring.\",\n      \"contract\": \"Parse flags and dispatch; offline commands never construct a provider; only agent commands resolve credentials.\",\n      \"paths\": [\n        \"crates/niuse-cli/src/main.rs\",\n        \"crates/niuse-cli/src/commands.rs\",\n        \"crates/niuse-cli/src/config.rs\"\n      ],\n      \"notes\": [\n        \"Bare niuse starts the REPL.\",\n        \"mem / loops / journal / identity / status work offline.\",\n        \"sandbox / approval / network keep niucode's semantics.\"\n      ]\n    },\n    {\n      \"id\": \"repl\",\n      \"title\": \"REPL\",\n      \"layer\": \"interface\",\n      \"status\": \"done\",\n      \"summary\": \"Interactive conversation, slash commands, candidate confirmation, editing, and streaming render.\",\n      \"contract\": \"Build one AgentConfig per turn; call run_with_history only through the driver; memory writes always happen after confirmation.\",\n      \"paths\": [\n        \"crates/niuse-cli/src/repl.rs\",\n        \"crates/niuse-cli/src/render.rs\"\n      ],\n      \"notes\": [\n        \"The tail buffer keeps protocol blocks from leaking to the user.\",\n        \"At most one candidate per turn; after a rejection the session stops proposing.\",\n        \"Ctrl-C cancels the current turn; Ctrl-D exits.\",\n        \"The system prompt is assembled once per session.\"\n      ]\n    },\n    {\n      \"id\": \"frontend\",\n      \"title\": \"Shared front end\",\n      \"layer\": \"interface\",\n      \"status\": \"planned\",\n      \"summary\": \"Reuse niucode's TUI and runtime through a library target plus turn hooks; retire niuse's renderer.\",\n      \"contract\": \"niucode-cli exposes a library and hooks for prompt augmentation, turn-end observation, and session lifecycle; niuse implements them.\",\n      \"paths\": [],\n      \"notes\": [\n        \"Blocked on niucode M6 terminal ownership.\",\n        \"The hook surface must stay generic; memory policy remains in niuse.\"\n      ]\n    },\n    {\n      \"id\": \"prompt\",\n      \"title\": \"Prompt\",\n      \"layer\": \"engine\",\n      \"status\": \"done\",\n      \"summary\": \"Stable-prefix system prompt assembly with per-section budget trimming.\",\n      \"contract\": \"Takes the five stores and a date, returns a Composition; reads no disk, calls no model, writes no state.\",\n      \"paths\": [\n        \"crates/niuse-core/src/prompt.rs\"\n      ],\n      \"notes\": [\n        \"Fixed order: persona → identity → user → memory → protocol → today → loops → journal.\",\n        \"Expired memory is not injected; entries older than 30 days carry an unverified label.\",\n        \"About 4k tokens; over budget, drop the oldest unverified facts first.\"\n      ]\n    },\n    {\n      \"id\": \"protocol\",\n      \"title\": \"Protocol\",\n      \"layer\": \"engine\",\n      \"status\": \"done\",\n      \"summary\": \"Parsing and streaming-aware stripping of the in-band memory / loop / journal blocks.\",\n      \"contract\": \"StreamFilter releases only safe text; parse returns visible + blocks; no storage access.\",\n      \"paths\": [\n        \"crates/niuse-core/src/candidate.rs\"\n      ],\n      \"notes\": [\n        \"No extra model call.\",\n        \"An unterminated block is shown as ordinary text instead of silently eaten.\",\n        \"journal and loop are written automatically; memory requires confirmation.\"\n      ]\n    },\n    {\n      \"id\": \"policy\",\n      \"title\": \"Policy\",\n      \"layer\": \"engine\",\n      \"status\": \"done\",\n      \"summary\": \"Soft expiry, conflict similarity, and secret-pattern scanning.\",\n      \"contract\": \"Pure functions; refusal is the default, and overriding requires an explicit --force.\",\n      \"paths\": [\n        \"crates/niuse-core/src/policy.rs\"\n      ],\n      \"notes\": [\n        \"Character-bigram Jaccard works for both Chinese and English.\",\n        \"Sharing a tag lowers the threshold to 0.35.\",\n        \"The secret scan is a backstop, not a guarantee.\"\n      ]\n    },\n    {\n      \"id\": \"driver\",\n      \"title\": \"Driver\",\n      \"layer\": \"adapters\",\n      \"status\": \"done\",\n      \"summary\": \"The niucode boundary: open and resume sessions, project history, per-turn cwd, forward events.\",\n      \"contract\": \"Only this file imports niucode-agent; target about 200 lines; do not change the loop or fork it.\",\n","truncated":true}]}],"relations":[{"from":"cli","to":"repl","label":"dispatch"},{"from":"repl","to":"driver","label":"run turn"},{"from":"repl","to":"prompt","label":"system prompt"},{"from":"repl","to":"protocol","label":"strip blocks"},{"from":"repl","to":"stores","label":"confirm / journal"},{"from":"driver","to":"stores","label":"thread path"},{"from":"bootstrap","to":"policy","label":"dedupe / scan"},{"from":"bootstrap","to":"stores","label":"inbox"},{"from":"prompt","to":"stores","label":"load five"}],"cards":[{"id":"M0-001","title":"Five stores and atomic storage","status":"done","milestone":"M0","module":"stores","size":"L","priority":"P0","updated":"2026-10-21","completed":"2026-10-21","depends_on":[],"docs":["architecture","adr-0001","adr-0002"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFive persistent stores: \u003ccode\u003eidentity.md\u003c/code\u003e, \u003ccode\u003euser.md\u003c/code\u003e, \u003ccode\u003ememory/\u003c/code\u003e, \u003ccode\u003ejournal/\u003c/code\u003e, \u003ccode\u003eloops.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ePlain Markdown; directories \u003ccode\u003e0700\u003c/code\u003e, files \u003ccode\u003e0600\u003c/code\u003e; write to a temporary file, then rename.\u003c/li\u003e\n\u003cli\u003eMemory split into \u003ccode\u003epreferences.md\u003c/code\u003e / \u003ccode\u003elessons.md\u003c/code\u003e; one journal file per month, merged by day.\u003c/li\u003e\n\u003cli\u003eCivil dates computed in-tree, no timezone dependency.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nRound-trip tests for all five stores.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nSame-day journal appends merge; different days stay ordered.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPermissions verified as \u003ccode\u003e0700\u003c/code\u003e / \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nMissing \u003ccode\u003eidentity.md\u003c/code\u003e returns \u003ccode\u003eNone\u003c/code\u003e instead of a fabricated empty string.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eMarkdown is the only format: for a single user under 200 entries, files are the best query engine. Saving rewrites the layout, so hand-written comments may disappear; that is the accepted cost.\u003c/p\u003e\n","path":"docs/board/M0-001-five-stores.md"},{"id":"M0-002","title":"Prompt assembly and in-band protocol","status":"done","milestone":"M0","module":"prompt","size":"L","priority":"P0","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["architecture","plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eStable prefix: persona → identity → user → memory → protocol.\u003c/li\u003e\n\u003cli\u003eVolatile sections last: today → loops → journal.\u003c/li\u003e\n\u003cli\u003eSection budgets: 600 each for identity and user, 2000 for memory, 300 for loops, 600 for journal.\u003c/li\u003e\n\u003cli\u003eIn-band protocol: \u003ccode\u003e\u0026lt;\u0026lt;niuse:memory\u0026gt;\u0026gt;\u003c/code\u003e, \u003ccode\u003e\u0026lt;\u0026lt;niuse:loop\u0026gt;\u0026gt;\u003c/code\u003e, \u003ccode\u003e\u0026lt;\u0026lt;niuse:journal\u0026gt;\u0026gt;\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eStreaming strip needs a tail buffer; unterminated blocks stay visible.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nSection order covered by a test; expired memory excluded; entries older than 30 days marked unverified.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nOversized identity is truncated and labelled.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nProtocol tests cover blocks split across chunks, partial prefixes, false markers, and unterminated blocks.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nIn real calls the candidate block is stripped and the prose is intact.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe original plan had memory and loop blocks only. To avoid a second model call, a journal block was added and is written automatically.\u003c/p\u003e\n","path":"docs/board/M0-002-prompt-protocol.md"},{"id":"M0-003","title":"REPL and the niucode driver","status":"done","milestone":"M0","module":"repl","size":"L","priority":"P0","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-002"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eInteractive REPL: streaming output, slash commands, Ctrl-C cancel, Ctrl-D exit.\u003c/li\u003e\n\u003cli\u003eThe driver opens or resumes \u003ccode\u003ethread.jsonl\u003c/code\u003e and rebuilds history with \u003ccode\u003eproject_history\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEach turn sets the working directory again, proving per-turn cwd on one session.\u003c/li\u003e\n\u003cli\u003eCandidate confirmation: \u003ccode\u003ey\u003c/code\u003e / \u003ccode\u003en\u003c/code\u003e / \u003ccode\u003ee\u003c/code\u003e / \u003ccode\u003es\u003c/code\u003e; conflicts use \u003ccode\u003er\u003c/code\u003e / \u003ccode\u003ek\u003c/code\u003e / \u003ccode\u003ed\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA real provider run completes a read-only task and persists the session.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe same session reads in one directory, \u003ccode\u003e/cd /tmp\u003c/code\u003e, then reads in another; both succeed.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nConfirming a candidate writes memory that \u003ccode\u003eniuse mem list\u003c/code\u003e can show.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nJournal and loop blocks are written automatically.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe driver is about 200 lines and does not bypass the loop.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eniucode-cli\u003c/code\u003e is a binary with no library target, so its TUI and renderer cannot be reused. The MVP ships a minimal renderer and can swap later once upstream exposes a library or a hook.\u003c/p\u003e\n","path":"docs/board/M0-003-repl-driver.md"},{"id":"M0-004","title":"Soft expiry, conflicts, secret scan","status":"done","milestone":"M0","module":"policy","size":"M","priority":"P0","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["adr-0001"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eNormal injection within 30 days; unverified from 31 to 90; not injected after 90.\u003c/li\u003e\n\u003cli\u003eConflict detection via character-bigram Jaccard: ≥ 0.5 is similar; same tag lowers the bar to 0.35.\u003c/li\u003e\n\u003cli\u003eSecret patterns: \u003ccode\u003esk-\u003c/code\u003e, \u003ccode\u003eghp_\u003c/code\u003e, \u003ccode\u003egithub_pat_\u003c/code\u003e, \u003ccode\u003eAKIA\u003c/code\u003e, private-key blocks, Slack, Google, long hex.\u003c/li\u003e\n\u003cli\u003eRefusal is the default; the CLI needs \u003ccode\u003e--force\u003c/code\u003e to override.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nCommon key shapes match; ordinary Chinese prose and short hex do not.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nTests for similar, unrelated, and same-tag pairs.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA real \u003ccode\u003esk-...\u003c/code\u003e input is refused with exit code 1.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nExpired memory is excluded from the prompt.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eScanning is a backstop, not a guarantee. Private projects, client names, and internal addresses still rely on human judgement at confirmation time.\u003c/p\u003e\n","path":"docs/board/M0-004-policy.md"},{"id":"M0-005","title":"Cold start and the review queue","status":"done","milestone":"M0","module":"bootstrap","size":"M","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-004"],"docs":["plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse bootstrap [--limit N] [--since-days N]\u003c/code\u003e scans \u003ccode\u003e~/.niucode/sessions\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eOnly user / assistant text is sent; tool output is dropped.\u003c/li\u003e\n\u003cli\u003eOne tool-free extraction returns \u003ccode\u003e{kind, text, tags}\u003c/code\u003e and writes \u003ccode\u003einbox.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse review\u003c/code\u003e walks the queue with \u003ccode\u003ey\u003c/code\u003e / \u003ccode\u003en\u003c/code\u003e / \u003ccode\u003es\u003c/code\u003e / \u003ccode\u003eq\u003c/code\u003e; accepted entries become memory.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nEmpty sessions are skipped; only sessions with dialogue cost a model call.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nCandidates are deduplicated against existing memory and within the batch.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nInbox format has a round-trip test.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA real run mined a sandbox lesson that review accepted into memory.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eDefault cap is 40 sessions. Cost is roughly 2k input tokens per session, one-off.\u003c/p\u003e\n","path":"docs/board/M0-005-bootstrap.md"},{"id":"M0-006","title":"Architecture dashboard","status":"done","milestone":"M0","module":"dashboard","size":"L","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-003"],"docs":["architecture","plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eReuse niucode's xtask generator and three-column shell, with a niuse project model.\u003c/li\u003e\n\u003cli\u003eFour views: Architecture (default), Work, Docs, Decisions.\u003c/li\u003e\n\u003cli\u003eSources: \u003ccode\u003eproject.json\u003c/code\u003e plus \u003ccode\u003eboard/*.md\u003c/code\u003e plus \u003ccode\u003edocs/**/*.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eSingle-file \u003ccode\u003edocs/index.html\u003c/code\u003e, offline, no CDN, no runtime fetch.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecargo xtask dashboard --check\u003c/code\u003e fails when generated output is stale.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003ecargo xtask dashboard\u003c/code\u003e writes \u003ccode\u003edocs/index.html\u003c/code\u003e and \u003ccode\u003emodel.json\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nValidation passes: module paths exist, card references resolve, ADR statuses are legal.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nArchitecture shows modules, layers, and dependency arrows.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDocs opens the architecture doc, the plan, and both ADRs.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--check\u003c/code\u003e passes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe board is read-only; state changes go through the repository so it never becomes a second source of truth. The generator is copied from niucode; only branding and the project model changed.\u003c/p\u003e\n","path":"docs/board/M0-006-dashboard.md"},{"id":"M2-001","title":"Ten working days of dogfood","status":"ready","milestone":"M2","module":"repl","size":"M","priority":"P0","updated":"2026-10-21","completed":null,"depends_on":["M0-003","M0-005"],"docs":["plan","dogfood"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAt least one real task per day goes through niuse, not niucode.\u003c/li\u003e\n\u003cli\u003eRecord proposals, acceptances, and concrete cases where memory saved a round of explanation.\u003c/li\u003e\n\u003cli\u003eAt least once it should disagree and change your mind.\u003c/li\u003e\n\u003cli\u003eKeep the store under 50 entries; more means the bar is too low.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nTen consecutive working days.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nCandidate acceptance rate ≥ 60%.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nAt least 3 correct citations of a past judgement.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nAt least 1 case of being persuaded.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nAt least 1 A/B case where \u003ccode\u003eNIUSE_MEMORY=off\u003c/code\u003e changes the answer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eRecord one row per day in \u003ca href=\"../dogfood.md\"\u003ethe dogfood log\u003c/a\u003e. This card writes no code. Its job is to stop new features before the current ones are validated.\u003c/p\u003e\n","path":"docs/board/M2-001-dogfood.md"},{"id":"M2-002","title":"Show a full unified diff at approval","status":"done","milestone":"M2","module":"repl","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-003"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eRender \u003ccode\u003eChangePreview\u003c/code\u003e as unified hunks: file header, \u003ccode\u003e@@\u003c/code\u003e ranges, context, additions, removals.\u003c/li\u003e\n\u003cli\u003eReuse niucode's \u003ccode\u003eToolbox::preview\u003c/code\u003e result; niuse copies no path policy and performs no extra reads.\u003c/li\u003e\n\u003cli\u003eCap the rendered diff at 80 lines with an explicit \"more line(s)\" marker.\u003c/li\u003e\n\u003cli\u003eKeep the approval prompt below the diff; non-TTY still falls back to a line reply.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nWrite / edit approval shows real hunks with \u003ccode\u003e+\u003c/code\u003e and \u003ccode\u003e-\u003c/code\u003e lines.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA new file is marked as new; command and note previews still render.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nLong previews are capped instead of flooding the terminal.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nRendering has unit tests; the security boundary is unchanged.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThis was the last known gap between niuse's approval prompt and niucode's TUI preview.\u003c/p\u003e\n","path":"docs/board/M2-002-approval-diff.md"},{"id":"M2-003","title":"Memory recall across expired entries","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-004"],"docs":["architecture","plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem search \u0026lt;query\u0026gt; [--fresh]\u003c/code\u003e searches every saved memory, including expired ones.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/mem recall \u0026lt;query\u0026gt;\u003c/code\u003e does the same inside the REPL.\u003c/li\u003e\n\u003cli\u003eRanking prefers substring and tag matches over character-bigram similarity, which is weak for short queries.\u003c/li\u003e\n\u003cli\u003eResults show age, expiry state, tags, and the entry id.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nExpired entries are searchable but still excluded from injection.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--fresh\u003c/code\u003e hides expired entries.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nSubstring and tag matches outrank unrelated entries; threshold is 0.2.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nCore scoring has unit tests; CLI and REPL paths were exercised manually.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eRecall is the reason expired memory is kept instead of deleted: it leaves the prompt, not the store.\u003c/p\u003e\n","path":"docs/board/M2-003-memory-recall.md"},{"id":"M2-004","title":"Acceptance metrics and stats","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M2-003"],"docs":["architecture","plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e~/.niuse/metrics.jsonl\u003c/code\u003e: tab-separated local counters, file \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eRecord turn outcomes, candidate proposals and decisions, journal writes, loops, manual memories, and bootstrap review decisions.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse stats [--days N]\u003c/code\u003e and \u003ccode\u003e/stats\u003c/code\u003e summarise the window; \u003ccode\u003e--days 0\u003c/code\u003e means all time.\u003c/li\u003e\n\u003cli\u003eAcceptance rate is accepted over proposed; edited and replace/keep decisions count as accepted.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nMetrics append atomically and stay \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nParsing and summarisation have unit tests, including a window filter.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe CLI and REPL expose the summary.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nNo memory text is written to the metrics file.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eexec\u003c/code\u003e turns are counted in the same \u003ccode\u003eturn\u003c/code\u003e series. Candidates printed by \u003ccode\u003eexec\u003c/code\u003e are not counted as proposals, because no decision is collected.\u003c/p\u003e\n\u003cp\u003eThis is the measurement M2-001 needs: without it, \"acceptance rate ≥ 60%\" is a feeling. The file is local-only and excluded from injection.\u003c/p\u003e\n","path":"docs/board/M2-004-acceptance-metrics.md"},{"id":"M2-005","title":"Doctor health check","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse doctor\u003c/code\u003e and \u003ccode\u003e/doctor\u003c/code\u003e check the home directory and mode, identity, user profile, memory counts, thread readability, metrics, credentials, bwrap, and the niucode pin.\u003c/li\u003e\n\u003cli\u003eOffline: no model call, no network.\u003c/li\u003e\n\u003cli\u003eFailures return a non-zero exit; warnings do not.\u003c/li\u003e\n\u003cli\u003eThe pin check only runs inside a checkout where \u003ccode\u003eniucode.rev\u003c/code\u003e exists.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA healthy store reports zero failures.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nMissing credentials are a failure; missing identity or bwrap is a warning.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA drifted sibling checkout is reported with the sync command.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nReport counters have a unit test.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eDoctor is the onboarding answer to \"why will it not run\": one command, explicit levels, and the exact next step.\u003c/p\u003e\n","path":"docs/board/M2-005-doctor.md"},{"id":"M2-006","title":"Manual loops","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse loops add \u0026lt;text\u0026gt; [--due YYYY-MM-DD]\u003c/code\u003e creates a promise without waiting for the model to emit a block.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/loop \u0026lt;text\u0026gt;\u003c/code\u003e does the same inside the REPL.\u003c/li\u003e\n\u003cli\u003eDue dates are validated; invalid dates are rejected before anything is written.\u003c/li\u003e\n\u003cli\u003eSecret scanning applies to manual loops too.\u003c/li\u003e\n\u003cli\u003eCreation is recorded in metrics.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA manual loop persists with an optional due date.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nAn invalid due date writes nothing and exits non-zero.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe REPL path records the loop and a metric.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe CLI listing shows open and overdue entries.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe model is not the only source of promises. This closes the gap where you know something needs tracking but the turn did not produce a loop block.\u003c/p\u003e\n","path":"docs/board/M2-006-manual-loops.md"},{"id":"M2-007","title":"Memory maintenance: show and edit","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem show \u0026lt;id\u0026gt;\u003c/code\u003e prints kind, tags, created, confirmed, source, and text.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem edit \u0026lt;id\u0026gt;\u003c/code\u003e opens the text in \u003ccode\u003e$EDITOR\u003c/code\u003e, normalises it to one line, rescans for secrets, and refreshes the confirmation date.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/mem show \u0026lt;id\u0026gt;\u003c/code\u003e works in the REPL; candidate editing reuses the same editor helper.\u003c/li\u003e\n\u003cli\u003eIDs accept \u003ccode\u003em-\u003c/code\u003e, \u003ccode\u003el-\u003c/code\u003e, or no prefix.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nShow prints every field a reviewer needs.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nEdit updates the text and confirmed date, or reports no change.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA secret in the edited text is refused and the stored entry is untouched.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe editor helper is shared with candidate editing; ID prefixes have a test.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eCorrecting a wrong memory is as important as adding one: a bad entry is injected on every turn until it is fixed.\u003c/p\u003e\n","path":"docs/board/M2-007-memory-maintenance.md"},{"id":"M2-008","title":"Journal search","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse journal --search \u0026lt;query\u0026gt;\u003c/code\u003e ranks journal bullets across all months.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/journal search \u0026lt;query\u0026gt;\u003c/code\u003e does the same in the REPL.\u003c/li\u003e\n\u003cli\u003eRanking reuses the memory scorer: substring hits first, bigram similarity above 0.2.\u003c/li\u003e\n\u003cli\u003eResults show the date and the bullet, capped at ten.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA substring hit is found and keeps its date.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nAn unrelated query returns no rows.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe CLI and REPL paths were exercised.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nRanking and empty-result behaviour have unit tests.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eMemory answers \"what is true\"; the journal answers \"when did we decide this\". Search is what makes the second question cheap.\u003c/p\u003e\n","path":"docs/board/M2-008-journal-search.md"},{"id":"M2-009","title":"Markdown export","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-003"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse export [--out FILE] [--session PATH]\u003c/code\u003e projects a session log to Markdown.\u003c/li\u003e\n\u003cli\u003eUser and assistant turns keep their order; tool calls and results are fenced.\u003c/li\u003e\n\u003cli\u003eProtocol blocks are stripped, exactly as the REPL strips them.\u003c/li\u003e\n\u003cli\u003eTool output is clipped at 4,000 characters; exported files are \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nTurns render in order with a metadata header.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nProtocol blocks never leak into the export.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nLong tool output is clipped with a marker.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nWrites to \u003ccode\u003e--out\u003c/code\u003e are private; stdout works without a file.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nUnit tests cover ordering, clipping, and block stripping.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe event log remains the source of truth. The export is a read-only projection for review, backup, or attaching a transcript to an issue.\u003c/p\u003e\n","path":"docs/board/M2-009-markdown-export.md"},{"id":"M2-010","title":"Config file defaults","status":"done","milestone":"M2","module":"cli","size":"M","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-003"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e~/.niuse/config.toml\u003c/code\u003e with a \u003ccode\u003e[defaults]\u003c/code\u003e table: provider, model, sandbox, approval, network, max_steps.\u003c/li\u003e\n\u003cli\u003ePrecedence is CLI flag → config file → built-in default.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse config init\u003c/code\u003e writes a commented template; \u003ccode\u003econfig show\u003c/code\u003e prints the file.\u003c/li\u003e\n\u003cli\u003eSettings resolve lazily: offline commands (mem, loops, journal, export, status, stats) do not read the config, so a broken file cannot block them.\u003c/li\u003e\n\u003cli\u003eConfig files are \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nTOML parsing and the precedence rule have unit tests.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA config sandbox changes the REPL banner; a CLI flag overrides it.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA malformed config fails agent commands with the file path, but \u003ccode\u003estatus\u003c/code\u003e still works.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nInit refuses to overwrite without \u003ccode\u003e--force\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eDefaults belong in a file, not in muscle memory. Lazy resolution is deliberate: a typo in \u003ccode\u003econfig.toml\u003c/code\u003e should not make \u003ccode\u003eniuse mem show\u003c/code\u003e unusable.\u003c/p\u003e\n","path":"docs/board/M2-010-config-defaults.md"},{"id":"M2-011","title":"Manual journal entries and identity editing","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse journal --add \u0026lt;text\u0026gt;\u003c/code\u003e and \u003ccode\u003e/journal add \u0026lt;text\u0026gt;\u003c/code\u003e append a bullet to today.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse identity show|edit\u003c/code\u003e and \u003ccode\u003e/identity edit\u003c/code\u003e open the identity file in \u003ccode\u003e$EDITOR\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eJournal entries are secret-scanned and recorded in metrics.\u003c/li\u003e\n\u003cli\u003eEditing uses a multiline helper; memory and candidate editing keep the one-line normaliser.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA manual journal entry appears in \u003ccode\u003erecent_journal\u003c/code\u003e and in search.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nIdentity editing writes the file and keeps it \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nEmpty edits report \"no change\" and do not write.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe journal path has a unit test; identity editing was exercised with a scripted editor.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eNot every durable line comes from the model. Manual entry is the escape hatch when a block was not emitted.\u003c/p\u003e\n","path":"docs/board/M2-011-manual-journal-identity.md"},{"id":"M2-012","title":"Bootstrap inbox merge","status":"done","milestone":"M2","module":"bootstrap","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-005"],"docs":["plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eRe-running \u003ccode\u003eniuse bootstrap\u003c/code\u003e merges into the existing queue instead of replacing it.\u003c/li\u003e\n\u003cli\u003ePending entries that have since been accepted into memory are dropped.\u003c/li\u003e\n\u003cli\u003eSecret-bearing entries are dropped from both sides.\u003c/li\u003e\n\u003cli\u003eNew candidates are deduplicated against memory, the existing queue, and each other.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPending entries survive a second run; accepted ones disappear.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDuplicate candidates are not queued twice.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe merge rule has a unit test.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe CLI reports new versus total pending.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eCold start is not a one-shot operation: sessions accumulate, and a second mining pass should add to the queue, not erase it.\u003c/p\u003e\n","path":"docs/board/M2-012-bootstrap-merge.md"},{"id":"M2-013","title":"Thread rotation","status":"done","milestone":"M2","module":"repl","size":"M","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-003"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e/new\u003c/code\u003e appends a session end, archives the current thread to \u003ccode\u003e~/.niuse/threads/thread-\u0026lt;millis\u0026gt;.jsonl\u003c/code\u003e, and opens a fresh default thread.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--thread PATH\u003c/code\u003e resumes an archived thread without changing the default.\u003c/li\u003e\n\u003cli\u003eThe archive keeps the original JSONL untouched; history comes from the normal projection.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/status\u003c/code\u003e reports the active thread, not the default path.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e/new\u003c/code\u003e archives the old file and creates a fresh three-event session.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--thread\u003c/code\u003e resumes an archive and reports its event count.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA missing archive source is a no-op.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nArchive moves have unit tests.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe default remains one continuous relationship. \u003ccode\u003e/new\u003c/code\u003e is a chapter break, not the normal path; old chapters stay readable and resumable.\u003c/p\u003e\n","path":"docs/board/M2-013-thread-rotation.md"},{"id":"M2-014","title":"Piped output exits cleanly","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-003"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse ... | head\u003c/code\u003e no longer panics when the reader closes early; the process exits 0.\u003c/li\u003e\n\u003cli\u003eOnly the \"Broken pipe\" panic is intercepted; every other panic goes to the default hook unchanged.\u003c/li\u003e\n\u003cli\u003eThe fix is a panic hook rather than a global SIGPIPE reset, because SIGPIPE also covers socket writes made by the provider.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniuse mem list | head -1\u003c/code\u003e exits 0 with no panic output.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniuse status | head -1\u003c/code\u003e behaves the same.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nNon-pipe panics still print through the default hook.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eniuse status --thread \u0026lt;archive\u0026gt;\u003c/code\u003e reports the requested thread.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eSmall, but it was the first papercut hit while testing; a CLI that panics when paged is not pleasant to script against.\u003c/p\u003e\n","path":"docs/board/M2-014-piped-output.md"},{"id":"M2-015","title":"Thread listing","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M2-013"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse threads\u003c/code\u003e lists the active thread and every archive under \u003ccode\u003e~/.niuse/threads/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEach row shows age, event count, size, and the path relative to the niuse home.\u003c/li\u003e\n\u003cli\u003eThe active thread is marked with \u003ccode\u003e*\u003c/code\u003e, respecting \u003ccode\u003e--thread\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eInvalid sessions still appear with an event count of zero rather than hiding.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe active thread and one archive are both listed.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe active marker follows \u003ccode\u003e--thread\u003c/code\u003e / the default path.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nAge and size formatting have unit tests.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nListing is read-only and does not open sessions for append.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e/new\u003c/code\u003e made archives; without a listing they were only discoverable with \u003ccode\u003els\u003c/code\u003e. This closes the loop.\u003c/p\u003e\n","path":"docs/board/M2-015-thread-listing.md"},{"id":"M2-016","title":"Expired memory pruning","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-004"],"docs":["adr-0001"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem prune\u003c/code\u003e lists entries older than 90 days and changes nothing.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem prune --apply\u003c/code\u003e removes exactly those entries and records a metric.\u003c/li\u003e\n\u003cli\u003eFresh and stale-but-valid entries are untouched.\u003c/li\u003e\n\u003cli\u003eDeletion is explicit; there is no implicit expiry write path.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDry run lists the expired entry and leaves the store unchanged.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--apply\u003c/code\u003e removes only expired entries; a fresh lesson survives.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe removal path has a unit test.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe metric records how many entries were pruned.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eSoft expiry means expired entries already leave the prompt. Pruning is housekeeping for the file, not a behaviour change; that is why it is manual.\u003c/p\u003e\n","path":"docs/board/M2-016-expired-prune.md"},{"id":"M2-017","title":"Stats daily trend","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M2-004"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse stats --trend\u003c/code\u003e adds a per-day breakdown for the selected window.\u003c/li\u003e\n\u003cli\u003eDays are UTC dates; each row shows turns, accepted/proposed, and acceptance.\u003c/li\u003e\n\u003cli\u003eAt most the last fourteen active days are printed.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/stats\u003c/code\u003e keeps the summary view; the flag is CLI-only for now.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nMetrics on two UTC days produce two rows.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nAcceptance is \u003ccode\u003e-\u003c/code\u003e on days without proposals.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nGrouping has a unit test with synthetic timestamps.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA real metrics file renders without panics.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe dogfood question is not \"what is the total\" but \"is it getting better\"; a daily view makes that visible.\u003c/p\u003e\n","path":"docs/board/M2-017-stats-trend.md"},{"id":"M2-018","title":"Bootstrap dry run","status":"done","milestone":"M2","module":"bootstrap","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-005"],"docs":["plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse bootstrap --dry-run\u003c/code\u003e selects sessions exactly as a real run would, then stops.\u003c/li\u003e\n\u003cli\u003eIt prints each session id and the transcript size in characters.\u003c/li\u003e\n\u003cli\u003eNo provider request is made, so the preview is free.\u003c/li\u003e\n\u003cli\u003eEmpty or tool-only sessions are still filtered before the preview.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDry run lists the selected sessions and their transcript sizes.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nNo model call and no inbox write.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe selection path is shared with the real run.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe CLI path was exercised with a real session directory.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eBootstrap can cost a model call per session; a free preview is the difference between \"try it\" and \"avoid it\".\u003c/p\u003e\n","path":"docs/board/M2-018-bootstrap-dry-run.md"},{"id":"M2-019","title":"Manual memory duplicate guard","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-004"],"docs":["adr-0001"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem add\u003c/code\u003e runs the same similarity rule as candidate writes.\u003c/li\u003e\n\u003cli\u003eA match prints the similar ids and refuses unless \u003ccode\u003e--force\u003c/code\u003e is passed.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--force\u003c/code\u003e now overrides both the secret scan and the duplicate check; the help text says so.\u003c/li\u003e\n\u003cli\u003eCandidate and manual writes therefore share one conflict definition.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA near-duplicate manual add is refused and lists the existing id.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--force\u003c/code\u003e adds it and the store grows to two entries.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe guard has a unit test.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nSecret scanning still runs before the duplicate check.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe confirmation flow already prevented duplicates; the manual path was the hole. Closing it keeps the store reviewable at 50 entries.\u003c/p\u003e\n","path":"docs/board/M2-019-mem-add-guard.md"},{"id":"M2-020","title":"Dogfood record tooling","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M2-004"],"docs":["dogfood","plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse stats --json\u003c/code\u003e emits a stable summary plus per-day rows for scripting.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003edocs/dogfood.md\u003c/code\u003e defines the ten-day ritual: one row per day, two numbers, one sentence.\u003c/li\u003e\n\u003cli\u003eThe JSON includes turns, candidate decisions, acceptance, activity counts, and days.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e/stats\u003c/code\u003e keeps the human summary; \u003ccode\u003e--json\u003c/code\u003e is CLI-only.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nJSON output parses and includes \u003ccode\u003eacceptance_percent\u003c/code\u003e and \u003ccode\u003edays\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nSerialization has a unit test with synthetic metrics.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe dogfood guide links the exact command and a table template.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nREADME points at the guide.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThe point of the JSON is not dashboards; it is making the daily row cheap enough to actually write.\u003c/p\u003e\n","path":"docs/board/M2-020-dogfood-tooling.md"},{"id":"M2-021","title":"User profile editing","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-001"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse user show|edit\u003c/code\u003e and \u003ccode\u003e/user\u003c/code\u003e / \u003ccode\u003e/user edit\u003c/code\u003e expose \u003ccode\u003euser.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEditing uses the multiline \u003ccode\u003e$EDITOR\u003c/code\u003e helper and keeps the file \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eA missing file opens a small template with the three questions that matter: current work, working style, red lines.\u003c/li\u003e\n\u003cli\u003eThe edit is recorded in metrics.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nShow prints the path and content, or a hint when missing.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nEdit writes the file through a scripted editor and \u003ccode\u003euser show\u003c/code\u003e reflects it.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nEmpty edits report no change.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nPermissions remain \u003ccode\u003e0600\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eidentity.md\u003c/code\u003e says who it is; \u003ccode\u003euser.md\u003c/code\u003e says who you are. The second one had no manual path, only bootstrap.\u003c/p\u003e\n","path":"docs/board/M2-021-user-profile.md"},{"id":"M2-022","title":"Bootstrap profile draft","status":"done","milestone":"M2","module":"bootstrap","size":"M","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-005"],"docs":["plan","architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse bootstrap --profile\u003c/code\u003e makes one extra model call and drafts \u003ccode\u003euser.md\u003c/code\u003e from the selected sessions.\u003c/li\u003e\n\u003cli\u003eIt only writes when \u003ccode\u003euser.md\u003c/code\u003e is missing or \u003ccode\u003e--force-profile\u003c/code\u003e is passed.\u003c/li\u003e\n\u003cli\u003eInput is capped at 10k characters; output is asked for three sections and no speculation.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--dry-run\u003c/code\u003e reports that a profile would be drafted without calling anything.\u003c/li\u003e\n\u003cli\u003eThe write is recorded in metrics.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA fresh home gets a user.md draft; an existing one is skipped by default.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe input builder respects its cap (unit test).\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe draft is written \u003ccode\u003e0600\u003c/code\u003e and the command suggests \u003ccode\u003eniuse user edit\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA real run produced a draft that admitted uncertainty instead of inventing facts.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThis is the missing half of the cold start described in the plan: candidates fill memory, the profile fills \u003ccode\u003euser.md\u003c/code\u003e. \u003ccode\u003eidentity.md\u003c/code\u003e is still never mined.\u003c/p\u003e\n","path":"docs/board/M2-022-bootstrap-profile.md"},{"id":"M2-023","title":"Secret scan for identity and profile edits","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P1","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M0-004"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eidentity edit\u003c/code\u003e, \u003ccode\u003euser edit\u003c/code\u003e, and \u003ccode\u003eidentity init\u003c/code\u003e scan the final text before writing.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ebootstrap --profile\u003c/code\u003e refuses a generated draft that contains a secret pattern.\u003c/li\u003e\n\u003cli\u003eA refusal leaves the existing file untouched and exits non-zero.\u003c/li\u003e\n\u003cli\u003eMemory, journal, and loop writes already had the same guard.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nA scripted editor inserting \u003ccode\u003esk-...\u003c/code\u003e is refused for identity and user.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe existing identity file is unchanged after the refusal.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe profile draft path checks before \u003ccode\u003ewrite_user\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe scan uses the same built-in patterns as other writes.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eIdentity and user text is injected on every turn; a leaked key there would be sent to the provider continuously. The guard belongs at the write, not only in memory.\u003c/p\u003e\n","path":"docs/board/M2-023-profile-secret-scan.md"},{"id":"M2-024","title":"Profile-only bootstrap","status":"done","milestone":"M2","module":"bootstrap","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M2-022"],"docs":["plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse bootstrap --profile-only\u003c/code\u003e implies \u003ccode\u003e--profile\u003c/code\u003e and stops after drafting \u003ccode\u003euser.md\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eIt skips the per-session candidate extraction, saving one call per session.\u003c/li\u003e\n\u003cli\u003eThe existing inbox is left untouched.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e--dry-run\u003c/code\u003e still previews the sessions and the profile intent without a model call.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003e--profile-only\u003c/code\u003e sets the profile path even without \u003ccode\u003e--profile\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nThe command returns before candidate extraction.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nDry run reports the profile intent and lists sessions.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nREADME documents the flag.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eSometimes only the \"who you are\" half is missing. Making the user pay for candidate extraction in that case is unnecessary.\u003c/p\u003e\n","path":"docs/board/M2-024-profile-only.md"},{"id":"M2-025","title":"Machine-readable memory output","status":"done","milestone":"M2","module":"cli","size":"S","priority":"P2","updated":"2026-10-21","completed":"2026-10-21","depends_on":["M2-003"],"docs":["architecture"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem list --json\u003c/code\u003e emits the visible entries as a JSON array.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse mem search \u0026lt;query\u0026gt; --json\u003c/code\u003e emits ranked matches with the same shape.\u003c/li\u003e\n\u003cli\u003eFields: id, kind, tags, created, confirmed, age_days, expired, source, text.\u003c/li\u003e\n\u003cli\u003eExpiry state is computed at read time; the file format is unchanged.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nBoth commands emit valid JSON that parses.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\n\u003ccode\u003eexpired\u003c/code\u003e and \u003ccode\u003eage_days\u003c/code\u003e reflect the current date.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nSerialization has a unit test.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\" checked=\"\"/\u003e\nText output is unchanged when the flag is absent.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eMarkdown stays the storage format. JSON is an output view for scripts and dogfood, not a second store.\u003c/p\u003e\n","path":"docs/board/M2-025-memory-json.md"},{"id":"M3-001","title":"Release and dependency strategy","status":"backlog","milestone":"M3","module":"cli","size":"M","priority":"P1","updated":"2026-10-21","completed":null,"depends_on":["M0-003"],"docs":["plan"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eDecide the niucode dependency: publish niucode crates first, pin a git revision, or support \u003ccode\u003ecargo install --git\u003c/code\u003e only.\u003c/li\u003e\n\u003cli\u003eAdd \u003ccode\u003elicense\u003c/code\u003e, \u003ccode\u003erepository\u003c/code\u003e, \u003ccode\u003edescription\u003c/code\u003e, and other release metadata.\u003c/li\u003e\n\u003cli\u003eMake \u003ccode\u003ecargo package\u003c/code\u003e / \u003ccode\u003ecargo publish --dry-run\u003c/code\u003e reproducible.\u003c/li\u003e\n\u003cli\u003eConfirm crate-name availability; rename the crate if needed while keeping the \u003ccode\u003eniuse\u003c/code\u003e binary.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\n\u003ccode\u003ecargo package -p niuse\u003c/code\u003e passes (currently blocked by path dependencies).\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nThe install path is reproducible on a clean machine.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nLicense and naming strategy are documented in the README.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eCurrent failure: \u003ccode\u003eall dependencies must have a version requirement specified when packaging\u003c/code\u003e, pointing at the \u003ccode\u003eniucode-agent\u003c/code\u003e path dependency.\u003c/p\u003e\n","path":"docs/board/M3-001-distribution.md"},{"id":"M4-001","title":"Reuse niucode's TUI through a library and hooks","status":"backlog","milestone":"M4","module":"frontend","size":"L","priority":"P0","updated":"2026-10-21","completed":null,"depends_on":["M0-003"],"docs":["adr-0003","compat"],"blocked_reason":null,"body_html":"\u003ch2\u003eScope\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eniucode-cli\u003c/code\u003e exposes a library target: session runtime, TUI entry, renderer, approval UI.\u003c/li\u003e\n\u003cli\u003eA small hook surface: augment the system prompt before a turn, observe a finished turn, receive session lifecycle events.\u003c/li\u003e\n\u003cli\u003eniuse implements the hooks: identity / memory injection, candidate extraction, journal and loop writes.\u003c/li\u003e\n\u003cli\u003eDelete niuse's renderer and its per-turn \u003ccode\u003eAgentConfig\u003c/code\u003e assembly once the shared path is stable.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eAcceptance\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nA niuse binary runs niucode's TUI with memory injected and candidates confirmed.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nniuse no longer owns a renderer or a second terminal input loop.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nThe hook trait is generic: no identity or memory types cross into niucode.\u003c/li\u003e\n\u003cli\u003e\u003cinput disabled=\"\" type=\"checkbox\"/\u003e\nContract tests still pass against the pinned revision.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNotes\u003c/h2\u003e\n\u003cp\u003eThis is the only large piece of duplication left. Keeping two repos is still the decision (ADR-0003); this card removes the reason the boundary felt wrong, without merging the products.\u003c/p\u003e\n","path":"docs/board/M4-001-shared-tui.md"}],"docs":[{"id":"architecture","title":"Architecture","kind":"doc","status":"living","order":5,"summary":"niuse boundaries, the five stores, turn data flow, write thresholds, and explicit non-goals.","body_html":"\u003ch2\u003eIn one sentence\u003c/h2\u003e\n\u003cp\u003eniuse is the identity and memory layer above niucode: it decides who the companion is, what it remembers, and what it promised. Whether a task can be done at all stays with niucode's loop, tools, and sandbox.\u003c/p\u003e\n\u003ch2\u003eDependency direction\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003ecrates/niuse-cli     REPL / commands / renderer / driver / bootstrap\n    │\ncrates/niuse-core    date / model / store / prompt / candidate / policy\n    │\nniucode-agent        run_with_history / AgentConfig / project_history\nniucode-core         SessionLog / Event\nniucode-provider     Provider / ChatMessage\nniucode-auth         AuthStore\nniucode-tools        SandboxPolicy / ApprovalMode\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOnly \u003ccode\u003edriver.rs\u003c/code\u003e touches \u003ccode\u003eniucode-agent\u003c/code\u003e directly. Everything else is either pure domain logic or only knows \u003ccode\u003eniuse-core\u003c/code\u003e types. When niucode upgrades, the required changes are confined to one file.\u003c/p\u003e\n\u003cp\u003eniuse does not fork niucode and does not add a memory hook to its loop. Memory is a product layer; the kernel stays minimal.\u003c/p\u003e\n\u003cp\u003eToday niuse owns the REPL and renderer. \u003ca href=\"adr/0003-kernel-product-boundary.md\"\u003eADR-0003\u003c/a\u003e moves the front end upstream: \u003ccode\u003eniucode-cli\u003c/code\u003e grows a library target and a generic turn-hook surface, and niuse becomes the product layer that implements it. Until that lands, the renderer stays here deliberately, not accidentally.\u003c/p\u003e\n\u003ch2\u003eModules\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eModule\u003c/th\u003e\u003cth\u003eLayer\u003c/th\u003e\u003cth\u003eResponsibility\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ecli\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eInterface\u003c/td\u003e\u003ctd\u003eflags, subcommands, offline commands, wiring\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003erepl\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eInterface\u003c/td\u003e\u003ctd\u003econversation, slash commands, candidate confirmation, rendering\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eprompt\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eEngine\u003c/td\u003e\u003ctd\u003estable-prefix system prompt and budgets\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eprotocol\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eEngine\u003c/td\u003e\u003ctd\u003ein-band block parsing and streaming stripping\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003epolicy\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eEngine\u003c/td\u003e\u003ctd\u003esoft expiry, conflicts, secret scanning\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edriver\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdapters\u003c/td\u003e\u003ctd\u003eniucode boundary, sessions, per-turn cwd\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ebootstrap\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eAdapters\u003c/td\u003e\u003ctd\u003eold-session mining and the inbox\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003estores\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eState\u003c/td\u003e\u003ctd\u003efive-store load / save and permissions\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003e\u003ccode\u003edashboard\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eEngineering\u003c/td\u003e\u003ctd\u003eoffline board generation\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch2\u003eTurn data flow\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003estartup\n  ├─ read identity / user / memory / loops / journal\n  ├─ compose() assembles the system prompt (once per session)\n  └─ project_history(thread.jsonl) restores history\n\nuser input\n  ├─ run_with_history(config, prompt, history)\n  ├─ AgentEvent → Renderer (TextDelta goes through StreamFilter)\n  ├─ trailing buffer strips \u0026lt;\u0026lt;niuse:*\u0026gt;\u0026gt; blocks\n  ├─ journal / loop: written automatically\n  ├─ memory: print candidate → y / n / e / s\n  └─ re-project history, next turn\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThere is no second copy of the conversation. \u003ccode\u003eniuse export\u003c/code\u003e renders the event log as Markdown without changing it. \u003ccode\u003ehistory\u003c/code\u003e is projected from the event log by niucode's \u003ccode\u003eproject_history\u003c/code\u003e, so compaction, replay, and fork behave exactly as they do in niucode.\u003c/p\u003e\n\u003ch2\u003eThe five stores and injection\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e~/.niuse/\n  identity.md      who it is (human-written; it may only propose)\n  user.md          who you are (bootstrapped with --profile, human-reviewed)\n  memory/          facts: preferences, decisions, pitfalls (confirmed, expiring)\n  journal/         experience: one file per month, merged per day (automatic)\n  loops.md         promises (automatic, optional due date)\n  thread.jsonl     the relationship thread\n  threads/         archived chapters from `/new`\n  inbox.md         bootstrap review queue\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDefaults come from CLI flags, then \u003ccode\u003e~/.niuse/config.toml\u003c/code\u003e, then built-ins; only commands that build a provider read the file.\u003c/p\u003e\n\u003cp\u003eInjection order is fixed, stable before volatile:\u003c/p\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eSection\u003c/th\u003e\u003cth\u003eBudget\u003c/th\u003e\u003cth\u003eChange rate\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003epersona\u003c/td\u003e\u003ctd\u003econstant\u003c/td\u003e\u003ctd\u003enever\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eidentity\u003c/td\u003e\u003ctd\u003e≤ 600 tok\u003c/td\u003e\u003ctd\u003every low\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003euser\u003c/td\u003e\u003ctd\u003e≤ 600 tok\u003c/td\u003e\u003ctd\u003elow\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003ememory\u003c/td\u003e\u003ctd\u003e≤ 2 000 tok\u003c/td\u003e\u003ctd\u003elow\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eprotocol\u003c/td\u003e\u003ctd\u003econstant\u003c/td\u003e\u003ctd\u003enever\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003etoday\u003c/td\u003e\u003ctd\u003eone line\u003c/td\u003e\u003ctd\u003edaily\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eloops\u003c/td\u003e\u003ctd\u003e≤ 300 tok\u003c/td\u003e\u003ctd\u003emedium\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003ejournal\u003c/td\u003e\u003ctd\u003e≤ 600 tok\u003c/td\u003e\u003ctd\u003ehigh\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe first five sections form the stable cache prefix; only content after \u003ccode\u003etoday\u003c/code\u003e can vary per session. The system prompt is assembled once and is not rebuilt mid-session.\u003c/p\u003e\n\u003ch2\u003eWrite thresholds and protocol\u003c/h2\u003e\n\u003cdiv class=\"table-wrap\"\u003e\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eWhat\u003c/th\u003e\u003cth\u003eWho decides\u003c/th\u003e\u003cth\u003eConfirmation\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\n\u003ctr\u003e\u003ctd\u003ejournal, loops\u003c/td\u003e\u003ctd\u003ethe companion\u003c/td\u003e\u003ctd\u003enone\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003ememory\u003c/td\u003e\u003ctd\u003eit proposes\u003c/td\u003e\u003ctd\u003erequired\u003c/td\u003e\u003c/tr\u003e\n\u003ctr\u003e\u003ctd\u003eidentity\u003c/td\u003e\u003ctd\u003ethe human\u003c/td\u003e\u003ctd\u003eonly the human can change it\u003c/td\u003e\u003c/tr\u003e\n\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe model may end an answer with three block types:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003e\u0026lt;\u0026lt;niuse:memory kind=preference tags=rust,testing\u0026gt;\u0026gt;\none self-contained conclusion\n\u0026lt;\u0026lt;/niuse:memory\u0026gt;\u0026gt;\n\n\u0026lt;\u0026lt;niuse:loop due=2026-10-22\u0026gt;\u0026gt;\nsomething it promised to do\n\u0026lt;\u0026lt;/niuse:loop\u0026gt;\u0026gt;\n\n\u0026lt;\u0026lt;niuse:journal\u0026gt;\u0026gt;\n- a decision or turning point that differs from last time\n\u0026lt;\u0026lt;/niuse:journal\u0026gt;\u0026gt;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAt most one \u003ccode\u003ememory\u003c/code\u003e block per turn; after a rejection, the same tags are not proposed again in that session. \u003ccode\u003ejournal\u003c/code\u003e records changes, not activity logs. Expired memory leaves the prompt but stays searchable through \u003ccode\u003eniuse mem search\u003c/code\u003e and \u003ccode\u003e/mem recall\u003c/code\u003e.\u003c/p\u003e\n\u003ch2\u003eSafety and privacy\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e~/.niuse\u003c/code\u003e directories are \u003ccode\u003e0700\u003c/code\u003e, files are \u003ccode\u003e0600\u003c/code\u003e; writes go to a temporary file and are renamed.\u003c/li\u003e\n\u003cli\u003eSecret patterns are scanned before every write; a match is refused, and the CLI requires \u003ccode\u003e--force\u003c/code\u003e to override where an override exists.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eidentity.md\u003c/code\u003e and \u003ccode\u003euser.md\u003c/code\u003e edits, and the bootstrap profile draft, are refused on a secret match; these files are injected every turn.\u003c/li\u003e\n\u003cli\u003eManual \u003ccode\u003emem add\u003c/code\u003e runs the same conflict rule as candidates; \u003ccode\u003e--force\u003c/code\u003e overrides both the secret and duplicate checks.\u003c/li\u003e\n\u003cli\u003eApproval renders niucode's structured change preview (hunks, capped at 80 lines) before asking.\u003c/li\u003e\n\u003cli\u003eMemory is sent to the provider on every turn, so the leak surface is larger than a normal file.\u003c/li\u003e\n\u003cli\u003eProject knowledge stays in the repo's \u003ccode\u003eAGENTS.md\u003c/code\u003e; niuse never edits your repositories.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNIUSE_MEMORY=off\u003c/code\u003e disables injection and candidates, for A/B runs and for recovering trust.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eniuse doctor\u003c/code\u003e checks home permissions, identity, credentials, bwrap, and the pinned niucode revision without calling a model.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emetrics.jsonl\u003c/code\u003e records local counters only: turn outcomes, candidate decisions, tags, and ids. Memory text never enters it.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eExplicit non-goals\u003c/h2\u003e\n\u003cp\u003eA daemon, a web UI, WeChat / Feishu bridges, scheduled push notifications, vector search, full session indexing, automatic repo edits, multi-user support, a TUI (for now), or a general agent framework.\u003c/p\u003e\n\u003cp\u003eThere is one test for every proposal: \u003cstrong\u003edoes this shape an identity, or is it just another capability?\u003c/strong\u003e\u003c/p\u003e\n","path":"docs/architecture.md","excerpt":"niuse boundaries, the five stores, turn data flow, write thresholds, and explicit non-goals."},{"id":"plan","title":"Implementation plan","kind":"plan","status":"active","order":10,"summary":"Fifteen decisions, the five stores, turn lifecycle, write thresholds, milestones, and verifiable acceptance.","body_htm
