 -\u003e String {\n    let mut open: Vec\u003c\u0026LoopItem\u003e = loops.iter().filter(|item| !item.done).collect();\n    open.sort_by_key(|item| (item.due.is_none(), item.due, item.is_overdue(today)));\n\n    let mut lines = String::new();\n    let mut used = 0usize;\n    for item in open {\n        let mut line = format!(\"- [ ] l-{} {}\", item.id, item.text);\n        if let Some(due) = item.due {\n            if item.is_overdue(today) {\n                line.push_str(\u0026format!(\"（截止 {due}，已逾期）\"));\n            } else {\n                line.push_str(\u0026format!(\"（截止 {due}）\"));\n            }\n        }\n        let cost = estimate_text_tokens(\u0026line) + 1;\n        if used + cost \u003e LOOP_BUDGET {\n            break;\n        }\n        used += cost;\n        lines.push_str(\u0026line);\n        lines.push('\\n');\n    }\n    lines.trim_end().to_string()\n}\n\nfn journal_section(journal: \u0026[JournalDay]) -\u003e String {\n    let mut chosen: Vec\u003c\u0026JournalDay\u003e = Vec::new();\n    let mut used = 0usize;\n    for day in journal {\n        let mut block = format!(\"### {}\\n\", day.date);\n        for bullet in \u0026day.bullets {\n            block.push_str(\u0026format!(\"- {bullet}\\n\"));\n        }\n        let cost = estimate_text_tokens(\u0026block) + 1;\n        if used + cost \u003e JOURNAL_BUDGET {\n            break;\n        }\n","truncated":true}]},{"id":"protocol","title":"Protocol","layer":"engine","status":"done","summary":"Parsing and streaming-aware stripping of the in-band memory / loop / journal blocks.","contract":"StreamFilter releases only safe text; parse returns visible + blocks; no storage access.","paths":["crates/niuse-core/src/candidate.rs"],"notes":["No extra model call.","An unterminated block is shown as ordinary text instead of silently eaten.","journal and loop are written automatically; memory requires confirmation."],"sources":[{"path":"crates/niuse-core/src/candidate.rs","language":"rust","text":"//! In-band protocol blocks.\n//!\n//! The model may end an answer with `\u003c\u003cniuse:memory\u003e\u003e`, `\u003c\u003cniuse:loop\u003e\u003e`, or\n//! `\u003c\u003cniuse:journal\u003e\u003e` blocks. They are stripped before rendering and turned\n//! into durable records. No second model call is involved.\n\nuse crate::date::Date;\nuse crate::model::{one_line, MemoryKind};\n\npub const MARKER: \u0026str = \"\u003c\u003cniuse:\";\nconst CLOSE_PREFIX: \u0026str = \"\u003c\u003c/niuse:\";\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum Block {\n    Memory {\n        kind: MemoryKind,\n        tags: Vec\u003cString\u003e,\n        text: String,\n    },\n    Loop {\n        due: Option\u003cDate\u003e,\n        text: String,\n    },\n    Journal {\n        bullets: Vec\u003cString\u003e,\n    },\n}\n\n#[derive(Debug, Clone, Default, PartialEq, Eq)]\npub struct Parsed {\n    pub visible: String,\n    pub blocks: Vec\u003cBlock\u003e,\n}\n\n/// Parse every complete block, returning the text the user should see.\npub fn parse(text: \u0026str) -\u003e Parsed {\n    let mut visible = String::new();\n    let mut blocks = Vec::new();\n    let mut rest = text;\n\n    loop {\n        let Some(start) = rest.find(MARKER) else {\n            visible.push_str(rest);\n            break;\n        };\n        visible.push_str(\u0026rest[..start]);\n        let candidate = \u0026rest[start..];\n        let complete = candidate.find(\"\u003e\u003e\").and_then(|header_end| {\n            let body_start = header_end + 2;\n            let close_rel = candidate[body_start..].find(CLOSE_PREFIX)?;\n            let close_start = body_start + close_rel;\n            let close_end = candidate[close_start..].find(\"\u003e\u003e\")? + close_start + 2;\n            Some((header_end, body_start, close_start, close_end))\n        });\n\n        let Some((header_end, body_start, close_start, close_end)) = complete else {\n            // An unterminated block is model output, not a protocol message:\n            // show it rather than silently eating the answer.\n            visible.push_str(candidate);\n            break;\n        };\n\n        if let Some(block) = parse_block(\n            \u0026candidate[..header_end + 2],\n            \u0026candidate[body_start..close_start],\n        ) {\n            blocks.push(block);\n        }\n        rest = \u0026candidate[close_end..];\n    }\n\n    Parsed {\n        visible: visible.trim_end().to_string(),\n        blocks,\n    }\n}\n\nfn parse_block(header: \u0026str, body: \u0026str) -\u003e Option\u003cBlock\u003e {\n    let inner = header.strip_prefix(MARKER)?.strip_suffix(\"\u003e\u003e\")?;\n    let mut parts = inner.split_whitespace();\n    let name = parts.next()?;\n    let mut attributes = std::collections::HashMap::new();\n    for part in parts {\n        if let Some((key, value)) = part.split_once('=') {\n            attributes.insert(key, value);\n        }\n    }\n\n    match name {\n        \"memory\" =\u003e {\n            let kind = attributes\n                .get(\"kind\")\n                .and_then(|value| MemoryKind::parse(value))\n                .unwrap_or(MemoryKind::Preference);\n            let tags = attributes\n                .get(\"tags\")\n                .map(|value| {\n                    value\n                        .split(',')\n                        .map(str::trim)\n                        .filter(|tag| !tag.is_empty())\n                        .map(str::to_string)\n                        .collect()\n                })\n                .unwrap_or_default();\n            let text = one_line(body.to_string());\n            (!text.is_empty()).then_some(Block::Memory { kind, tags, text })\n        }\n        \"loop\" =\u003e {\n            let text = one_line(body.to_string());\n            let due = attributes.get(\"due\").and_then(|value| Date::parse(value));\n            (!text.is_empty()).then_some(Block::Loop { due, text })\n        }\n        \"journal\" =\u003e {\n            let bullets: Vec\u003cString\u003e = body\n                .lines()\n                .map(|line| one_line(line.trim_start_matches(['-', '*']).to_string()))\n                .filter(|line| !line.is_empty())\n                .take(5)\n                .collect();\n            (!bullets.is_empty()).then_some(Block::Journal { bullets })\n        }\n        _ =\u003e None,\n    }\n}\n\n/// Streaming view of the model output.\n///\n/// Text is released as soon as it cannot be the prefix of a protocol block.\n/// Complete blocks are swallowed; `finish` returns the full raw text so the\n/// caller can parse the blocks without having kept a second buffer.\n#[derive(Debug, Default)]\npub struct StreamFilter {\n    buffer: String,\n    raw: String,\n}\n\nimpl StreamFilter {\n    pub fn new() -\u003e Self {\n        Self::default()\n    }\n\n    /// Feed one delta, returning visible text that is safe to print now.\n    pub fn push(\u0026mut self, delta: \u0026str) -\u003e String {\n        self.buffer.push_str(delta);\n        self.raw.push_str(delta);\n\n        let mut visible = String::new();\n        loop {\n            if let Some(start) = self.buffer.find(MARKER) {\n                if start \u003e 0 {\n                    visible.push_str(\u0026self.buffer[..start]);\n                    self.buffer.drain(..start);\n                }\n                let Some(header_end) = self.buffer.find(\"\u003e\u003e\") else {\n                    break;\n                };\n                let body_start = header_end + 2;\n                let Some(close_rel) = self.buffer[body_start..].find(CLOSE_PREFIX) else {\n                    break;\n                };\n                let close_start = body_start + close_rel;\n                let Some(close_tail) = self.buffer[close_start..].find(\"\u003e\u003e\") else {\n                    break;\n                };\n                let close_end = close_start + close_tail + 2;\n                self.buffer.drain(..close_end);\n                continue;\n            }\n\n            let hold = held_suffix_len(\u0026self.buffer);\n            let flush = self.buffer.len() - hold;\n            visible.push_str(\u0026self.buffer[..flush]);\n            self.buffer.drain(..flush);\n            break;\n        }\n        visible\n    }\n\n    /// Flush the held tail and return `(tail, raw_text)`.\n    pub fn finish(\u0026mut self) -\u003e (String, String) {\n        let tail = std::mem::take(\u0026mut self.buffer);\n        let raw = std::mem::take(\u0026mut self.raw);\n        (tail, raw)\n    }\n}\n\n/// How many trailing bytes could still grow into `\u003c\u003cniuse:`.\nfn held_suffix_len(buffer: \u0026str) -\u003e usize {\n    let max = MARKER.len().min(buffer.len());\n    for length in (1..=max).rev() {\n        let start = buffer.len() - length;\n        if buffer.is_char_boundary(start) \u0026\u0026 MARKER.starts_with(\u0026buffer[start..]) {\n            return length;\n        }\n    }\n    0\n}\n\n#[cfg(test)]\n","truncated":true}]},{"id":"policy","title":"Policy","layer":"engine","status":"done","summary":"Soft expiry, conflict similarity, and secret-pattern scanning.","contract":"Pure functions; refusal is the default, and overriding requires an explicit --force.","paths":["crates/niuse-core/src/policy.rs"],"notes":["Character-bigram Jaccard works for both Chinese and English.","Sharing a tag lowers the threshold to 0.35.","The secret scan is a backstop, not a guarantee."],"sources":[{"path":"crates/niuse-core/src/policy.rs","language":"rust","text":"//! Write-time policy: secret scanning and near-duplicate detection.\n//!\n//! Both are deliberately conservative. A false positive costs one `[f]orce`\n//! keystroke; a false negative puts a credential in every future request.\n\nuse std::collections::HashSet;\nuse std::sync::OnceLock;\n\nuse regex::Regex;\n\n/// Similarity at which two entries are treated as the same claim.\npub const TEXT_THRESHOLD: f64 = 0.5;\n/// Lower bar when the entries share a tag: short entries rarely reach 0.5.\npub const TAG_THRESHOLD: f64 = 0.35;\n\n/// Returns a human-readable reason when `text` looks like it carries a\n/// credential. This is a backstop, not a guarantee.\npub fn secret_reason(text: \u0026str) -\u003e Option\u003c\u0026'static str\u003e {\n    patterns()\n        .iter()\n        .find(|(pattern, _)| pattern.is_match(text))\n        .map(|(_, reason)| *reason)\n}\n\nfn patterns() -\u003e \u0026'static [(Regex, \u0026'static str)] {\n    static PATTERNS: OnceLock\u003cVec\u003c(Regex, \u0026'static str)\u003e\u003e = OnceLock::new();\n    PATTERNS.get_or_init(|| {\n        let pattern = |source: \u0026str| Regex::new(source).expect(\"valid built-in regex\");\n        vec![\n            (pattern(r\"sk-[A-Za-z0-9_-]{16,}\"), \"API key (sk-)\"),\n            (pattern(r\"ghp_[A-Za-z0-9]{20,}\"), \"GitHub token (ghp_)\"),\n            (\n                pattern(r\"github_pat_[A-Za-z0-9_]{20,}\"),\n                \"GitHub token (github_pat_)\",\n            ),\n            (pattern(r\"AKIA[0-9A-Z]{16}\"), \"AWS access key (AKIA)\"),\n            (\n                pattern(r\"-----BEGIN [A-Z ]*PRIVATE KEY-----\"),\n                \"private key block\",\n            ),\n            (\n                pattern(r\"xox[baprs]-[A-Za-z0-9-]{10,}\"),\n                \"Slack token (xox)\",\n            ),\n            (pattern(r\"AIza[0-9A-Za-z_-]{20,}\"), \"Google API key (AIza)\"),\n            (\n                pattern(r\"\\b[0-9a-fA-F]{32,}\\b\"),\n                \"long hex string (possible key or digest)\",\n            ),\n        ]\n    })\n}\n\n/// Character-bigram Jaccard similarity. Works for Chinese and English without\n/// a tokenizer, and is cheap enough to run over a few hundred entries.\npub fn similarity(left: \u0026str, right: \u0026str) -\u003e f64 {\n    let left_normalized = normalized_chars(left);\n    let right_normalized = normalized_chars(right);\n    if left_normalized.is_empty() || right_normalized.is_empty() {\n        return f64::from(left_normalized == right_normalized);\n    }\n\n    let left_shingles = shingles(\u0026left_normalized);\n    let right_shingles = shingles(\u0026right_normalized);\n    let intersection = left_shingles.intersection(\u0026right_shingles).count() as f64;\n    let union = left_shingles.union(\u0026right_shingles).count() as f64;\n    if union == 0.0 {\n        return 0.0;\n    }\n    intersection / union\n}\n\n/// Rank a memory against a free-text query for `/mem recall`.\n///\n/// Substring matches and tag matches deliberately outrank bigram similarity:\n/// a short query like \"nextest\" has too few bigrams to score well against a\n/// long sentence, but an exact substring is an obviously good hit.\npub fn search_score(query: \u0026str, text: \u0026str, tags: \u0026[String]) -\u003e f64 {\n    let query = normalize_string(query);\n    if query.is_empty() {\n        return 0.0;\n    }\n\n    if normalize_string(text).contains(\u0026query) {\n        return 0.9;\n    }\n\n    let tag_score = tags\n        .iter()\n        .map(|tag| {\n            let tag = normalize_string(tag);\n            if tag == query {\n                1.0\n            } else if tag.contains(\u0026query) {\n                0.8\n            } else {\n                0.0\n            }\n        })\n        .fold(0.0, f64::max);\n\n    tag_score.max(similarity(\u0026query, text))\n}\n\npub fn conflicts(\n    left_text: \u0026str,\n    left_tags: \u0026[String],\n    right_text: \u0026str,\n    right_tags: \u0026[String],\n) -\u003e bool {\n    let score = similarity(left_text, right_text);\n    if score \u003e= TEXT_THRESHOLD {\n        return true;\n    }\n    let shared = left_tags\n        .iter()\n        .any(|tag| right_tags.iter().any(|other| other == tag));\n    shared \u0026\u0026 score \u003e= TAG_THRESHOLD\n}\n\nfn normalize_string(input: \u0026str) -\u003e String {\n    input\n        .chars()\n        .flat_map(char::to_lowercase)\n        .filter(|character| character.is_alphanumeric())\n        .collect()\n}\n\nfn normalized_chars(input: \u0026str) -\u003e Vec\u003cchar\u003e {\n    input\n        .chars()\n        .flat_map(char::to_lowercase)\n        .filter(|character| character.is_alphanumeric())\n        .collect()\n}\n\nfn shingles(chars: \u0026[char]) -\u003e HashSet\u003c(char, char)\u003e {\n    chars\n        .windows(2)\n        .map(|window| (window[0], window[1]))\n        .collect()\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn detects_common_key_shapes() {\n        assert!(secret_reason(\"token sk-abcdefghijklmnopqrstuvwxyz\").is_some());\n        assert!(secret_reason(\"ghp_abcdefghijklmnopqrstuvwx\").is_some());\n        assert!(secret_reason(\"AKIAABCDEFGHIJKLMNOP\").is_some());\n        assert!(secret_reason(\"-----BEGIN RSA PRIVATE KEY-----\").is_some());\n        assert!(secret_reason(\"xoxb-1234567890-abcdef\").is_some());\n        assert!(secret_reason(\"0123456789abcdef0123456789abcdef\").is_some());\n    }\n\n    #[test]\n    fn ordinary_prose_is_not_flagged() {\n        assert!(secret_reason(\"Rust 仓库一律用 cargo nextest\").is_none());\n        assert!(secret_reason(\"commit deadbeef\").is_none());\n        assert!(secret_reason(\"sk-短\").is_none());\n    }\n\n    #[test]\n    fn identical_claims_are_conflicts() {\n        assert!(conflicts(\"用 nextest\", \u0026[], \"用 nextest\", \u0026[]));\n    }\n\n    #[test]\n    fn similar_claims_are_conflicts() {\n        let left = \"Rust 仓库一律使用 cargo nextest，不要用 cargo test\";\n        let right = \"Rust 仓库一律用 cargo nextest，不用 cargo test\";\n        assert!(similarity(left, right) \u003e= TEXT_THRESHOLD);\n    }\n\n    #[test]\n    fn unrelated_claims_are_not_conflicts() {\n        assert!(!conflicts(\"用 nextest 跑测试\", \u0026[], \"先给结论再展开\", \u0026[]));\n    }\n\n    #[test]\n    fn search_prefers_substrings_and_tags() {\n        assert_eq!(\n            search_score(\"nextest\", \"Rust 仓库一律用 cargo nextest\", \u0026[]),\n            0.9\n        );\n        assert_eq!(\n            search_score(\"rust\", \"用 cargo nextest\", \u0026[\"rust\".into()]),\n            1.0\n        );\n        assert!(search_score(\"rust\", \"用 cargo nextest\", \u0026[\"rust-tooling\".into()]) \u003e= 0.8);\n        assert!(search_score(\"kubernetes\", \"用 cargo nextest\", \u0026[\"rust\".into()]) \u003c 0.2);\n    }\n\n    #[test]\n    fn shared_tag_lowers_the_bar() {\n        let tags = vec![\"rust\".to_string()];\n        assert!(conflicts(\n            \"Rust 项目用 nextest\",\n","truncated":true}]},{"id":"driver","title":"Driver","layer":"adapters","status":"done","summary":"The niucode boundary: open and resume sessions, project history, per-turn cwd, forward events.","contract":"Only this file imports niucode-agent; target about 200 lines; do not change the loop or fork it.","paths":["crates/niuse-cli/src/driver.rs"],"notes":["Per-turn working_dir on one session is verified.","History is projected by project_history from the event log; there is no second transcript.","Ctrl-C cancels provider and tools by dropping the future."],"sources":[{"path":"crates/niuse-cli/src/driver.rs","language":"rust","text":"//! Session glue between niuse's stores and niucode's turn loop.\n\nuse std::fs;\nuse std::path::{Path, PathBuf};\n\nuse anyhow::{Context, Result};\nuse niucode_agent::{\n    project_history, run_with_history, AgentConfig, AgentEvent, ApprovalMode, ApprovalRequest,\n    RunOutcome,\n};\nuse niucode_core::{load, now_ms, Event, SessionLog};\nuse niucode_provider::{ChatMessage, Provider};\nuse niucode_tools::SandboxPolicy;\n\nuse crate::render::{approve, Renderer};\n\npub struct SessionMeta\u003c'a\u003e {\n    pub cwd: \u0026'a Path,\n    pub model: \u0026'a str,\n    pub provider: \u0026'a str,\n    pub policy: SandboxPolicy,\n    pub approval: ApprovalMode,\n}\n\npub struct Thread {\n    pub log: SessionLog,\n    pub path: PathBuf,\n}\n\n/// Open the durable thread, creating it on first use.\npub fn open_thread(path: \u0026Path, meta: \u0026SessionMeta\u003c'_\u003e) -\u003e Result\u003cThread\u003e {\n    if let Some(parent) = path.parent() {\n        fs::create_dir_all(parent)\n            .with_context(|| format!(\"create directory {}\", parent.display()))?;\n    }\n    let created = !path.exists() || fs::metadata(path).map(|m| m.len() == 0).unwrap_or(true);\n    if !path.exists() {\n        fs::File::create(path).with_context(|| format!(\"create thread {}\", path.display()))?;\n        set_private(path)?;\n    }\n\n    let log = SessionLog::open(path)?;\n    if created {\n        append_start(\u0026log, meta)?;\n    }\n    Ok(Thread {\n        log,\n        path: path.to_path_buf(),\n    })\n}\n\npub fn append_start(log: \u0026SessionLog, meta: \u0026SessionMeta\u003c'_\u003e) -\u003e Result\u003c()\u003e {\n    log.append(\u0026Event::SessionStart {\n        id: log.id().to_string(),\n        cwd: meta.cwd.display().to_string(),\n        model: meta.model.to_string(),\n        provider: meta.provider.to_string(),\n        ts: now_ms(),\n    })?;\n    log.append(\u0026Event::Policy {\n        sandbox: meta.policy.mode.as_str().to_string(),\n        approval: meta.approval.as_str().to_string(),\n        network: meta.policy.network.as_str().to_string(),\n        backend: meta.policy.backend().to_string(),\n        ts: now_ms(),\n    })?;\n    Ok(())\n}\n\npub fn append_end(log: \u0026SessionLog) -\u003e Result\u003c()\u003e {\n    log.append(\u0026Event::SessionEnd { ts: now_ms() })\n}\n\npub fn history(path: \u0026Path) -\u003e Result\u003cVec\u003cChatMessage\u003e\u003e {\n    if !path.exists() {\n        return Ok(Vec::new());\n    }\n    let loaded = load(path).with_context(|| format!(\"load session {}\", path.display()))?;\n    for warning in loaded.warnings {\n        eprintln!(\"session warning: {warning}\");\n    }\n    project_history(\u0026loaded.events)\n}\n\n/// Move the current thread into the archive directory. Returns `None` when\n/// there is nothing to archive.\npub fn archive_thread(path: \u0026Path, directory: \u0026Path) -\u003e Result\u003cOption\u003cPathBuf\u003e\u003e {\n    if !path.exists() {\n        return Ok(None);\n    }\n    fs::create_dir_all(directory)\n        .with_context(|| format!(\"create directory {}\", directory.display()))?;\n    let stamp = std::time::SystemTime::now()\n        .duration_since(std::time::UNIX_EPOCH)\n        .map(|elapsed| elapsed.as_millis())\n        .unwrap_or(0);\n    let destination = directory.join(format!(\"thread-{stamp}.jsonl\"));\n    fs::rename(path, \u0026destination)\n        .with_context(|| format!(\"archive {} to {}\", path.display(), destination.display()))?;\n    Ok(Some(destination))\n}\n\npub fn new_session(directory: \u0026Path) -\u003e Result\u003cSessionLog\u003e {\n    fs::create_dir_all(directory)\n        .with_context(|| format!(\"create directory {}\", directory.display()))?;\n    let log = SessionLog::create(directory)?;\n    set_private(log.path())?;\n    Ok(log)\n}\n\n#[allow(clippy::too_many_arguments)]\npub fn agent_config(\n    provider: \u0026str,\n    model: \u0026str,\n    cwd: \u0026Path,\n    system_prompt: String,\n    policy: SandboxPolicy,\n    approval: ApprovalMode,\n    allow_unsandboxed: bool,\n    max_steps: usize,\n) -\u003e AgentConfig {\n    let mut config = AgentConfig::new(model, cwd);\n    config.provider = provider.to_string();\n    config.system_prompt = system_prompt;\n    config.sandbox = policy;\n    config.approval = approval;\n    config.allow_unsandboxed = allow_unsandboxed;\n    config.max_steps = max_steps;\n    let budget = niucode_provider::derived_context_budget(provider, model);\n    if budget \u003e 0 {\n        config.context.budget_tokens = budget;\n    }\n    config\n}\n\n/// Run one user turn. `Ok(None)` means the user cancelled with Ctrl-C.\npub async fn run_turn(\n    provider: \u0026dyn Provider,\n    log: \u0026mut SessionLog,\n    config: \u0026AgentConfig,\n    prompt: \u0026str,\n    history: Vec\u003cChatMessage\u003e,\n    renderer: \u0026mut Renderer,\n) -\u003e Result\u003cOption\u003cRunOutcome\u003e\u003e {\n    let mut observer = |event: AgentEvent| renderer.event(event);\n    let mut approver = |request: \u0026ApprovalRequest| approve(request);\n\n    let future = run_with_history(\n        provider,\n        log,\n        config,\n        prompt,\n        history,\n        \u0026mut approver,\n        \u0026mut observer,\n    );\n    tokio::pin!(future);\n\n    tokio::select! {\n        result = \u0026mut future =\u003e result.map(Some),\n        _ = tokio::signal::ctrl_c() =\u003e Ok(None),\n    }\n}\n\n#[cfg(unix)]\nfn set_private(path: \u0026Path) -\u003e Result\u003c()\u003e {\n    use std::os::unix::fs::PermissionsExt;\n    let mut permissions = fs::metadata(path)?.permissions();\n    permissions.set_mode(0o600);\n    fs::set_permissions(path, permissions)?;\n    Ok(())\n}\n\n#[cfg(not(unix))]\nfn set_private(_path: \u0026Path) -\u003e Result\u003c()\u003e {\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn archive_moves_the_thread() {\n        let directory = tempfile::tempdir().unwrap();\n        let source = directory.path().join(\"thread.jsonl\");\n        fs::write(\u0026source, \"{}\\n\").unwrap();\n        let archive = directory.path().join(\"threads\");\n        let destination = archive_thread(\u0026source, \u0026archive).unwrap().unwrap();\n        assert!(!source.exists());\n        assert!(destination.exists());\n        assert_eq!(fs::read_to_string(\u0026destination).unwrap(), \"{}\\n\");\n    }\n\n    #[test]\n    fn archiving_a_missing_thread_is_a_noop() {\n        let directory = tempfile::tempdir().unwrap();\n        assert!(archive_thread(\n            \u0026directory.path().join(\"missing.jsonl\"),\n            \u0026directory.path().join(\"threads\")\n","truncated":true}]},{"id":"bootstrap","title":"Bootstrap","layer":"adapters","status":"done","summary":"Mine old niucode sessions into an inbox, then review candidates one by one.","contract":"Send only user / assistant text; one tool-free call per session; never write memory directly.","paths":["crates/niuse-cli/src/bootstrap.rs"],"notes":["Tool output is dropped before extraction.","Only sessions with dialogue are kept, to avoid wasting model calls.","Candidates are deduplicated against existing memory and within the batch."],"sources":[{"path":"crates/niuse-cli/src/bootstrap.rs","language":"rust","text":"//! Cold start: read old niucode sessions, extract durable candidates with one\n//! cheap model call per session, and queue them for review.\n//!\n//! Tool output is deliberately dropped before extraction: the value is in what\n//! was said and decided, not in the file contents the agent already read.\n\nuse std::cmp::Reverse;\nuse std::env;\nuse std::io::{self, Write};\nuse std::path::{Path, PathBuf};\nuse std::time::{Duration, SystemTime};\n\nuse anyhow::{Context, Result};\nuse futures_util::StreamExt;\nuse niucode_core::{load, Event};\nuse niucode_provider::{ChatMessage, CompletionRequest, Provider, StreamEvent};\nuse niuse_core::model::{normalize_tags, one_line};\nuse niuse_core::policy::{conflicts, secret_reason};\nuse niuse_core::{Date, MemoryEntry, MemoryKind, Store};\nuse serde::Deserialize;\n\nconst EXTRACTION_SYSTEM: \u0026str = \"你是记忆抽取器。下面是一段 coding agent 与用户的真实历史对话。\\n\\\n只抽取三类跨会话仍然有用的信息：用户的偏好、做过的决策、踩过的坑。\\n\\\n每条必须同时满足：脱离这段对话也能看懂；在仓库里 grep 不出来；一句话说得清。\\n\\\n不要抽取：代码事实、文件路径、环境配置、临时任务进度、别人的信息、任何密钥。\\n\\\n输出 JSON 数组，元素形如 {\\\"kind\\\":\\\"preference|lesson\\\",\\\"text\\\":\\\"...\\\",\\\"tags\\\":[\\\"...\\\"]}。\\n\\\n没有值得记的就输出 []。不要输出 JSON 以外的任何文字。\";\n\nconst PROFILE_SYSTEM: \u0026str =\n    \"你是用户画像整理器。根据下面的历史对话，写一份 user.md 草稿，用 Markdown，不超过 20 行。\\n\\\n包含三个小节：## 我在做什么、## 我的工作方式、## 我的雷区。\\n\\\n只写对话中有证据的内容；不确定的不要编。不要写代码、文件路径、密钥、别人的信息。\\n\\\n只输出 Markdown，不要解释。\";\n\nconst MAX_MESSAGE_CHARS: usize = 2_000;\nconst MAX_PROFILE_CHARS: usize = 10_000;\nconst MAX_TRANSCRIPT_CHARS: usize = 12_000;\n\n#[derive(Debug, Deserialize)]\nstruct Candidate {\n    kind: String,\n    text: String,\n    #[serde(default)]\n    tags: Vec\u003cString\u003e,\n}\n\n#[derive(Debug, Clone)]\nstruct Pending {\n    kind: MemoryKind,\n    tags: Vec\u003cString\u003e,\n    text: String,\n    source: String,\n}\n\npub struct BootstrapOptions {\n    pub limit: usize,\n    pub since_days: i64,\n    pub dry_run: bool,\n    pub profile: bool,\n    pub force_profile: bool,\n    pub profile_only: bool,\n}\n\npub async fn run(\n    store: \u0026Store,\n    provider: \u0026dyn Provider,\n    model: \u0026str,\n    options: BootstrapOptions,\n) -\u003e Result\u003c()\u003e {\n    let BootstrapOptions {\n        limit,\n        since_days,\n        dry_run,\n        profile,\n        force_profile,\n        profile_only,\n    } = options;\n    let profile = profile || profile_only;\n    let candidates = recent_sessions(usize::MAX, since_days)?;\n    if candidates.is_empty() {\n        println!(\"没有找到最近 {since_days} 天内的 niucode session。\");\n        return Ok(());\n    }\n\n    // An empty or tool-only session is not worth a model call. Fill the budget\n    // with sessions that actually contain user or assistant prose.\n    let mut sessions: Vec\u003c(PathBuf, String)\u003e = Vec::new();\n    for path in candidates {\n        if let Some(transcript) = transcript(\u0026path)? {\n            sessions.push((path, transcript));\n            if sessions.len() \u003e= limit {\n                break;\n            }\n        }\n    }\n    if sessions.is_empty() {\n        println!(\"最近 {since_days} 天内的 session 都没有可抽取的对话。\");\n        return Ok(());\n    }\n    println!(\n        \"扫描 {} 个 session（最近 {} 天，上限 {}）。\",\n        sessions.len(),\n        since_days,\n        limit\n    );\n\n    if dry_run {\n        println!(\"dry run：不会调用模型。\");\n        for (path, transcript) in \u0026sessions {\n            let name = path\n                .file_stem()\n                .and_then(|stem| stem.to_str())\n                .unwrap_or(\"session\");\n            println!(\"  {name}  {} chars\", transcript.chars().count());\n        }\n        if profile {\n            println!(\"would draft user.md from the same sessions\");\n        }\n        return Ok(());\n    }\n\n    if profile {\n        match store.user()? {\n            Some(text) if !text.trim().is_empty() \u0026\u0026 !force_profile =\u003e {\n                println!(\"user.md 已存在；跳过 profile（用 --force-profile 覆盖）\");\n            }\n            _ =\u003e write_profile(store, provider, model, \u0026sessions).await?,\n        }\n    }\n    if profile_only {\n        println!(\"profile-only：跳过记忆候选。\");\n        return Ok(());\n    }\n\n    let mut raw: Vec\u003cPending\u003e = Vec::new();\n    for (index, (path, transcript)) in sessions.iter().enumerate() {\n        eprint!(\"\\r[{}/{}] 抽取中…\", index + 1, sessions.len());\n        let _ = io::stderr().flush();\n\n        match extract(provider, model, transcript).await {\n            Ok(candidates) =\u003e {\n                let source = path\n                    .file_stem()\n                    .and_then(|stem| stem.to_str())\n                    .unwrap_or(\"session\")\n                    .to_string();\n                for candidate in candidates {\n                    let kind = MemoryKind::parse(\u0026candidate.kind).unwrap_or(MemoryKind::Preference);\n                    let text = one_line(candidate.text);\n                    if text.is_empty() {\n                        continue;\n                    }\n                    raw.push(Pending {\n                        kind,\n                        tags: normalize_tags(candidate.tags),\n                        text,\n                        source: source.clone(),\n                    });\n                }\n            }\n            Err(error) =\u003e {\n                eprintln!(\n                    \"\\n  skip {}: {error:#}\",\n                    path.file_name().unwrap_or_default().to_string_lossy()\n                );\n            }\n        }\n    }\n    eprintln!();\n\n    let existing = store.memories()?;\n    let inbox = store.read_inbox()?;\n    let merged = merge_candidates(\u0026existing, inbox.as_deref(), raw);\n    let added = merged.len().saturating_sub(\n        inbox\n            .as_deref()\n            .map(parse_inbox)\n            .map(|items| items.len())\n            .unwrap_or(0),\n    );\n\n    write_inbox(store, \u0026merged)?;\n    println!(\n        \"{} new candidate(s), {} pending in {}\",\n        added,\n        merged.len(),\n        store.inbox_path().display()\n    );\n    if !merged.is_empty() {\n        println!(\"运行 `niuse review` 逐条确认。\");\n    }\n    Ok(())\n}\n\n/// Merge new candidates into the existing queue instead of replacing it.\n///\n/// Accepted memories and secret-bearing entries are dropped from both sides;\n/// duplicates are compared with the same similarity rule as memory writes.\nfn merge_candidates(\n    memories: \u0026[MemoryEntry],\n","truncated":true}]},{"id":"stores","title":"Stores","layer":"state","status":"done","summary":"Parse and atomically save the five stores with 0700 / 0600, merging journal entries by day.","contract":"Markdown is the only format; write a temporary file then rename; reads tolerate bad lines.","paths":["crates/niuse-core/src/store.rs","crates/niuse-core/src/model.rs","crates/niuse-core/src/date.rs"],"notes":["A missing identity.md is a legal state, not an empty string.","Memory is split into preferences.md / lessons.md.","Dates are UTC-based to avoid a timezone database."],"sources":[{"path":"crates/niuse-core/src/store.rs","language":"rust","text":"//! Filesystem layout for `~/.niuse`.\n//!\n//! Everything is Markdown. Mutations rewrite the affected file atomically and\n//! keep it `0600`; a human can edit any of these files and the next load picks\n//! the change up.\n\nuse std::cmp::Reverse;\nuse std::fs;\nuse std::io::Write as _;\nuse std::path::{Path, PathBuf};\n\nuse anyhow::{Context, Result};\n\nuse crate::date::Date;\nuse crate::model::{\n    parse_journal, parse_loop_line, parse_memory_section, JournalDay, LoopItem, MemoryEntry,\n    MemoryKind,\n};\n\nconst MEMORY_HEADER: \u0026str = \"\u003c!-- 由 niuse 维护。可以手工编辑，但请保持每条的字段格式。 --\u003e\\n\";\n\n#[derive(Debug, Clone)]\npub struct Store {\n    root: PathBuf,\n}\n\nimpl Store {\n    /// `$NIUSE_HOME`, else `$HOME/.niuse`.\n    pub fn discover() -\u003e Result\u003cSelf\u003e {\n        if let Some(root) = std::env::var_os(\"NIUSE_HOME\") {\n            return Ok(Self::at(root));\n        }\n        let home = std::env::var_os(\"HOME\").context(\"HOME is not set; set NIUSE_HOME instead\")?;\n        Ok(Self::at(PathBuf::from(home).join(\".niuse\")))\n    }\n\n    pub fn at(root: impl Into\u003cPathBuf\u003e) -\u003e Self {\n        Self { root: root.into() }\n    }\n\n    pub fn root(\u0026self) -\u003e \u0026Path {\n        \u0026self.root\n    }\n\n    pub fn identity_path(\u0026self) -\u003e PathBuf {\n        self.root.join(\"identity.md\")\n    }\n\n    pub fn user_path(\u0026self) -\u003e PathBuf {\n        self.root.join(\"user.md\")\n    }\n\n    pub fn memory_dir(\u0026self) -\u003e PathBuf {\n        self.root.join(\"memory\")\n    }\n\n    pub fn journal_dir(\u0026self) -\u003e PathBuf {\n        self.root.join(\"journal\")\n    }\n\n    pub fn loops_path(\u0026self) -\u003e PathBuf {\n        self.root.join(\"loops.md\")\n    }\n\n    pub fn session_path(\u0026self) -\u003e PathBuf {\n        self.root.join(\"thread.jsonl\")\n    }\n\n    pub fn threads_dir(\u0026self) -\u003e PathBuf {\n        self.root.join(\"threads\")\n    }\n\n    pub fn config_path(\u0026self) -\u003e PathBuf {\n        self.root.join(\"config.toml\")\n    }\n\n    pub fn inbox_path(\u0026self) -\u003e PathBuf {\n        self.root.join(\"inbox.md\")\n    }\n\n    /// Create the directory skeleton. Missing prose files stay missing: an\n    /// absent `identity.md` is a meaningful state, not an empty string.\n    pub fn init(\u0026self) -\u003e Result\u003c()\u003e {\n        create_private_dir(\u0026self.root)?;\n        create_private_dir(\u0026self.memory_dir())?;\n        create_private_dir(\u0026self.journal_dir())?;\n        Ok(())\n    }\n\n    pub fn identity(\u0026self) -\u003e Result\u003cOption\u003cString\u003e\u003e {\n        read_optional(\u0026self.identity_path())\n    }\n\n    pub fn user(\u0026self) -\u003e Result\u003cOption\u003cString\u003e\u003e {\n        read_optional(\u0026self.user_path())\n    }\n\n    pub fn write_identity(\u0026self, text: \u0026str) -\u003e Result\u003c()\u003e {\n        write_private(\u0026self.identity_path(), text)\n    }\n\n    pub fn write_user(\u0026self, text: \u0026str) -\u003e Result\u003c()\u003e {\n        write_private(\u0026self.user_path(), text)\n    }\n\n    pub fn memories(\u0026self) -\u003e Result\u003cVec\u003cMemoryEntry\u003e\u003e {\n        let mut entries = Vec::new();\n        for kind in [MemoryKind::Preference, MemoryKind::Lesson] {\n            let path = self.memory_dir().join(kind.file());\n            let text = read_optional(\u0026path)?.unwrap_or_default();\n            entries.extend(parse_memory_file(\u0026text, kind, Date::today()));\n        }\n        entries.sort_by_key(|entry| Reverse(entry.confirmed));\n        Ok(entries)\n    }\n\n    pub fn add_memory(\u0026self, mut entry: MemoryEntry) -\u003e Result\u003cMemoryEntry\u003e {\n        let mut entries = self.memories()?;\n        while entries.iter().any(|existing| existing.id == entry.id) {\n            entry.id = crate::model::new_id(\u0026format!(\"{}-{}\", entry.text, entry.id));\n        }\n        entries.push(entry.clone());\n        self.write_memories(\u0026entries)?;\n        Ok(entry)\n    }\n\n    pub fn update_memory(\n        \u0026self,\n        id: \u0026str,\n        update: impl FnOnce(\u0026mut MemoryEntry),\n    ) -\u003e Result\u003cOption\u003cMemoryEntry\u003e\u003e {\n        let mut entries = self.memories()?;\n        let Some(entry) = entries.iter_mut().find(|entry| entry.id == id) else {\n            return Ok(None);\n        };\n        update(entry);\n        let updated = entry.clone();\n        self.write_memories(\u0026entries)?;\n        Ok(Some(updated))\n    }\n\n    pub fn remove_memory(\u0026self, id: \u0026str) -\u003e Result\u003cbool\u003e {\n        let mut entries = self.memories()?;\n        let before = entries.len();\n        entries.retain(|entry| entry.id != id);\n        if entries.len() == before {\n            return Ok(false);\n        }\n        self.write_memories(\u0026entries)?;\n        Ok(true)\n    }\n\n    pub fn write_memories(\u0026self, entries: \u0026[MemoryEntry]) -\u003e Result\u003c()\u003e {\n        for kind in [MemoryKind::Preference, MemoryKind::Lesson] {\n            let mut text = format!(\"# {}\\n\\n{MEMORY_HEADER}\\n\", kind.title());\n            for entry in entries.iter().filter(|entry| entry.kind == kind) {\n                text.push_str(\u0026entry.render());\n                text.push('\\n');\n            }\n            write_private(\u0026self.memory_dir().join(kind.file()), \u0026text)?;\n        }\n        Ok(())\n    }\n\n    pub fn loops(\u0026self) -\u003e Result\u003cVec\u003cLoopItem\u003e\u003e {\n        let text = read_optional(\u0026self.loops_path())?.unwrap_or_default();\n        Ok(parse_loops(\u0026text))\n    }\n\n    pub fn write_loops(\u0026self, loops: \u0026[LoopItem]) -\u003e Result\u003c()\u003e {\n        let mut text = String::from(\"# 未完成的承诺\\n\\n\u003c!-- 由 niuse 维护。--\u003e \\n\\n\");\n        for item in loops {\n            text.push_str(\u0026item.render());\n            text.push('\\n');\n        }\n        write_private(\u0026self.loops_path(), \u0026text)\n    }\n\n    pub fn add_loop(\u0026self, item: LoopItem) -\u003e Result\u003cLoopItem\u003e {\n        let mut loops = self.loops()?;\n        loops.push(item.clone());\n        self.write_loops(\u0026loops)?;\n        Ok(item)\n    }\n\n    pub fn close_loop(\u0026self, id: \u0026str) -\u003e Result\u003cbool\u003e {\n        let mut loops = self.loops()?;\n        let Some(item) = loops.iter_mut().find(|item| item.id == id) else {\n            return Ok(false);\n        };\n        item.done = true;\n        self.write_loops(\u0026loops)?;\n        Ok(true)\n    }\n\n    /// Append bullets under the given day, creating the day section if needed.\n    pub fn append_journal(\u0026self, date: Date, bullets: \u0026[String]) -\u003e Result\u003cbool\u003e {\n        let bullets: Vec\u003cString\u003e = bullets\n            .iter()\n            .map(|bullet| crate::model::one_line(bullet.trim_start_matches('-').to_string()))\n","truncated":true},{"path":"crates/niuse-core/src/model.rs","language":"rust","text":"//! The durable records niuse keeps about a person and a working relationship:\n//! memory entries, open loops, and journal days.\n//!\n//! Every record renders to Markdown that a human can edit. Parsing is tolerant:\n//! unknown lines are ignored, and a broken field costs one record, not the file.\n\nuse std::collections::hash_map::DefaultHasher;\nuse std::hash::{Hash, Hasher};\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse crate::date::Date;\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum MemoryKind {\n    Preference,\n    Lesson,\n}\n\nimpl MemoryKind {\n    pub fn as_str(self) -\u003e \u0026'static str {\n        match self {\n            Self::Preference =\u003e \"preference\",\n            Self::Lesson =\u003e \"lesson\",\n        }\n    }\n\n    pub fn title(self) -\u003e \u0026'static str {\n        match self {\n            Self::Preference =\u003e \"偏好\",\n            Self::Lesson =\u003e \"决策与踩坑\",\n        }\n    }\n\n    pub fn file(self) -\u003e \u0026'static str {\n        match self {\n            Self::Preference =\u003e \"preferences.md\",\n            Self::Lesson =\u003e \"lessons.md\",\n        }\n    }\n\n    pub fn parse(input: \u0026str) -\u003e Option\u003cSelf\u003e {\n        match input.trim().to_lowercase().as_str() {\n            \"preference\" | \"pref\" | \"偏好\" =\u003e Some(Self::Preference),\n            \"lesson\" | \"decision\" | \"pitfall\" | \"决策\" | \"踩坑\" =\u003e Some(Self::Lesson),\n            _ =\u003e None,\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct MemoryEntry {\n    pub id: String,\n    pub kind: MemoryKind,\n    pub text: String,\n    pub tags: Vec\u003cString\u003e,\n    pub created: Date,\n    pub confirmed: Date,\n    pub source: Option\u003cString\u003e,\n}\n\nimpl MemoryEntry {\n    pub fn new(\n        kind: MemoryKind,\n        text: impl Into\u003cString\u003e,\n        tags: Vec\u003cString\u003e,\n        today: Date,\n        source: Option\u003cString\u003e,\n    ) -\u003e Self {\n        let text = one_line(text.into());\n        Self {\n            id: new_id(\u0026text),\n            kind,\n            text,\n            tags: normalize_tags(tags),\n            created: today,\n            confirmed: today,\n            source,\n        }\n    }\n\n    pub fn age_days(\u0026self, today: Date) -\u003e i64 {\n        self.confirmed.age_days(today)\n    }\n\n    /// Older than a month: still injected, but labelled so the model verifies\n    /// before relying on it.\n    pub fn is_stale(\u0026self, today: Date) -\u003e bool {\n        self.age_days(today) \u003e 30\n    }\n\n    /// Older than a quarter: kept on disk, no longer injected automatically.\n    pub fn is_expired(\u0026self, today: Date) -\u003e bool {\n        self.age_days(today) \u003e 90\n    }\n\n    pub fn render(\u0026self) -\u003e String {\n        let mut out = format!(\n            \"### m-{}\\n- 结论：{}\\n- 类型：{}\\n\",\n            self.id,\n            self.text,\n            self.kind.as_str()\n        );\n        if !self.tags.is_empty() {\n            out.push_str(\u0026format!(\"- 标签：{}\\n\", self.tags.join(\", \")));\n        }\n        out.push_str(\u0026format!(\"- 创建：{}\\n\", self.created));\n        out.push_str(\u0026format!(\"- 最后确认：{}\\n\", self.confirmed));\n        if let Some(source) = \u0026self.source {\n            out.push_str(\u0026format!(\"- 来源：{source}\\n\"));\n        }\n        out\n    }\n}\n\n/// Parse one `### m-xxxx` section. Returns `None` when the section has no text.\npub fn parse_memory_section(\n    section: \u0026str,\n    fallback: MemoryKind,\n    today: Date,\n) -\u003e Option\u003cMemoryEntry\u003e {\n    let mut lines = section.lines();\n    let heading = lines.next()?.trim();\n    let id = heading\n        .strip_prefix(\"### m-\")\n        .map(str::trim)\n        .filter(|id| !id.is_empty())?\n        .to_string();\n\n    let mut text = None;\n    let mut kind = fallback;\n    let mut tags = Vec::new();\n    let mut created = today;\n    let mut confirmed = today;\n    let mut source = None;\n\n    for line in lines {\n        let Some((key, value)) = split_field(line) else {\n            continue;\n        };\n        match key {\n            \"结论\" | \"text\" =\u003e text = Some(value.to_string()),\n            \"类型\" | \"kind\" =\u003e {\n                if let Some(parsed) = MemoryKind::parse(value) {\n                    kind = parsed;\n                }\n            }\n            \"标签\" | \"tags\" =\u003e {\n                tags = value\n                    .split(',')\n                    .map(str::trim)\n                    .filter(|tag| !tag.is_empty())\n                    .map(str::to_string)\n                    .collect()\n            }\n            \"创建\" | \"created\" =\u003e created = Date::parse(value).unwrap_or(today),\n            \"最后确认\" | \"confirmed\" =\u003e confirmed = Date::parse(value).unwrap_or(today),\n            \"来源\" | \"source\" =\u003e source = Some(value.trim_matches('`').to_string()),\n            _ =\u003e {}\n        }\n    }\n\n    Some(MemoryEntry {\n        id,\n        kind,\n        text: one_line(text?),\n        tags,\n        created,\n        confirmed,\n        source,\n    })\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct LoopItem {\n    pub id: String,\n    pub text: String,\n    pub due: Option\u003cDate\u003e,\n    pub done: bool,\n}\n\nimpl LoopItem {\n    pub fn new(text: impl Into\u003cString\u003e, due: Option\u003cDate\u003e) -\u003e Self {\n        let text = one_line(text.into());\n        Self {\n            id: new_id(\u0026text),\n            text,\n            due,\n            done: false,\n        }\n    }\n\n    pub fn is_overdue(\u0026self, today: Date) -\u003e bool {\n        self.due.is_some_and(|due| !self.done \u0026\u0026 due \u003c today)\n    }\n\n    pub fn render(\u0026self) -\u003e String {\n        let mark = if self.done { \"x\" } else { \" \" };\n        match self.due {\n            Some(due) =\u003e format!(\"- [{mark}] l-{} {}（截止 {due}）\", self.id, self.text),\n            None =\u003e format!(\"- [{mark}] l-{} {}\", self.id, self.text),\n","truncated":true},{"path":"crates/niuse-core/src/date.rs","language":"rust","text":"//! Civil dates without a date-library dependency.\n//!\n//! Memory ages and journal headings only need `YYYY-MM-DD`, so a small,\n//! deterministic conversion from days since the Unix epoch is enough.\n\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nconst SECONDS_PER_DAY: i64 = 86_400;\n\n/// A calendar date, stored as days since 1970-01-01.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash)]\npub struct Date {\n    days: i64,\n}\n\nimpl Date {\n    pub fn from_days(days: i64) -\u003e Self {\n        Self { days }\n    }\n\n    pub fn as_days(self) -\u003e i64 {\n        self.days\n    }\n\n    /// Today in the machine's local timezone is not tracked; the day boundary\n    /// follows UTC. A personal journal one day off near midnight is worse than\n    /// carrying a timezone database, and the value is visibly a date.\n    pub fn today() -\u003e Self {\n        let seconds = SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .map(|elapsed| elapsed.as_secs() as i64)\n            .unwrap_or(0);\n        Self::from_days(seconds.div_euclid(SECONDS_PER_DAY))\n    }\n\n    pub fn plus_days(self, days: i64) -\u003e Self {\n        Self {\n            days: self.days + days,\n        }\n    }\n\n    pub fn age_days(self, today: Self) -\u003e i64 {\n        today.days - self.days\n    }\n\n    /// Parse a strict `YYYY-MM-DD` date. Out-of-range values are rejected.\n    pub fn parse(input: \u0026str) -\u003e Option\u003cSelf\u003e {\n        let input = input.trim();\n        let mut parts = input.split('-');\n        let year: i64 = parts.next()?.parse().ok()?;\n        let month: u32 = parts.next()?.parse().ok()?;\n        let day: u32 = parts.next()?.parse().ok()?;\n        if parts.next().is_some() || !(1..=12).contains(\u0026month) || !(1..=31).contains(\u0026day) {\n            return None;\n        }\n        let date = Self::from_days(days_from_civil(year, month, day));\n        (date.format() == input).then_some(date)\n    }\n\n    pub fn format(self) -\u003e String {\n        let (year, month, day) = civil_from_days(self.days);\n        format!(\"{year:04}-{month:02}-{day:02}\")\n    }\n}\n\nimpl std::fmt::Display for Date {\n    fn fmt(\u0026self, formatter: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        formatter.write_str(\u0026self.format())\n    }\n}\n\n/// Howard Hinnant's `civil_from_days`, with the epoch shifted to 1970-01-01.\nfn civil_from_days(days: i64) -\u003e (i64, u32, u32) {\n    let z = days + 719_468;\n    let era = if z \u003e= 0 { z } else { z - 146_096 } / 146_097;\n    let day_of_era = (z - era * 146_097) as u64;\n    let year_of_era =\n        (day_of_era - day_of_era / 1_460 + day_of_era / 36_524 - day_of_era / 146_096) / 365;\n    let year = year_of_era as i64 + era * 400;\n    let day_of_year = day_of_era - (365 * year_of_era + year_of_era / 4 - year_of_era / 100);\n    let month_prime = (5 * day_of_year + 2) / 153;\n    let day = (day_of_year - (153 * month_prime + 2) / 5 + 1) as u32;\n    let month = if month_prime \u003c 10 {\n        month_prime + 3\n    } else {\n        month_prime - 9\n    } as u32;\n    (if month \u003c= 2 { year + 1 } else { year }, month, day)\n}\n\nfn days_from_civil(year: i64, month: u32, day: u32) -\u003e i64 {\n    let year = if month \u003c= 2 { year - 1 } else { year };\n    let era = if year \u003e= 0 { year } else { year - 399 } / 400;\n    let year_of_era = (year - era * 400) as u64;\n    let month_prime = if month \u003e 2 { month - 3 } else { month + 9 } as u64;\n    let day_of_year = (153 * month_prime + 2) / 5 + day as u64 - 1;\n    let day_of_era = year_of_era * 365 + year_of_era / 4 - year_of_era / 100 + day_of_year;\n    era * 146_097 + day_of_era as i64 - 719_468\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn epoch_round_trips() {\n        assert_eq!(Date::from_days(0).format(), \"1970-01-01\");\n        assert_eq!(Date::parse(\"1970-01-01\").unwrap().as_days(), 0);\n    }\n\n    #[test]\n    fn leap_day_round_trips() {\n        let leap = Date::parse(\"2024-02-29\").expect(\"leap day parses\");\n        assert_eq!(leap.format(), \"2024-02-29\");\n        assert_eq!(Date::from_days(leap.as_days()), leap);\n    }\n\n    #[test]\n    fn known_date_round_trips() {\n        let date = Date::parse(\"2026-10-21\").expect(\"date parses\");\n        assert_eq!(date.format(), \"2026-10-21\");\n        assert_eq!(date.plus_days(1).format(), \"2026-10-22\");\n        assert_eq!(date.plus_days(11).format(), \"2026-11-01\");\n    }\n\n    #[test]\n    fn rejects_invalid_dates() {\n        for input in [\n            \"2026-13-01\",\n            \"2026-02-30\",\n            \"2026-1-1\",\n            \"2026-01\",\n            \"not-a-date\",\n        ] {\n            assert!(Date::parse(input).is_none(), \"{input} should not parse\");\n        }\n    }\n\n    # e {\n    let mut dir = std::env::current_dir()?;\n    loop {\n        if dir.join(\"docs/dashboard/project.json\").is_file() {\n            return Ok(dir);\n        }\n        if !dir.pop() {\n            bail!(\"could not find workspace root (docs/dashboard/project.json)\");\n        }\n    }\n}\n\nfn help_text() -\u003e String {\n    [\n        \"xtask\",\n        \"\",\n        \"  cargo xtask dashboard          build docs/index.html\",\n        \"  cargo xtask dashboard --check  fail if generated files are stale\",\n    ]\n    .join(\"\\n\")\n}\n","truncated":false},{"path":"crates/xtask/src/load.rs","language":"rust","text":"use std::fs;\nuse std::path::{Path, PathBuf};\n\nuse anyhow::{bail, Context, Result};\nuse walkdir::WalkDir;\n\nuse crate::model::{\n    CardFront, CardOut, Dashboard, DocFront, DocOut, Meta, ModuleOut, ProjectSpec, SourceFile,\n};\nuse crate::render;\nuse crate::validate;\n\npub fn build(root: \u0026Path) -\u003e Result\u003cDashboard\u003e {\n    let spec = read_spec(root)?;\n    let cards = load_cards(root)?;\n    let docs = load_docs(root)?;\n\n    validate::validate(root, \u0026spec, \u0026cards, \u0026docs)?;\n\n    let modules = spec\n        .modules\n        .iter()\n        .map(|module| ModuleOut {\n            module: module.clone(),\n            sources: read_sources(root, \u0026module.paths),\n        })\n        .collect::\u003cVec\u003c_\u003e\u003e();\n\n    let meta = Meta {\n        schema_version: spec.schema_version,\n        cards: cards.len(),\n        modules: modules.len(),\n        docs: docs.len(),\n        generator: \"cargo xtask dashboard\".into(),\n    };\n\n    Ok(Dashboard {\n        project: spec.project,\n        milestones: spec.milestones,\n        layers: spec.layers,\n        modules,\n        relations: spec.relations,\n        cards,\n        docs,\n        events: spec.events,\n        meta,\n    })\n}\n\nfn read_spec(root: \u0026Path) -\u003e Result\u003cProjectSpec\u003e {\n    let path = root.join(\"docs/dashboard/project.json\");\n    let raw = fs::read_to_string(\u0026path).with_context(|| format!(\"read {}\", path.display()))?;\n    serde_json::from_str(\u0026raw).with_context(|| format!(\"parse {}\", path.display()))\n}\n\nfn load_cards(root: \u0026Path) -\u003e Result\u003cVec\u003cCardOut\u003e\u003e {\n    let board_dir = root.join(\"docs/board\");\n    if !board_dir.is_dir() {\n        bail!(\"missing {}\", board_dir.display());\n    }\n\n    let mut paths = Vec::new();\n    for entry in\n        fs::read_dir(\u0026board_dir).with_context(|| format!(\"read {}\", board_dir.display()))?\n    {\n        let path = entry?.path();\n        if path.extension().and_then(|ext| ext.to_str()) == Some(\"md\") {\n            paths.push(path);\n        }\n    }\n    paths.sort();\n\n    let mut cards = Vec::new();\n    for path in paths {\n        let raw = fs::read_to_string(\u0026path).with_context(|| format!(\"read {}\", path.display()))?;\n        let (front, body) = split_frontmatter(\u0026raw)\n            .with_context(|| format!(\"parse frontmatter in {}\", path.display()))?;\n        let front = front.with_context(|| {\n            format!(\n                \"{}: cards require TOML frontmatter between +++ lines\",\n                path.display()\n            )\n        })?;\n        let front: CardFront = toml::from_str(\u0026front)\n            .with_context(|| format!(\"invalid card frontmatter in {}\", path.display()))?;\n\n        cards.push(CardOut {\n            front,\n            body_html: render::markdown(\u0026body),\n            path: relative(root, \u0026path),\n        });\n    }\n\n    cards.sort_by(|a, b| a.front.id.cmp(\u0026b.front.id));\n    Ok(cards)\n}\n\nfn load_docs(root: \u0026Path) -\u003e Result\u003cVec\u003cDocOut\u003e\u003e {\n    let docs_dir = root.join(\"docs\");\n    let board_dir = docs_dir.join(\"board\");\n    let dashboard_dir = docs_dir.join(\"dashboard\");\n\n    let walker = WalkDir::new(\u0026docs_dir).into_iter().filter_entry(|entry| {\n        let path = entry.path();\n        !(path.starts_with(\u0026board_dir) || path.starts_with(\u0026dashboard_dir))\n    });\n\n    let mut docs = Vec::new();\n    for entry in walker {\n        let entry = entry.with_context(|| format!(\"walk {}\", docs_dir.display()))?;\n        if !entry.file_type().is_file() {\n            continue;\n        }\n        let path = entry.path();\n        if path.extension().and_then(|ext| ext.to_str()) != Some(\"md\") {\n            continue;\n        }\n\n        let raw = fs::read_to_string(path).with_context(|| format!(\"read {}\", path.display()))?;\n        let (front, body) = split_frontmatter(\u0026raw)\n            .with_context(|| format!(\"parse frontmatter in {}\", path.display()))?;\n        let front = front.with_context(|| {\n            format!(\n                \"{}: docs require TOML frontmatter between +++ lines\",\n                path.display()\n            )\n        })?;\n        let front: DocFront = toml::from_str(\u0026front)\n            .with_context(|| format!(\"invalid doc frontmatter in {}\", path.display()))?;\n\n        let excerpt = front\n            .summary\n            .clone()\n            .filter(|summary| !summary.trim().is_empty())\n            .unwrap_or_else(|| render::excerpt(\u0026body, 180));\n\n        docs.push(DocOut {\n            front,\n            body_html: render::markdown(\u0026body),\n            path: relative(root, path),\n            excerpt,\n        });\n    }\n\n    docs.sort_by(|a, b| {\n        a.front\n            .order\n            .cmp(\u0026b.front.order)\n            .then_with(|| a.front.id.cmp(\u0026b.front.id))\n    });\n    Ok(docs)\n}\n\nfn read_sources(root: \u0026Path, paths: \u0026[String]) -\u003e Vec\u003cSourceFile\u003e {\n    let mut sources = Vec::new();\n\n    for relative_path in paths {\n        let path = root.join(relative_path);\n        if !path.is_file() {\n            continue;\n        }\n        let Ok(raw) = fs::read_to_string(\u0026path) else {\n            continue;\n        };\n        let (text, truncated) = clip(\u0026raw, 200, 30_000);\n\n        sources.push(SourceFile {\n            path: relative_path.clone(),\n            language: language(relative_path).into(),\n            text,\n            truncated,\n        });\n    }\n\n    sources\n}\n\nfn split_frontmatter(raw: \u0026str) -\u003e Result\u003c(Option\u003cString\u003e, String)\u003e {\n    let raw = raw.strip_prefix('\\u{feff}').unwrap_or(raw);\n    let mut lines = raw.lines();\n\n    if lines.next() != Some(\"+++\") {\n        return Ok((None, raw.to_string()));\n    }\n\n    let mut front = Vec::new();\n    let mut body = Vec::new();\n    let mut in_front = true;\n\n    for line in lines {\n        if in_front {\n            if line == \"+++\" {\n                in_front = false;\n            } else {\n                front.push(line);\n            }\n        } else {\n            body.push(line);\n        }\n    }\n","truncated":true},{"path":"crates/xtask/src/model.rs","language":"rust","text":"use serde::{Deserialize, Serialize};\n\n#[derive(Debug, Clone, Deserialize)]\npub struct ProjectSpec {\n    pub schema_version: u32,\n    pub project: ProjectInfo,\n    pub milestones: Vec\u003cMilestone\u003e,\n    pub layers: Vec\u003cLayer\u003e,\n    pub modules: Vec\u003cModule\u003e,\n    #[serde(default)]\n    pub relations: Vec\u003cRelation\u003e,\n    #[serde(default)]\n    pub events: Vec\u003cTimelineEvent\u003e,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct ProjectInfo {\n    pub name: String,\n    pub title: String,\n    pub tagline: String,\n    pub summary: String,\n    pub status: String,\n    pub repo: String,\n    pub language: String,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct Milestone {\n    pub id: String,\n    pub title: String,\n    pub status: MilestoneStatus,\n    pub goal: String,\n    #[serde(default)]\n    pub exit: Vec\u003cString\u003e,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Deserialize, Serialize)]\n#[serde(rename_all = \"snake_case\")]\npub enum MilestoneStatus {\n    Planned,\n    Active,\n    Done,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct Layer {\n    pub id: String,\n    pub name: String,\n    pub note: String,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct Module {\n    pub id: String,\n    pub title: String,\n    pub layer: String,\n    pub status: ModuleStatus,\n    pub summary: String,\n    #[serde(default)]\n    pub contract: String,\n    #[serde(default)]\n    pub paths: Vec\u003cString\u003e,\n    #[serde(default)]\n    pub notes: Vec\u003cString\u003e,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Deserialize, Serialize)]\n#[serde(rename_all = \"snake_case\")]\npub enum ModuleStatus {\n    Planned,\n    Active,\n    Done,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct Relation {\n    pub from: String,\n    pub to: String,\n    #[serde(default)]\n    pub label: String,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct TimelineEvent {\n    pub date: String,\n    pub kind: String,\n    pub title: String,\n    #[serde(default)]\n    pub detail: String,\n    #[serde(default)]\n    pub refs: Vec\u003cString\u003e,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct CardFront {\n    pub id: String,\n    pub title: String,\n    pub status: CardStatus,\n    pub milestone: String,\n    #[serde(default)]\n    pub module: Option\u003cString\u003e,\n    pub size: Size,\n    #[serde(default)]\n    pub priority: Option\u003cString\u003e,\n    pub updated: String,\n    #[serde(default)]\n    pub completed: Option\u003cString\u003e,\n    #[serde(default)]\n    pub depends_on: Vec\u003cString\u003e,\n    #[serde(default)]\n    pub docs: Vec\u003cString\u003e,\n    #[serde(default)]\n    pub blocked_reason: Option\u003cString\u003e,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Deserialize, Serialize)]\n#[serde(rename_all = \"snake_case\")]\npub enum CardStatus {\n    Backlog,\n    Ready,\n    Doing,\n    Review,\n    Done,\n    Blocked,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Deserialize, Serialize)]\n#[serde(rename_all = \"UPPERCASE\")]\npub enum Size {\n    S,\n    M,\n    L,\n}\n\n#[derive(Debug, Clone, Deserialize, Serialize)]\npub struct DocFront {\n    pub id: String,\n    pub title: String,\n    pub kind: String,\n    #[serde(default)]\n    pub status: Option\u003cString\u003e,\n    #[serde(default = \"default_order\")]\n    pub order: i64,\n    #[serde(default)]\n    pub summary: Option\u003cString\u003e,\n}\n\nfn default_order() -\u003e i64 {\n    999\n}\n\n#[derive(Debug, Clone, Serialize)]\npub struct CardOut {\n    #[serde(flatten)]\n    pub front: CardFront,\n    pub body_html: String,\n    pub path: String,\n}\n\n#[derive(Debug, Clone, Serialize)]\npub struct DocOut {\n    #[serde(flatten)]\n    pub front: DocFront,\n    pub body_html: String,\n    pub path: String,\n    pub excerpt: String,\n}\n\n#[derive(Debug, Clone, Serialize)]\npub struct SourceFile {\n    pub path: String,\n    pub language: String,\n    pub text: String,\n    pub truncated: bool,\n}\n\n#[derive(Debug, Clone, Serialize)]\npub struct ModuleOut {\n    #[serde(flatten)]\n    pub module: Module,\n    pub sources: Vec\u003cSourceFile\u003e,\n}\n\n#[derive(Debug, Serialize)]\npub struct Dashboard {\n    pub project: ProjectInfo,\n    pub milestones: Vec\u003cMilestone\u003e,\n    pub layers: Vec\u003cLayer\u003e,\n    pub modules: Vec\u003cModuleOut\u003e,\n    pub relations: Vec\u003cRelation\u003e,\n    pub cards: Vec\u003cCardOut\u003e,\n    pub docs: Vec\u003cDocOut\u003e,\n    pub events: Vec\u003cTimelineEvent\u003e,\n    pub meta: Meta,\n}\n\n#[derive(Debug, Serialize)]\npub struct Meta {\n    pub schema_version: u32,\n    pub cards: usize,\n","truncated":true},{"path":"crates/xtask/src/render.rs","language":"rust","text":"use std::fs;\nuse std::path::Path;\nuse std::process::Command;\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse anyhow::{bail, Context, Result};\nuse base64::Engine as _;\nuse pulldown_cmark::{html, Options, Parser};\nuse serde::Serialize;\n\nuse crate::model::Dashboard;\n\npub fn markdown(input: \u0026str) -\u003e String {\n    let mut options = Options::empty();\n    options.insert(Options::ENABLE_TABLES);\n    options.insert(Options::ENABLE_STRIKETHROUGH);\n    options.insert(Options::ENABLE_TASKLISTS);\n    options.insert(Options::ENABLE_FOOTNOTES);\n\n    let parser = Parser::new_ext(input, options);\n    let mut output = String::new();\n    html::push_html(\u0026mut output, parser);\n    wrap_tables(output)\n}\n\n/// Keep wide tables readable in the narrow details pane: scroll the table\n/// instead of wrapping every cell character by character.\nfn wrap_tables(html: String) -\u003e String {\n    html.replace(\"\u003ctable\u003e\", \"\u003cdiv class=\\\"table-wrap\\\"\u003e\u003ctable\u003e\")\n        .replace(\"\u003c/table\u003e\", \"\u003c/table\u003e\u003c/div\u003e\")\n}\n\npub fn excerpt(markdown: \u0026str, limit: usize) -\u003e String {\n    let mut text = String::new();\n\n    for line in markdown.lines() {\n        let line = line.trim();\n        if line.is_empty()\n            || line.starts_with('#')\n            || line.starts_with(\"```\")\n            || line.starts_with('|')\n            || line.starts_with(\"---\")\n        {\n            continue;\n        }\n\n        let cleaned =\n            line.trim_start_matches(|c: char| matches!(c, '-' | '*' | '\u003e' | ' ' | '1'..='9' | '.'));\n        text.push_str(cleaned.trim());\n        text.push(' ');\n\n        if text.chars().count() \u003e= limit {\n            break;\n        }\n    }\n\n    let mut out = text.split_whitespace().collect::\u003cVec\u003c_\u003e\u003e().join(\" \");\n    if out.chars().count() \u003e limit {\n        out = out.chars().take(limit).collect();\n        out.push('…');\n    }\n    out\n}\n\npub fn write_dashboard(root: \u0026Path, dashboard: \u0026Dashboard, check: bool) -\u003e Result\u003c()\u003e {\n    let template_path = root.join(\"docs/dashboard/template.html\");\n    let style_path = root.join(\"docs/dashboard/style.css\");\n    let app_path = root.join(\"docs/dashboard/app.js\");\n\n    let template = fs::read_to_string(\u0026template_path)\n        .with_context(|| format!(\"read {}\", template_path.display()))?;\n    let style = fs::read_to_string(\u0026style_path)\n        .with_context(|| format!(\"read {}\", style_path.display()))?;\n    let app =\n        fs::read_to_string(\u0026app_path).with_context(|| format!(\"read {}\", app_path.display()))?;\n    let logo_path = root.join(\"docs/dashboard/logo.png\");\n    let favicon_path = root.join(\"docs/dashboard/favicon.png\");\n    let logo = fs::read(\u0026logo_path).with_context(|| format!(\"read {}\", logo_path.display()))?;\n    let favicon =\n        fs::read(\u0026favicon_path).with_context(|| format!(\"read {}\", favicon_path.display()))?;\n    let logo_uri = format!(\n        \"data:image/png;base64,{}\",\n        base64::engine::general_purpose::STANDARD.encode(logo)\n    );\n    let favicon_uri = format!(\n        \"data:image/png;base64,{}\",\n        base64::engine::general_purpose::STANDARD.encode(favicon)\n    );\n\n    let data = serde_json::to_string(dashboard).context(\"serialize dashboard data\")?;\n    let data = escape_for_script(\u0026data);\n\n    // Replace everything except DATA before DATA: the embedded source of\n    // template.html contains the placeholders themselves, and replacing into\n    // already-inserted JSON would corrupt it.\n    let html = template\n        .replace(\"{{STYLE}}\", \u0026style)\n        .replace(\"{{APP}}\", \u0026app)\n        .replace(\"{{LOGO}}\", \u0026logo_uri)\n        .replace(\"{{FAVICON}}\", \u0026favicon_uri)\n        .replace(\"{{DATA}}\", \u0026data);\n\n    let index_path = root.join(\"docs/index.html\");\n    let model_path = root.join(\"docs/dashboard/model.json\");\n    let model = serde_json::to_string_pretty(dashboard).context(\"serialize dashboard model\")?;\n    let model = format!(\"{model}\\n\");\n\n    if check {\n        let current_html = fs::read_to_string(\u0026index_path).unwrap_or_default();\n        let current_model = fs::read_to_string(\u0026model_path).unwrap_or_default();\n        if current_html != html || current_model != model {\n            bail!(\"dashboard is stale; run `cargo xtask dashboard`\");\n        }\n        println!(\"dashboard is up to date\");\n        return Ok(());\n    }\n\n    fs::write(\u0026index_path, \u0026html).with_context(|| format!(\"write {}\", index_path.display()))?;\n    fs::write(\u0026model_path, \u0026model).with_context(|| format!(\"write {}\", model_path.display()))?;\n\n    let receipt = Receipt {\n        schema_version: dashboard.meta.schema_version,\n        generated_at_unix: SystemTime::now()\n            .duration_since(UNIX_EPOCH)\n            .unwrap_or_default()\n            .as_secs(),\n        git_revision: git_output(root, \u0026[\"rev-parse\", \"--short\", \"HEAD\"]),\n        git_dirty: !git_output(root, \u0026[\"status\", \"--porcelain\"]).is_empty(),\n        cards: dashboard.cards.len(),\n        modules: dashboard.modules.len(),\n        docs: dashboard.docs.len(),\n        events: dashboard.events.len(),\n        index_bytes: html.len(),\n        model_bytes: model.len(),\n        inputs: vec![\n            \"docs/dashboard/project.json\".into(),\n            \"docs/board/*.md\".into(),\n            \"docs/**/*.md\".into(),\n            \"docs/dashboard/template.html\".into(),\n            \"docs/dashboard/style.css\".into(),\n            \"docs/dashboard/app.js\".into(),\n            \"docs/dashboard/logo.png\".into(),\n            \"docs/dashboard/favicon.png\".into(),\n        ],\n    };\n    let receipt_path = root.join(\"docs/dashboard/receipt.json\");\n    let receipt_json = serde_json::to_string_pretty(\u0026receipt)?;\n    fs::write(\u0026receipt_path, format!(\"{receipt_json}\\n\"))\n        .with_context(|| format!(\"write {}\", receipt_path.display()))?;\n\n    println!(\n        \"dashboard: {} cards, {} modules, {} docs → docs/index.html ({:.1} KiB)\",\n        dashboard.cards.len(),\n        dashboard.modules.len(),\n        dashboard.docs.len(),\n        html.len() as f64 / 1024.0\n    );\n    Ok(())\n}\n\n#[derive(Debug, Serialize)]\nstruct Receipt {\n    schema_version: u32,\n    generated_at_unix: u64,\n    git_revision: String,\n    git_dirty: bool,\n    cards: usize,\n    modules: usize,\n    docs: usize,\n    events: usize,\n    index_bytes: usize,\n    model_bytes: usize,\n    inputs: Vec\u003cString\u003e,\n}\n\nfn git_output(root: \u0026Path, args: \u0026[\u0026str]) -\u003e String {\n    Command::new(\"git\")\n        .current_dir(root)\n        .args(args)\n        .output()\n        .ok()\n        .filter(|output| output.status.success())\n        .map(|output| String::from_utf8_lossy(\u0026output.stdout).trim().to_string())\n        .unwrap_or_default()\n}\n\nfn escape_for_script(json: \u0026str) -\u003e String {\n    json.replace('\u0026', \"\\\\u0026\")\n        .replace('\u003c', \"\\\\u003c\")\n        .replace('\u003e', \"\\\\u003e\")\n        .replace('\\u{2028}', \"\\\\u2028\")\n        .replace('\\u{2029}', \"\\\\u2029\")\n}\n","truncated":false},{"path":"crates/xtask/src/validate.rs","language":"rust","text":"use std::collections::HashSet;\nuse std::path::Path;\n\nuse anyhow::{bail, Result};\n\nuse crate::model::{CardOut, CardStatus, DocOut, MilestoneStatus, ModuleStatus, ProjectSpec};\n\npub fn validate(root: \u0026Path, spec: \u0026ProjectSpec, cards: \u0026[CardOut], docs: \u0026[DocOut]) -\u003e Result\u003c()\u003e {\n    let mut errors = Vec::new();\n\n    if spec.schema_version != 1 {\n        errors.push(format!(\n            \"unsupported schema_version {} (expected 1)\",\n            spec.schema_version\n        ));\n    }\n    if spec.project.name.trim().is_empty() {\n        errors.push(\"project.name is empty\".into());\n    }\n    if spec.project.title.trim().is_empty() {\n        errors.push(\"project.title is empty\".into());\n    }\n    if spec.project.summary.trim().is_empty() {\n        errors.push(\"project.summary is empty\".into());\n    }\n    if spec.project.status.trim().is_empty() {\n        errors.push(\"project.status is empty\".into());\n    }\n\n    let mut milestone_ids = HashSet::new();\n    for milestone in \u0026spec.milestones {\n        if !milestone_ids.insert(milestone.id.as_str()) {\n            errors.push(format!(\"duplicate milestone id {}\", milestone.id));\n        }\n        if milestone.title.trim().is_empty() {\n            errors.push(format!(\"milestone {} has an empty title\", milestone.id));\n        }\n    }\n    if spec.milestones.is_empty() {\n        errors.push(\"at least one milestone is required\".into());\n    }\n    let active_milestones = spec\n        .milestones\n        .iter()\n        .filter(|milestone| milestone.status == MilestoneStatus::Active)\n        .count();\n    if active_milestones \u003e 1 {\n        errors.push(format!(\n            \"{} milestones are active; only one may be active\",\n            active_milestones\n        ));\n    }\n\n    let mut layer_ids = HashSet::new();\n    for layer in \u0026spec.layers {\n        if !layer_ids.insert(layer.id.as_str()) {\n            errors.push(format!(\"duplicate layer id {}\", layer.id));\n        }\n        if layer.name.trim().is_empty() {\n            errors.push(format!(\"layer {} has an empty name\", layer.id));\n        }\n    }\n    if spec.layers.is_empty() {\n        errors.push(\"at least one layer is required\".into());\n    }\n\n    let mut module_ids = HashSet::new();\n    for module in \u0026spec.modules {\n        if !module_ids.insert(module.id.as_str()) {\n            errors.push(format!(\"duplicate module id {}\", module.id));\n        }\n        if !layer_ids.contains(module.layer.as_str()) {\n            errors.push(format!(\n                \"module {} references unknown layer {}\",\n                module.id, module.layer\n            ));\n        }\n        if module.status != ModuleStatus::Planned {\n            if module.paths.is_empty() {\n                errors.push(format!(\n                    \"module {} is {} but owns no paths\",\n                    module.id,\n                    status_name(module.status)\n                ));\n            } else if !module.paths.iter().any(|path| root.join(path).exists()) {\n                errors.push(format!(\n                    \"module {} is {} but none of its paths exist\",\n                    module.id,\n                    status_name(module.status)\n                ));\n            }\n        }\n    }\n    if spec.modules.is_empty() {\n        errors.push(\"at least one module is required\".into());\n    }\n\n    for relation in \u0026spec.relations {\n        if !module_ids.contains(relation.from.as_str()) {\n            errors.push(format!(\n                \"relation references unknown module {} → {}\",\n                relation.from, relation.to\n            ));\n        }\n        if !module_ids.contains(relation.to.as_str()) {\n            errors.push(format!(\n                \"relation references unknown module {} → {}\",\n                relation.from, relation.to\n            ));\n        }\n    }\n\n    let doc_ids = docs\n        .iter()\n        .map(|doc| doc.front.id.as_str())\n        .collect::\u003cHashSet\u003c_\u003e\u003e();\n    let mut seen_docs = HashSet::new();\n    for doc in docs {\n        if !seen_docs.insert(doc.front.id.as_str()) {\n            errors.push(format!(\"duplicate doc id {}\", doc.front.id));\n        }\n        if doc.front.kind.trim().is_empty() {\n            errors.push(format!(\"doc {} has an empty kind\", doc.front.id));\n        }\n        if doc.front.kind == \"adr\" {\n            let status = doc.front.status.as_deref().unwrap_or(\"\");\n            if !matches!(\n                status,\n                \"proposed\" | \"accepted\" | \"superseded\" | \"rejected\" | \"draft\"\n            ) {\n                errors.push(format!(\n                    \"doc {} is an ADR with invalid status {:?}\",\n                    doc.front.id, status\n                ));\n            }\n        }\n    }\n\n    let mut card_ids = HashSet::new();\n    for card in cards {\n        let front = \u0026card.front;\n        if !card_ids.insert(front.id.as_str()) {\n            errors.push(format!(\"duplicate card id {}\", front.id));\n        }\n        if !milestone_ids.contains(front.milestone.as_str()) {\n            errors.push(format!(\n                \"card {} references unknown milestone {}\",\n                front.id, front.milestone\n            ));\n        }\n        if let Some(module) = \u0026front.module {\n            if !module_ids.contains(module.as_str()) {\n                errors.push(format!(\n                    \"card {} references unknown module {}\",\n                    front.id, module\n                ));\n            }\n        }\n        for dependency in \u0026front.depends_on {\n            if dependency == \u0026front.id {\n                errors.push(format!(\"card {} depends on itself\", front.id));\n            } else if !cards.iter().any(|other| \u0026other.front.id == dependency) {\n                errors.push(format!(\n                    \"card {} references unknown dependency {}\",\n                    front.id, dependency\n                ));\n            }\n        }\n        for doc in \u0026front.docs {\n            if !doc_ids.contains(doc.as_str()) {\n                errors.push(format!(\"card {} references unknown doc {}\", front.id, doc));\n            }\n        }\n        if !valid_date(\u0026front.updated) {\n            errors.push(format!(\n                \"card {} has invalid updated date {:?}\",\n                front.id, front.updated\n            ));\n        }\n        if let Some(completed) = \u0026front.completed {\n            if !valid_date(completed) {\n                errors.push(format!(\n                    \"card {} has invalid completed date {:?}\",\n                    front.id, completed\n                ));\n            }\n        }\n        if front.status == CardStatus::Done \u0026\u0026 front.completed.is_none() {\n            errors.push(format!(\n                \"card {} is done but has no completed date\",\n                front.id\n            ));\n        }\n        if front.status == CardStatus::Blocked\n            \u0026\u0026 front\n                .blocked_reason\n                .as_deref()\n                .unwrap_or(\"\")\n                .trim()\n                .is_empty()\n","truncated":true},{"path":"docs/dashboard/project.json","language":"json","text":"{\n  \"schema_version\": 1,\n  \"project\": {\n    \"name\": \"niuse\",\n    \"title\": \"niuse\",\n    \"tagline\": \"personal engineering companion on niucode\",\n    \"summary\": \"A personal engineering companion on top of niucode: five Markdown stores for identity and memory, an in-band protocol, soft expiry, and a resumable thread. The board records architecture, decisions, and iteration; it is not runtime monitoring.\",\n    \"status\": \"M2 · Dogfood pending\",\n    \"repo\": \"niuverse/niuse\",\n    \"language\": \"Rust\"\n  },\n  \"milestones\": [\n    {\n      \"id\": \"M0\",\n      \"title\": \"Bootstrap\",\n      \"status\": \"done\",\n      \"goal\": \"Ship the smallest runnable loop for identity and memory.\",\n      \"exit\": [\n        \"five stores with atomic 0600 writes\",\n        \"in-band protocol works end to end\",\n        \"the REPL completes one real turn\"\n      ]\n    },\n    {\n      \"id\": \"M1\",\n      \"title\": \"Memory loop\",\n      \"status\": \"done\",\n      \"goal\": \"Make memory trustworthy: confirmation, conflicts, expiry, privacy, and cold start.\",\n      \"exit\": [\n        \"bootstrap → review → memory works end to end\",\n        \"a secret match is refused\",\n        \"per-turn cwd on one session\"\n      ]\n    },\n    {\n      \"id\": \"M2\",\n      \"title\": \"Dogfood\",\n      \"status\": \"active\",\n      \"goal\": \"Prove with real work that it remembers, is reliable, and dares to disagree, instead of adding features.\",\n      \"exit\": [\n        \"ten consecutive working days, at least one real task per day through niuse\",\n        \"candidate acceptance rate ≥ 60%\",\n        \"at least once it disagrees and you change your mind\"\n      ]\n    },\n    {\n      \"id\": \"M3\",\n      \"title\": \"Distribution\",\n      \"status\": \"planned\",\n      \"goal\": \"Make the project installable, publishable, and maintainable.\",\n      \"exit\": [\n        \"the niucode dependency is versioned, or git install is the stated path\",\n        \"cargo package and installation are reproducible\",\n        \"name, license, and release channels are settled\"\n      ]\n    },\n    {\n      \"id\": \"M4\",\n      \"title\": \"Shared front end\",\n      \"status\": \"planned\",\n      \"goal\": \"Stop maintaining a second front end: reuse niucode's TUI and loop behind a library and a small hook surface.\",\n      \"exit\": [\n        \"niucode-cli exports a library plus turn hooks\",\n        \"niuse deletes its renderer and runs the shared TUI\",\n        \"the product-only layer stays below roughly 1k lines\"\n      ]\n    }\n  ],\n  \"layers\": [\n    {\n      \"id\": \"interface\",\n      \"name\": \"Interface\",\n      \"note\": \"REPL, commands, rendering\"\n    },\n    {\n      \"id\": \"engine\",\n      \"name\": \"Engine\",\n      \"note\": \"prompt, protocol, policy\"\n    },\n    {\n      \"id\": \"adapters\",\n      \"name\": \"Adapters\",\n      \"note\": \"niucode boundary and cold start\"\n    },\n    {\n      \"id\": \"state\",\n      \"name\": \"State\",\n      \"note\": \"five stores
