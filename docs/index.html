  --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
    "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Hiragino Sans GB",
    "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular,
    "Cascadia Code", Menlo, Monaco, Consolas, "Liberation Mono",
    "Noto Sans Mono CJK SC", monospace;
}

[data-theme="dark"] {
  --bg: #090b0e;
  --bg-subtle: #0c0f14;
  --surface: #10141b;
  --surface-2: #161b24;
  --surface-3: #1d2430;
  --ink: #eef2f6;
  --ink-secondary: #ced6e0;
  --muted: #97a3b1;
  --faint: #677483;
  --line: rgba(226, 236, 248, 0.08);
  --line-strong: rgba(226, 236, 248, 0.16);
  --accent: #38d399;
  --accent-2: #58a6ff;
  --accent-soft: rgba(56, 211, 153, 0.11);
  --accent-border: rgba(56, 211, 153, 0.42);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.32), 0 4px 12px rgba(0, 0, 0, 0.22);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.42), 0 2px 6px rgba(0, 0, 0, 0.28);

  --code-bg: #080a0d;
  --code-head: #0d1016;
  --code-ink: #dfe6ee;
  --code-line: #1b222c;
  --code-muted: #586575;

  --st-backlog: #7e8b98;
  --st-ready: #58a6ff;
  --st-doing: #e39c3b;
  --st-review: #a88bfa;
  --st-done: #3fb980;
  --st-blocked: #f4665c;

  --layer-interface: #5899f8;
  --layer-engine: #e08b44;
  --layer-adapters: #9d7ef2;
  --layer-state: #46bd84;
  --layer-engineering: #8291a0;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
}

body {
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.55;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

input {
  font: inherit;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

*::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 99px;
}

/* ---------- topbar ---------- */

.topbar {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  position: relative;
  z-index: 30;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand-badge {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: #080a0e;
}

.brand-badge img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  line-height: 1.05;
}

.brand-name {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.025em;
  color: var(--ink);
}

.brand-sub {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
}

.brand-divider {
  width: 1px;
  height: 18px;
  background: var(--line);
  margin: 0 2px;
}

.brand-tag {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  flex: none;
}

.tab {
  position: relative;
  padding: 4px 12px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
  transition: color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
}

.tab:hover {
  color: var(--ink);
}

.tab.active {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 210px;
  height: 30px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
  transition: border-color 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
}

.search:focus-within {
  background: var(--surface);
  border-color: var(--accent-border);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search-key {
  width: 17px;
  height: 17px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  background: var(--surface);
  flex: none;
}

.search input {
  width: 100%;
  border: 0;
  outline: 0;
  background: none;
  color: var(--ink);
  font-size: 12px;
}

.search input::placeholder {
  color: var(--faint);
}

.search input::-webkit-search-cancel-button {
  display: none;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: var(--ink-secondary);
  white-space: nowrap;
}

.status-chip::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

.icon-button {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface-2);
  transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
}

.icon-button:hover {
  background: var(--surface-3);
  border-color: var(--line-strong);
  color: var(--ink);
}

.theme-icon {
  font-size: 13px;
  line-height: 1;
}

[data-theme="dark"] .theme-sun,
[data-theme="light"] .theme-moon {
  display: none;
}

/* ---------- shell ---------- */

.shell {
  height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr) 396px;
}

/* ---------- left rail ---------- */

.rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 12px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

.rail-section {
  min-width: 0;
}

.rail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px 6px;
}

.rail-head h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

.rail-head span {
  font-family: var(--mono);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

.map-nav {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.map-layer {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.map-layer-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 3px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.map-layer-dot {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--c, var(--faint));
  flex: none;
}

.map-layer-n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

.map-module {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 4.5px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  text-align: left;
  transition: background 0.12s ease, color 0.12s ease;
}

.map-module:hover {
  background: var(--surface-2);
}

.map-module.active {
  background: var(--surface-2);
  border-color: var(--line);
  box-shadow: inset 2px 0 0 var(--accent);
}

.map-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--faint);
  flex: none;
}

.map-dot.active,
.map-dot.done {
  background: var(--st-done);
}

.map-dot.planned {
  background: transparent;
  border: 1px solid var(--faint);
}

.map-title {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--muted);
}

.map-module:hover .map-title,
.map-module.active .map-title {
  color: var(--ink);
  font-weight: 500;
}

.rail-doc-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.rail-doc {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-width: 0;
  text-align: left;
  padding: 4.5px 6px;
  border-radius: 6px;
  transition: background 0.12s ease;
}

.rail-doc:hover {
  background: var(--surface-2);
}

.rail-doc.active {
  background: var(--surface-2);
  box-shadow: inset 2px 0 0 var(--accent);
}

.rd-kind {
  flex: none;
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0.5px 4.5px;
}

.rd-kind-adr {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
}

.rd-title {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rail-doc:hover .rd-title,
.rail-doc.active .rd-title {
  color: var(--ink);
  font-weight: 500;
}

.rail-foot {
  margin-top: auto;
  padding: 12px 4px 2px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.focus-block {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.focus-kicker {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
}

.focus-card {
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: 6px;
  background: var(--surface-2);
  text-align: left;
  transition: border-color 0.14s ease, background 0.14s ease;
}

.focus-card:hover {
  border-color: var(--line-strong);
  border-left-color: var(--accent);
  background: var(--surface-3);
}

.focus-id {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
}

.focus-title {
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--ink);
}

.focus-empty {
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--muted);
}

.rail-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 2px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

/* ---------- center canvas ---------- */

.canvas {
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 24px 32px;
  background: var(--bg);
  min-width: 0;
}

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 11px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.view-head-main {
  min-width: 0;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
}

.view-title {
  margin: 3px 0 4px;
  font-family: var(--sans);
  font-size: 21px;
  font-weight: 650;
  line-height: 1.25;
  letter-spacing: -0.025em;
  color: var(--ink);
}

.view-sub {
  max-width: 68ch;
  margin: 0;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--muted);
}

.stats {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
  flex: none;
}

.stats span {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 3.5px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  white-space: nowrap;
}

.stats strong {
  color: var(--ink);
  font-weight: 600;
}

.stats .sep {
  display: none;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 24px 0 12px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.section-title:first-of-type {
  margin-top: 0;
}

.section-title::before {
  content: "";
  width: 8px;
  height: 2px;
  border-radius: 1px;
  background: var(--accent);
}

/* ---------- architecture view ---------- */

.focus-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0 12px;
}

.focus-label {
  color: var(--faint);
  font-family: var(--mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.focus-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 500;
}

.focus-chip:hover {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
}

.arch-canvas {
  position: relative;
  min-width: 0;
  padding: 2px 0 12px;
}

.edges {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
  z-index: 0;
}

.edges-fg {
  z-index: 2;
}

.edge {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.25;
  opacity: 0.55;
  transition: opacity 0.15s ease, stroke 0.15s ease;
}

.edge-active {
  stroke: var(--accent);
  stroke-width: 1.75;
  opacity: 1;
}

.edge-badge-bg {
  fill: var(--surface-2);
  stroke: var(--accent-border);
  stroke-width: 1;
}

.edge-label {
  fill: var(--accent);
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 600;
}

.arrow-head {
  fill: var(--line-strong);
}

.arrow-head-active {
  fill: var(--accent);
}

.arch-canvas.has-focus .edge:not(.edge-active) {
  opacity: 0.12;
}

.arch-layer {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr);
  gap: 16px;
  padding: 8px 0 10px;
  border-bottom: 1px dashed var(--line);
}

.arch-layer:first-of-type {
  padding-top: 2px;
}

.arch-layer:last-of-type {
  border-bottom: 0;
  padding-bottom: 2px;
}

.layer-label {
  padding-top: 4px;
}

.layer-head-row {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 4px;
}

.layer-index {
  display: inline-grid;
  place-items: center;
  padding: 1px 5px;
  border-radius: 4px;
  background: color-mix(in srgb, var(--layer-color, var(--faint)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--layer-color, var(--faint)) 34%, transparent);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--layer-color, var(--muted));
}

.layer-label h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.layer-label p {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--faint);
}

.layer-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(186px, 1fr));
  gap: 8px;
  align-items: stretch;
}

.module-card {
  position: relative;
  width: 100%;
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 2px solid var(--module-color, var(--faint));
  border-radius: 8px;
  padding: 8px 11px 7px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
}

.module-card:hover {
  border-color: var(--line-strong);
  border-top-color: var(--module-color, var(--faint));
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.module-card.selected {
  border-color: var(--accent);
  border-top-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md);
}

.module-card.related {
  border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
  border-top-color: var(--module-color, var(--faint));
}

.module-card.planned {
  background: color-mix(in srgb, var(--surface) 65%, transparent);
  border-style: dashed;
  border-top-style: solid;
}

.module-card.dim {
  opacity: 0.2;
  pointer-events: none;
}

.module-card.muted {
  opacity: 0.32;
}

.module-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--faint);
}

.module-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
}

.module-status::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--module-color, var(--faint));
}

.module-title {
  display: block;
  margin: 3px 0 2px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.module-summary {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin: 0 0 6px;
  font-size: 11.5px;
  line-height: 1.44;
  color: var(--muted);
}

.module-path {
  display: block;
  margin-top: auto;
  padding-top: 5px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- work view ---------- */

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: -2px 0 14px;
}

.filter {
  padding: 4.5px 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  transition: border-color 0.14s ease, color 0.14s ease, background 0.14s ease;
}

.filter:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.filter.active {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent);
  font-weight: 600;
}

.blocked-strip {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px solid color-mix(in srgb, var(--st-blocked) 38%, var(--line));
  background: color-mix(in srgb, var(--st-blocked) 6%, transparent);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 14px;
}

.blocked-label {
  padding-top: 6px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--st-blocked);
  white-space: nowrap;
}

.blocked-cards {
  display: flex;
  flex: 1;
  flex-wrap: wrap;
  gap: 8px;
}

.blocked-cards .card {
  width: 220px;
}

.board {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  width: 100%;
  min-width: 0;
}

.column {
  flex: 1.35 1 0;
  min-width: 124px;
  background: color-mix(in srgb, var(--surface-2) 65%, transparent);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px;
  min-height: 140px;
}

.column.empty {
  flex: 0.72 1 0;
  min-width: 86px;
}

.column-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 4px 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.col-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c, var(--st-backlog));
  flex: none;
}

.cards {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-height: 44px;
}

.column.empty .cards::after {
  content: "No cards";
  display: block;
  padding: 10px 4px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
}

.card {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 9px 10px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease;
}

.card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.card.done {
  opacity: 0.76;
}

.card.done .card-title {
  color: var(--ink-secondary);
}

.card.blocked {
  border-left: 2px solid var(--st-blocked);
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
}

.card-badges {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.prio,
.size {
  font-family: var(--mono);
  font-size: 9.5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 4px;
  color: var(--muted);
  background: var(--surface-2);
}

.prio-p0 {
  color: var(--st-blocked);
  border-color: color-mix(in srgb, var(--st-blocked) 35%, var(--line));
}

.card-title {
  display: block;
  margin: 6px 0 8px;
  font-size: 12.5px;
  font-weight: 500;
  line-height: 1.42;
  color: var(--ink);
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-family: var(--mono);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--faint);
}

.card-foot span:first-child {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- docs view ---------- */

.doc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
  gap: 10px;
}

.doc-card {
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 13px 14px 11px;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.14s ease, transform 0.14s ease, box-shadow 0.14s ease;
}

.doc-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.doc-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md);
}

.doc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 7px;
}

.doc-kind {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 5px;
  color: var(--muted);
  background: var(--surface-2);
}

.doc-kind-adr {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
  background: var(--accent-soft);
}

.doc-status {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--st-done);
}

.doc-title {
  display: block;
  margin: 0 0 6px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.doc-excerpt {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  margin: 0 0 10px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--muted);
}

.doc-path {
  display: block;
  margin-top: auto;
  padding-top: 7px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- decisions timeline ---------- */

.timeline {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 820px;
  padding-left: 18px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: var(--line-strong);
}

.tl-item {
  position: relative;
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}

.tl-item::before {
  content: "";
  position: absolute;
  left: -17.5px;
  top: 17px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--bg);
}

.tl-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tl-date {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}

.tl-kind {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--faint);
}

.tl-title {
  margin: 5px 0 5px;
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--ink);
}

.tl-detail {
  max-width: 68ch;
  margin: 0 0 9px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
}

.tl-refs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.ref-chip {
  font-family: var(--mono);
  font-size: 10.5px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px 7px;
  background: var(--surface-2);
  color: var(--muted);
  transition: border-color 0.12s ease, color 0.12s ease;
}

button.ref-chip:hover {
  color: var(--ink);
  border-color: var(--line-strong);
  background: var(--surface-3);
}

/* ---------- right details inspector ---------- */

.details {
  border-left: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.details-head {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(12px);
}

.details-body {
  padding: 18px 20px 44px;
}

.close {
  width: 24px;
  height: 24px;
  border: 1px solid var(--line);
  border-radius: 6px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--surface-2);
  font-size: 14px;
  line-height: 1;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.close:hover {
  background: var(--surface-3);
  border-color: var(--line-strong);
  color: var(--ink);
}

.details-title {
  margin: 0 0 8px;
  font-family: var(--sans);
  font-size: 18.5px;
  font-weight: 650;
  line-height: 1.3;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.details-lead {
  margin: 0 0 14px;
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--muted);
}

.badges {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px 7px;
  background: var(--surface-2);
  color: var(--muted);
}

.badge .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.badge-backlog { color: var(--st-backlog); }
.badge-ready { color: var(--st-ready); }
.badge-doing,
.badge-active { color: var(--st-doing); }
.badge-review { color: var(--st-review); }
.badge-done,
.badge-accepted,
.badge-living { color: var(--st-done); }
.badge-blocked { color: var(--st-blocked); }
.badge-planned { color: var(--faint); }

.overview-stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  margin: 14px 0 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--line);
  overflow: hidden;
}

.overview-stat {
  padding: 10px 10px;
  background: var(--surface-2);
}

.overview-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.overview-stat span {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--faint);
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 12px 0 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--line);
  overflow: hidden;
}

.meta-item {
  padding: 9px 11px;
  background: var(--surface-2);
}

.meta-k {
  margin-bottom: 2px;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--faint);
}

.meta-v {
  font-size: 12px;
  line-height: 1.4;
  color: var(--ink);
}

.mono {
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.detail-section {
  margin: 18px 0;
}

.detail-section h2 {
  margin: 0 0 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--faint);
}

.detail-section p {
  margin: 0 0 8px;
  font-size: 12.5px;
  line-height: 1.62;
  color: var(--muted);
}

.contract-box {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  border-radius: 6px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--ink-secondary);
  overflow-wrap: break-word;
}

.notes {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.notes li {
  position: relative;
  padding-left: 12px;
  font-size: 12px;
  line-height: 1.58;
  color: var(--muted);
}

.notes li strong {
  color: var(--ink);
  font-weight: 600;
}

.notes li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 7px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.path-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.path-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-secondary);
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: border-color 0.12s ease, background 0.12s ease, color 0.12s ease;
}

button.path-chip:hover {
  border-color: var(--line-strong);
  background: var(--surface-3);
  color: var(--ink);
}

.chip-id {
  flex: none;
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
}

.inline-link {
  font-size: 12px;
  font-weight: 500;
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  text-underline-offset: 2px;
}

.relation-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.relation {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 5.5px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface-2);
  text-align: left;
  transition: border-color 0.12s ease, background 0.12s ease;
}

.relation:hover {
  border-color: var(--line-strong);
  background: var(--surface-3);
}

.rel-dir {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  flex: none;
}

.rel-dir-in {
  color: var(--accent-2);
}

.rel-target {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
}

.rel-label {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
}

.callout {
  margin: 10px 0;
  padding: 9px 11px;
  border: 1px solid color-mix(in srgb, var(--st-blocked) 40%, var(--line));
  border-radius: 6px;
  background: color-mix(in srgb, var(--st-blocked) 7%, transparent);
  font-size: 12px;
  line-height: 1.5;
  color: var(--st-blocked);
}

.source-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 6px 0;
}

.source-tab {
  max-width: 100%;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.source-tab:hover {
  color: var(--ink);
  border-color: var(--line-strong);
}

.source-tab.active {
  background: var(--accent-soft);
  border-color: var(--accent-border);
  color: var(--accent);
  font-weight: 600;
}

.source-box {
  border: 1px solid var(--code-line);
  border-radius: 8px;
  background: var(--code-bg);
  overflow: hidden;
}

.source-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--code-line);
  background: var(--code-head);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--code-muted);
}

.source-path {
  color: var(--code-ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.source-meta {
  flex: none;
  font-variant-numeric: tabular-nums;
}

.source-body {
  max-height: 400px;
  padding: 8px 0;
  overflow: auto;
}

.source-line {
  display: flex;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--code-ink);
  white-space: pre;
}

.source-line .ln {
  flex: 0 0 3.4em;
  padding-right: 10px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--code-muted);
  user-select: none;
}

.source-line .lc {
  padding-right: 14px;
}

.hint {
  margin: 12px 0 0;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--faint);
}

.empty {
  padding: 16px;
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
  color: var(--faint);
  font-size: 12px;
  line-height: 1.5;
}

/* ---------- markdown reader ---------- */

.md {
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-secondary);
  overflow-wrap: break-word;
}

.md > :first-child {
  margin-top: 0;
}

.md h1,
.md h2,
.md h3 {
  font-family: var(--sans);
  color: var(--ink);
  font-weight: 620;
  line-height: 1.35;
  letter-spacing: -0.015em;
}

.md h1 {
  margin: 20px 0 8px;
  font-size: 16.5px;
}

.md h2 {
  margin: 22px 0 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.md h3 {
  margin: 16px 0 6px;
  font-size: 13px;
}

.md p {
  margin: 0 0 10px;
}

.md strong {
  color: var(--ink);
  font-weight: 600;
}

.md ul,
.md ol {
  margin: 0 0 12px;
  padding-left: 18px;
}

.md li {
  margin: 4px 0;
}

.md li::marker {
  color: var(--faint);
}

.md li:has(> input[type="checkbox"]) {
  list-style: none;
  margin-left: -18px;
}

.md li input[type="checkbox"] {
  width: 12px;
  height: 12px;
  margin: 0 6px 0 0;
  vertical-align: -1px;
  accent-color: var(--accent);
}

.md a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
  text-underline-offset: 2px;
}

.md code {
  padding: 1.5px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink);
}

.md pre {
  margin: 12px 0;
  padding: 10px 12px;
  border: 1px solid var(--code-line);
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--code-ink);
  overflow: auto;
}

.md pre code {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font-size: 10.5px;
  line-height: 1.55;
}

.md blockquote {
  margin: 12px 0;
  padding: 4px 12px;
  border-left: 2px solid var(--accent);
  background: var(--surface-2);
  border-radius: 0 6px 6px 0;
  color: var(--muted);
}

.table-wrap {
  margin: 12px 0;
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 7px;
}

.md table {
  width: 100%;
  min-width: 480px;
  margin: 0;
  border-collapse: collapse;
  font-size: 12px;
}

.md th,
.md td {
  padding: 6px 9px;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

.md th:last-child,
.md td:last-child {
  border-right: 0;
}

.md tr:last-child td {
  border-bottom: 0;
}

.md th {
  background: var(--surface-2);
  color: var(--ink);
  font-weight: 600;
}

.md hr {
  margin: 18px 0;
  border: 0;
  border-top: 1px solid var(--line);
}

/* ---------- responsive ---------- */

@media (min-width: 1360px) {
  body[data-view="docs"] .shell,
  body[data-view="decisions"] .shell {
    grid-template-columns: 224px minmax(0, 1fr) 500px;
  }
}

@media (max-width: 1320px) {
  .shell {
    grid-template-columns: 210px minmax(0, 1fr) 356px;
  }

  .brand-tag,
  .brand-divider {
    display: none;
  }

  .canvas {
    padding: 18px 20px 36px;
  }
}

@media (max-width: 1080px) {
  .shell {
    grid-template-columns: 200px minmax(0, 1fr);
  }

  .details {
    display: none;
  }

  .status-chip {
    display: none;
  }
}

@media (max-width: 780px) {
  body {
    overflow: auto;
  }

  .topbar {
    height: auto;
    min-height: 52px;
    padding: 10px 14px;
    flex-wrap: wrap;
    gap: 8px 12px;
  }

  .brand {
    flex: 1;
  }

  .brand-tag,
  .brand-divider {
    display: none;
  }

  .tabs {
    order: 3;
    width: 100%;
    overflow-x: auto;
  }

  .search {
    width: 150px;
  }

  .shell {
    height: auto;
    min-height: calc(100vh - 96px);
    grid-template-columns: 1fr;
  }

  .rail {
    display: none;
  }

  .canvas {
    padding: 18px 14px 36px;
  }

  .view-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .stats {
    justify-content: flex-start;
  }

  .arch-layer {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .board {
    flex-direction: column;
  }

  .column,
  .column.empty {
    width: 100%;
    min-height: 0;
  }

  .doc-grid {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}

</style>

<script id="niuse-data" type="application/json">{"project":{"name":"niuse","title":"niuse","tagline":"personal engineering companion on niucode","summary":"A personal engineering companion on top of niucode: five Markdown stores for identity and memory, an in-band protocol, soft expiry, and a resumable thread. The board records architecture, decisions, and iteration; it is not runtime monitoring.","status":"M2 · Dogfood pending","repo":"niuverse/niuse","language":"Rust"},"milestones":[{"id":"M0","title":"Bootstrap","status":"done","goal":"Ship the smallest runnable loop for identity and memory.","exit":["five stores with atomic 0600 writes","in-band protocol works end to end","the REPL completes one real turn"]},{"id":"M1","title":"Memory loop","status":"done","goal":"Make memory trustworthy: confirmation, conflicts, expiry, privacy, and cold start.","exit":["bootstrap → review → memory works end to end","a secret match is refused","per-turn cwd on one session"]},{"id":"M2","title":"Dogfood","status":"active","goal":"Prove with real work that it remembers, is reliable, and dares to disagree, instead of adding features.","exit":["ten consecutive working days, at least one real task per day through niuse","candidate acceptance rate ≥ 60%","at least once it disagrees and you change your mind"]},{"id":"M3","title":"Distribution","status":"planned","goal":"Make the project installable, publishable, and maintainable.","exit":["the niucode dependency is versioned, or git install is the stated path","cargo package and installation are reproducible","name, license, and release channels are settled"]},{"id":"M4","title":"Shared front end","status":"planned","goal":"Stop maintaining a second front end: reuse niucode's TUI and loop behind a library and a small hook surface.","exit":["niucode-cli exports a library plus turn hooks","niuse deletes its renderer and runs the shared TUI","the product-only layer stays below roughly 1k lines"]}],"layers":[{"id":"interface","name":"Interface","note":"REPL, commands, rendering"},{"id":"engine","name":"Engine","note":"prompt, protocol, policy"},{"id":"adapters","name":"Adapters","note":"niucode boundary and cold start"},{"id":"state","name":"State","note":"five stores and sessions"},{"id":"engineering","name":"Engineering","note":"build, dashboard, tests"}],"modules":[{"id":"cli","title":"CLI","layer":"interface","status":"done","summary":"Clap entry, subcommand dispatch, offline commands, and bootstrap / review wiring.","contract":"Parse flags and dispatch; offline commands never construct a provider; only agent commands resolve credentials.","paths":["crates/niuse-cli/src/main.rs","crates/niuse-cli/src/commands.rs","crates/niuse-cli/src/config.rs"],"notes":["Bare niuse starts the REPL.","mem / loops / journal / identity / status work offline.","sandbox / approval / network keep niucode's semantics."],"sources":[{"path":"crates/niuse-cli/src/main.rs","language":"rust","text":"mod bootstrap;\nmod commands;\nmod config;\nmod driver;\nmod export;\nmod render;\nmod repl;\nmod settings;\n\nuse std::path::PathBuf;\n\nuse anyhow::Result;\nuse clap::{Parser, Subcommand};\nuse niuse_core::Store;\n\n#[derive(Parser, Debug)]\n#[command(\n    name = \"niuse\",\n    version,\n    about = \"A personal engineering companion built on niucode\"\n)]\nstruct Cli {\n    /// Provider preset (deepseek or openai); defaults from config\n    #[arg(long, global = true)]\n    preset: Option\u003cString\u003e,\n    /// Override the preset model\n    #[arg(long, global = true)]\n    model: Option\u003cString\u003e,\n    /// Disable DeepSeek thinking mode\n    #[arg(long, global = true)]\n    no_thinking: bool,\n    /// Working directory (defaults to cwd); `/cd` changes it at runtime\n    #[arg(long, global = true)]\n    cwd: Option\u003cPathBuf\u003e,\n    /// Sandbox: read-only, workspace-write, or full-access; defaults from config\n    #[arg(long, global = true)]\n    sandbox: Option\u003cString\u003e,\n    /// Approval: ask, on-failure, or never; defaults from config\n    #[arg(long, global = true)]\n    approval: Option\u003cString\u003e,\n    /// Network: on or off; defaults from config\n    #[arg(long, global = true)]\n    network: Option\u003cString\u003e,\n    /// Override the niuse home (defaults to $NIUSE_HOME or ~/.niuse)\n    #[arg(long, global = true)]\n    home: Option\u003cPathBuf\u003e,\n    /// Thread JSONL to resume (defaults to ~/.niuse/thread.jsonl)\n    #[arg(long, global = true)]\n    thread: Option\u003cPathBuf\u003e,\n    /// Maximum model turns per user request (0 = no hard cap); defaults from config\n    #[arg(long, global = true)]\n    max_steps: Option\u003cusize\u003e,\n    #[command(subcommand)]\n    command: Option\u003cCommand\u003e,\n}\n\n#[derive(Subcommand, Debug, Clone)]\nenum Command {\n    /// Run one prompt through the agent, then exit\n    Exec { prompt: String },\n    /// Inspect and edit durable memory\n    Mem {\n        #[command(subcommand)]\n        command: MemCommand,\n    },\n    /// Inspect and close open loops\n    Loops {\n        #[command(subcommand)]\n        command: LoopsCommand,\n    },\n    /// Export a session log as Markdown\n    Export {\n        /// Write to a file instead of stdout\n        #[arg(long)]\n        out: Option\u003cPathBuf\u003e,\n        /// Session JSONL to export (defaults to the main thread)\n        #[arg(long)]\n        session: Option\u003cPathBuf\u003e,\n    },\n    /// List the active thread and archived chapters\n    Threads,\n    /// Show or search the journal\n    Journal {\n        #[arg(long, default_value_t = 7)]\n        days: usize,\n        /// Search entries instead of listing recent days\n        #[arg(long)]\n        search: Option\u003cString\u003e,\n        /// Append an entry to today instead of listing\n        #[arg(long)]\n        add: Option\u003cString\u003e,\n    },\n    /// Create, show, or edit identity.md\n    Identity {\n        #[command(subcommand)]\n        command: IdentityCommand,\n    },\n    /// Mine sessions for memory candidates or a user profile\n    Bootstrap {\n        /// Maximum number of sessions to scan\n        #[arg(long, default_value_t = 40)]\n        limit: usize,\n        /// Only sessions modified within this many days\n        #[arg(long, default_value_t = 90)]\n        since_days: i64,\n        /// List the sessions that would be scanned, without calling a model\n        #[arg(long)]\n        dry_run: bool,\n        /// Also draft user.md from the selected sessions\n        #[arg(long)]\n        profile: bool,\n        /// Overwrite an existing user.md when drafting\n        #[arg(long)]\n        force_profile: bool,\n        /// Draft user.md only; skip memory candidates\n        #[arg(long)]\n        profile_only: bool,\n    },\n    /// Review bootstrapped candidates\n    Review,\n    /// Check local setup without calling a model\n    Doctor,\n    /// Inspect or edit user.md\n    User {\n        #[command(subcommand)]\n        command: UserCommand,\n    },\n    /// Inspect or create ~/.niuse/config.toml\n    Config {\n        #[command(subcommand)]\n        command: ConfigCommand,\n    },\n    /// Show local acceptance counters\n    Stats {\n        /// Window in days; 0 means all time\n        #[arg(long, default_value_t = 7)]\n        days: u64,\n        /// Add a per-day breakdown\n        #[arg(long)]\n        trend: bool,\n        /// Emit JSON (summary plus per-day rows)\n        #[arg(long)]\n        json: bool,\n    },\n    /// Show store and prompt status\n    Status,\n}\n\n#[derive(Subcommand, Debug, Clone)]\nenum MemCommand {\n    /// List memories\n    List {\n        /// Include expired entries\n        #[arg(long)]\n        all: bool,\n        /// Emit JSON\n        #[arg(long)]\n        json: bool,\n    },\n    /// Add a memory directly\n    Add {\n        text: String,\n        /// preference or lesson\n        #[arg(long, default_value = \"preference\")]\n        kind: String,\n        #[arg(long, value_delimiter = ',')]\n        tags: Vec\u003cString\u003e,\n        /// Store even if the secret scan or duplicate check matches\n        #[arg(long)]\n        force: bool,\n    },\n    /// Search memories, including expired ones\n    Search {\n        query: String,\n        /// Exclude expired entries\n        #[arg(long)]\n        fresh: bool,\n        /// Emit JSON\n        #[arg(long)]\n        json: bool,\n    },\n    /// Show one memory in full\n    Show { id: String },\n    /// Edit a memory in $EDITOR\n    Edit { id: String },\n    /// Delete a memory\n    Forget { id: String },\n    /// Refresh the confirmation date\n    Confirm { id: String },\n    /// Review stale memories interactively\n    Review,\n    /// Remove memories older than 90 days (dry run by default)\n    Prune {\n        /// Actually delete the expired entries\n        #[arg(long)]\n        apply: bool,\n    },\n}\n\n#[derive(Subcommand, Debug, Clone)]\n","truncated":true},{"path":"crates/niuse-cli/src/commands.rs","language":"rust","text":"//! Store-only commands. None of these construct a provider, so they work\n//! offline and without credentials.\n\nuse anyhow::{bail, Context, Result};\nuse niuse_core::model::one_line;\nuse niuse_core::policy::{conflicts, search_score, secret_reason};\nuse niuse_core::prompt::compose;\nuse niuse_core::{Date, JournalDay, LoopItem, MemoryEntry, MemoryKind, Store};\nuse std::collections::BTreeMap;\nuse std::fs;\nuse std::io::{self, Write};\nuse std::path::{Path, PathBuf};\nuse std::process::Command;\nuse std::time::{SystemTime, UNIX_EPOCH};\n\nuse niucode_auth::AuthStore;\nuse niucode_provider::Preset;\nuse serde::Serialize;\n\npub fn mem_list(store: \u0026Store, all: bool, json: bool) -\u003e Result\u003c()\u003e {\n    let today = Date::today();\n    let memories = store.memories()?;\n    let shown: Vec\u003c\u0026MemoryEntry\u003e = memories\n        .iter()\n        .filter(|entry| all || !entry.is_expired(today))\n        .collect();\n\n    if json {\n        let entries: Vec\u003cMemoryJson\u003e = shown.iter().map(|entry| MemoryJson::from(*entry)).collect();\n        println!(\"{}\", serde_json::to_string_pretty(\u0026entries)?);\n        return Ok(());\n    }\n\n    let stale = memories\n        .iter()\n        .filter(|entry| entry.is_stale(today) \u0026\u0026 !entry.is_expired(today))\n        .count();\n    let expired = memories\n        .iter()\n        .filter(|entry| entry.is_expired(today))\n        .count();\n    println!(\n        \"{} 条记忆 · {} 条待验证 · {} 条已过期（不再自动注入）\",\n        memories.len(),\n        stale,\n        expired\n    );\n    if shown.is_empty() {\n        println!(\"（空。用 `niuse mem add \\\"...\\\"` 或等待对话中的候选。）\");\n        return Ok(());\n    }\n    for entry in shown {\n        println!(\"{}\", entry_line(entry, today));\n    }\n    Ok(())\n}\n\n#[derive(Debug, serde::Serialize)]\nstruct MemoryJson\u003c'a\u003e {\n    id: \u0026'a str,\n    kind: \u0026'a str,\n    tags: \u0026'a [String],\n    created: String,\n    confirmed: String,\n    age_days: i64,\n    expired: bool,\n    source: Option\u003c\u0026'a str\u003e,\n    text: \u0026'a str,\n}\n\nimpl\u003c'a\u003e From\u003c\u0026'a MemoryEntry\u003e for MemoryJson\u003c'a\u003e {\n    fn from(entry: \u0026'a MemoryEntry) -\u003e Self {\n        let today = Date::today();\n        Self {\n            id: \u0026entry.id,\n            kind: entry.kind.as_str(),\n            tags: \u0026entry.tags,\n            created: entry.created.to_string(),\n            confirmed: entry.confirmed.to_string(),\n            age_days: entry.age_days(today),\n            expired: entry.is_expired(today),\n            source: entry.source.as_deref(),\n            text: \u0026entry.text,\n        }\n    }\n}\n\nfn entry_line(entry: \u0026MemoryEntry, today: Date) -\u003e String {\n    let age = entry.age_days(today);\n    let age_label = match age {\n        0 =\u003e \"今天\".to_string(),\n        1..=30 =\u003e format!(\"{age} 天前\"),\n        _ if entry.is_expired(today) =\u003e format!(\"{age} 天前 · 已过期\"),\n        _ =\u003e format!(\"{age} 天前 · 待验证\"),\n    };\n    let tags = if entry.tags.is_empty() {\n        String::new()\n    } else {\n        format!(\" [{}]\", entry.tags.join(\", \"))\n    };\n    format!(\n        \"m-{}  {}{}  {}  {}\",\n        entry.id,\n        entry.kind.as_str(),\n        tags,\n        age_label,\n        entry.text\n    )\n}\n\n/// Search every memory, including expired ones: recall is exactly where old\n/// entries are still useful, even though they are no longer auto-injected.\npub fn mem_search(store: \u0026Store, query: \u0026str, fresh_only: bool, json: bool) -\u003e Result\u003c()\u003e {\n    let today = Date::today();\n    let query = query.trim();\n    if query.is_empty() {\n        bail!(\"usage: niuse mem search \u003cquery\u003e\");\n    }\n\n    let memories = store.memories()?;\n    let mut scored: Vec\u003c(f64, \u0026MemoryEntry)\u003e = memories\n        .iter()\n        .filter(|entry| !fresh_only || !entry.is_expired(today))\n        .map(|entry| (search_score(query, \u0026entry.text, \u0026entry.tags), entry))\n        .filter(|(score, _)| *score \u003e= 0.2)\n        .collect();\n    scored.sort_by(|left, right| {\n        right\n            .0\n            .partial_cmp(\u0026left.0)\n            .unwrap_or(std::cmp::Ordering::Equal)\n    });\n\n    if json {\n        let entries: Vec\u003cMemoryJson\u003e = scored\n            .iter()\n            .map(|(_, entry)| MemoryJson::from(*entry))\n            .collect();\n        println!(\"{}\", serde_json::to_string_pretty(\u0026entries)?);\n        return Ok(());\n    }\n\n    if scored.is_empty() {\n        println!(\"没有匹配「{query}」的记忆。\");\n        return Ok(());\n    }\n\n    println!(\"{} 条匹配「{query}」\", scored.len());\n    for (_, entry) in scored.iter().take(10) {\n        println!(\"{}\", entry_line(entry, today));\n    }\n    Ok(())\n}\n\npub fn mem_add(\n    store: \u0026Store,\n    text: \u0026str,\n    kind: \u0026str,\n    tags: Vec\u003cString\u003e,\n    force: bool,\n) -\u003e Result\u003c()\u003e {\n    let kind = MemoryKind::parse(kind)\n        .with_context(|| format!(\"unknown kind {kind:?}; use preference or lesson\"))?;\n    let text = one_line(text.trim().to_string());\n    if text.is_empty() {\n        bail!(\"memory text is empty\");\n    }\n    if let Some(reason) = secret_reason(\u0026text) {\n        if !force {\n            bail!(\"refusing to store: looks like a {reason}; pass --force to override\");\n        }\n        eprintln!(\"warning: overriding secret scan ({reason})\");\n    }\n    let existing = store.memories()?;\n    let similar: Vec\u003c\u0026MemoryEntry\u003e = existing\n        .iter()\n        .filter(|entry| conflicts(\u0026entry.text, \u0026entry.tags, \u0026text, \u0026tags))\n        .collect();\n    if !similar.is_empty() \u0026\u0026 !force {\n        for entry in similar {\n            eprintln!(\"similar to m-{}: {}\", entry.id, entry.text);\n        }\n        bail!(\"a similar memory exists; pass --force to add anyway\");\n    }\n\n    let entry = store.add_memory(MemoryEntry::new(kind, text, tags, Date::today(), None))?;\n    println!(\"m-{}\", entry.id);\n    Ok(())\n}\n\npub fn mem_show(store: \u0026Store, id: \u0026str) -\u003e Result\u003c()\u003e {\n    let id = normalize_id(id);\n    let memories = store.memories()?;\n    let Some(entry) = memories.iter().find(|entry| entry.id == id) else {\n        bail!(\"no memory m-{id}\");\n    };\n    println!(\"m-{}\", entry.id);\n    println!(\"kind        {}\", entry.kind.as_str());\n    println!(\n        \"tags        {}\",\n","truncated":true},{"path":"crates/niuse-cli/src/config.rs","language":"rust","text":"//! Runtime settings: provider construction and the three security axes.\n\nuse std::path::PathBuf;\nuse std::sync::Arc;\n\nuse anyhow::{bail, Context, Result};\nuse niucode_agent::ApprovalMode;\nuse niucode_auth::AuthStore;\nuse niucode_provider::{OpenAiConfig, OpenAiProvider, Preset, Provider, ThinkingMode};\nuse niucode_tools::{NetworkMode, SandboxMode, SandboxPolicy};\n\npub struct ProviderBundle {\n    pub provider: Arc\u003cdyn Provider\u003e,\n    pub provider_id: String,\n    pub model: String,\n}\n\npub fn build_provider(\n    preset: \u0026str,\n    model: Option\u003c\u0026str\u003e,\n    no_thinking: bool,\n) -\u003e Result\u003cProviderBundle\u003e {\n    let preset = Preset::parse(preset).with_context(|| format!(\"unknown provider {preset:?}\"))?;\n    let auth = AuthStore::new().context(\"initialize auth store\")?;\n    let credential = auth.resolve(preset.as_str())?.with_context(|| {\n        format!(\n            \"no credential for {}; run `niucode auth set {}` or set {}\",\n            preset.as_str(),\n            preset.as_str(),\n            preset.api_key_env()\n        )\n    })?;\n\n    let provider_id = preset.as_str().to_string();\n    let model = model\n        .map(str::to_string)\n        .unwrap_or_else(|| default_model(\u0026preset));\n\n    let mut config = OpenAiConfig::preset_config(preset)?;\n    config.api_key = credential.key.expose().to_string();\n    config.model = model.clone();\n    if no_thinking \u0026\u0026 preset == Preset::DeepSeek {\n        config.thinking = Some(ThinkingMode::Disabled);\n    }\n    let provider: Arc\u003cdyn Provider\u003e = Arc::new(OpenAiProvider::for_preset(preset, config)?);\n    Ok(ProviderBundle {\n        provider,\n        provider_id,\n        model,\n    })\n}\n\nfn default_model(preset: \u0026Preset) -\u003e String {\n    niucode_provider::find_provider(preset.as_str())\n        .map(|descriptor| descriptor.default_model.to_string())\n        .unwrap_or_else(|| preset.default_model().to_string())\n}\n\npub fn parse_sandbox(value: \u0026str) -\u003e Result\u003cSandboxMode\u003e {\n    match value {\n        \"read-only\" =\u003e Ok(SandboxMode::ReadOnly),\n        \"workspace-write\" =\u003e Ok(SandboxMode::WorkspaceWrite),\n        \"full-access\" =\u003e Ok(SandboxMode::FullAccess),\n        other =\u003e bail!(\"unknown sandbox {other:?}; use read-only, workspace-write, or full-access\"),\n    }\n}\n\npub fn parse_network(value: \u0026str) -\u003e Result\u003cNetworkMode\u003e {\n    match value {\n        \"on\" =\u003e Ok(NetworkMode::On),\n        \"off\" =\u003e Ok(NetworkMode::Off),\n        other =\u003e bail!(\"unknown network {other:?}; use on or off\"),\n    }\n}\n\npub fn parse_approval(value: \u0026str) -\u003e Result\u003cApprovalMode\u003e {\n    match value {\n        \"ask\" =\u003e Ok(ApprovalMode::Ask),\n        \"on-failure\" =\u003e Ok(ApprovalMode::OnFailure),\n        \"never\" =\u003e Ok(ApprovalMode::Never),\n        other =\u003e bail!(\"unknown approval {other:?}; use ask, on-failure, or never\"),\n    }\n}\n\n/// Mirror niucode's fallback: without bwrap, `never` is refused and the other\n/// modes degrade to explicit per-action approval.\npub fn resolve_policy(\n    sandbox: \u0026str,\n    approval: \u0026str,\n    network: \u0026str,\n) -\u003e Result\u003c(SandboxPolicy, ApprovalMode, bool)\u003e {\n    let mut approval = parse_approval(approval)?;\n    let policy = SandboxPolicy::new(parse_sandbox(sandbox)?, parse_network(network)?);\n    let mut allow_unsandboxed = false;\n\n    if policy.backend() == \"unavailable\" {\n        match approval {\n            ApprovalMode::Never =\u003e bail!(\n                \"sandbox backend bwrap is unavailable; install bubblewrap or use --approval ask\"\n            ),\n            ApprovalMode::OnFailure =\u003e {\n                eprintln!(\n                    \"warning: sandbox backend unavailable; falling back to per-action approval\"\n                );\n                approval = ApprovalMode::Ask;\n                allow_unsandboxed = true;\n            }\n            ApprovalMode::Ask =\u003e {\n                eprintln!(\"warning: sandbox backend unavailable; using per-action approval\");\n                allow_unsandboxed = true;\n            }\n        }\n    }\n\n    Ok((policy, approval, allow_unsandboxed))\n}\n\npub fn resolve_cwd(cwd: Option\u003cPathBuf\u003e) -\u003e Result\u003cPathBuf\u003e {\n    let cwd = match cwd {\n        Some(path) =\u003e path,\n        None =\u003e std::env::current_dir().context(\"resolve current directory\")?,\n    };\n    let cwd = cwd\n        .canonicalize()\n        .with_context(|| format!(\"resolve working directory {}\", cwd.display()))?;\n    if !cwd.is_dir() {\n        bail!(\"working directory {} is not a directory\", cwd.display());\n    }\n    Ok(cwd)\n}\n","truncated":false}]},{"id":"repl","title":"REPL","layer":"interface","status":"done","summary":"Interactive conversation, slash commands, candidate confirmation, editing, and streaming render.","contract":"Build one AgentConfig per turn; call run_with_history only through the driver; memory writes always happen after confirmation.","paths":["crates/niuse-cli/src/repl.rs","crates/niuse-cli/src/render.rs"],"notes":["The tail buffer keeps protocol blocks from leaking to the user.","At most one candidate per turn; after a rejection the session stops proposing.","Ctrl-C cancels the current turn; Ctrl-D exits.","The system prompt is assembled once per session."],"sources":[{"path":"crates/niuse-cli/src/repl.rs","language":"rust","text":"//! Interactive REPL and one-shot execution.\n\nuse std::io::{self, Write};\nuse std::path::PathBuf;\nuse std::sync::Arc;\n\nuse anyhow::{bail, Context, Result};\nuse niucode_agent::ApprovalMode;\nuse niucode_core::load;\nuse niucode_provider::Provider;\nuse niucode_tools::SandboxPolicy;\nuse niuse_core::policy::{conflicts, secret_reason};\nuse niuse_core::prompt::compose;\nuse niuse_core::{Block, Date, LoopItem, MemoryEntry, MemoryKind, Store};\n\nuse crate::commands;\nuse crate::config::{build_provider, resolve_cwd, resolve_policy};\nuse crate::driver::{self, SessionMeta, Thread};\nuse crate::render::{self, Renderer};\nuse crate::settings::Settings;\nuse crate::Cli;\n\npub struct App {\n    pub store: Store,\n    pub provider: Arc\u003cdyn Provider\u003e,\n    pub provider_id: String,\n    pub model: String,\n    pub policy: SandboxPolicy,\n    pub approval: ApprovalMode,\n    pub allow_unsandboxed: bool,\n    pub cwd: PathBuf,\n    pub max_steps: usize,\n    pub prompt: String,\n    pub prompt_tokens: usize,\n    pub thread_path: PathBuf,\n    memory_enabled: bool,\n    suppress_candidates: bool,\n}\n\nimpl App {\n    pub fn new(cli: \u0026Cli, settings: \u0026Settings, store: Store) -\u003e Result\u003cSelf\u003e {\n        let bundle = build_provider(\n            \u0026settings.provider,\n            settings.model.as_deref(),\n            cli.no_thinking,\n        )?;\n        let (policy, approval, allow_unsandboxed) =\n            resolve_policy(\u0026settings.sandbox, \u0026settings.approval, \u0026settings.network)?;\n        let cwd = resolve_cwd(cli.cwd.clone())?;\n        let memory_enabled = std::env::var(\"NIUSE_MEMORY\")\n            .map(|value| value.trim().to_lowercase() != \"off\")\n            .unwrap_or(true);\n\n        let thread_path = cli.thread.clone().unwrap_or_else(|| store.session_path());\n\n        let mut app = Self {\n            store,\n            provider: bundle.provider,\n            provider_id: bundle.provider_id,\n            model: bundle.model,\n            policy,\n            approval,\n            allow_unsandboxed,\n            cwd,\n            max_steps: settings.max_steps,\n            prompt: String::new(),\n            prompt_tokens: 0,\n            thread_path,\n            memory_enabled,\n            suppress_candidates: false,\n        };\n        app.rebuild_prompt()?;\n        Ok(app)\n    }\n\n    pub fn rebuild_prompt(\u0026mut self) -\u003e Result\u003c()\u003e {\n        let today = Date::today();\n        let identity = self.store.identity()?;\n        let user = self.store.user()?;\n        let memories = if self.memory_enabled {\n            self.store.memories()?\n        } else {\n            Vec::new()\n        };\n        let loops = self.store.loops()?;\n        let journal = self.store.recent_journal(3)?;\n        let composition = compose(\n            identity.as_deref(),\n            user.as_deref(),\n            \u0026memories,\n            \u0026loops,\n            \u0026journal,\n            today,\n        );\n        self.prompt = composition.system;\n        self.prompt_tokens = composition.tokens;\n        Ok(())\n    }\n\n    pub async fn run(mut self) -\u003e Result\u003c()\u003e {\n        let path = self.thread_path.clone();\n        let meta = SessionMeta {\n            cwd: \u0026self.cwd,\n            model: \u0026self.model,\n            provider: \u0026self.provider_id,\n            policy: self.policy,\n            approval: self.approval,\n        };\n        let mut thread = driver::open_thread(\u0026path, \u0026meta)?;\n        let mut history = driver::history(\u0026thread.path)?;\n        self.banner();\n\n        loop {\n            print!(\"\\n{}\", self.prompt_label());\n            let _ = io::stdout().flush();\n            let Some(line) = render::read_line() else {\n                println!();\n                break;\n            };\n            let input = line.trim();\n            if input.is_empty() {\n                continue;\n            }\n            if input == \"/new\" {\n                driver::append_end(\u0026thread.log)?;\n                if let Some(archived) =\n                    driver::archive_thread(\u0026thread.path, \u0026self.store.threads_dir())?\n                {\n                    println!(\"archived {}\", archived.display());\n                }\n                thread = {\n                    let meta = SessionMeta {\n                        cwd: \u0026self.cwd,\n                        model: \u0026self.model,\n                        provider: \u0026self.provider_id,\n                        policy: self.policy,\n                        approval: self.approval,\n                    };\n                    driver::open_thread(\u0026self.store.session_path(), \u0026meta)?\n                };\n                history.clear();\n                self.rebuild_prompt()?;\n                println!(\"new thread {}\", thread.path.display());\n                continue;\n            }\n            if input.starts_with('/') {\n                if matches!(self.command(input, \u0026thread)?, Flow::Quit) {\n                    break;\n                }\n                continue;\n            }\n\n            let config = driver::agent_config(\n                \u0026self.provider_id,\n                \u0026self.model,\n                \u0026self.cwd,\n                self.prompt.clone(),\n                self.policy,\n                self.approval,\n                self.allow_unsandboxed,\n                self.max_steps,\n            );\n            let mut renderer = Renderer::new();\n            let result = driver::run_turn(\n                self.provider.as_ref(),\n                \u0026mut thread.log,\n                \u0026config,\n                input,\n                history,\n                \u0026mut renderer,\n            )\n            .await;\n            let parsed = renderer.finish();\n            match result {\n                Ok(Some(_)) =\u003e {\n                    self.metric(\"turn\", \"ok\");\n                    let source = thread.log.id().to_string();\n                    self.handle_blocks(parsed.blocks, \u0026source)?;\n                }\n                Ok(None) =\u003e {\n                    self.metric(\"turn\", \"cancelled\");\n                    println!(\"[cancelled]\");\n                }\n                Err(error) =\u003e {\n                    self.metric(\"turn\", \"error\");\n                    eprintln!(\"error: {error:#}\");\n                }\n            }\n            history = match driver::history(\u0026thread.path) {\n                Ok(history) =\u003e history,\n                Err(error) =\u003e {\n                    eprintln!(\"warning: cannot reload session history: {error:#}\");\n                    Vec::new()\n                }\n            };\n        }\n\n        driver::append_end(\u0026thread.log)?;\n        Ok(())\n    }\n","truncated":true},{"path":"crates/niuse-cli/src/render.rs","language":"rust","text":"//! Minimal terminal rendering for `niuse`. The niucode TUI lives behind a\n//! binary-only crate, so niuse owns this small renderer and keeps the turn loop\n//! as the single source of events.\n\nuse std::io::{self, Write};\n\nuse niucode_agent::{AgentEvent, ApprovalRequest};\nuse niucode_tools::{ChangePreview, LineKind, PreviewBody};\nuse niuse_core::{parse, Parsed, StreamFilter};\n\npub struct Renderer {\n    filter: StreamFilter,\n    at_line_start: bool,\n}\n\nimpl Renderer {\n    pub fn new() -\u003e Self {\n        Self {\n            filter: StreamFilter::new(),\n            at_line_start: true,\n        }\n    }\n\n    pub fn event(\u0026mut self, event: AgentEvent) {\n        match event {\n            AgentEvent::TextDelta(delta) =\u003e {\n                let visible = self.filter.push(\u0026delta);\n                if !visible.is_empty() {\n                    print!(\"{visible}\");\n                    let _ = io::stdout().flush();\n                    self.at_line_start = visible.ends_with('\\n');\n                }\n            }\n            AgentEvent::ReasoningDelta(_) =\u003e {}\n            AgentEvent::ToolCall { name, input } =\u003e {\n                self.newline();\n                println!(\"→ {} {}\", name, truncate(\u0026input.to_string(), 180));\n                self.at_line_start = true;\n            }\n            AgentEvent::ToolResult {\n                name, ok, summary, ..\n            } =\u003e {\n                self.newline();\n                let mark = if ok { \"✓\" } else { \"✗\" };\n                println!(\"{mark} {name}: {}\", truncate(\u0026summary, 240));\n                self.at_line_start = true;\n            }\n            AgentEvent::Warning(warning) =\u003e {\n                self.newline();\n                println!(\"! {warning}\");\n                self.at_line_start = true;\n            }\n            AgentEvent::Compaction {\n                before_tokens,\n                after_tokens,\n                ..\n            } =\u003e {\n                self.newline();\n                println!(\"[compacted {before_tokens} → {after_tokens} tokens]\");\n                self.at_line_start = true;\n            }\n            AgentEvent::TurnEnd { .. } | AgentEvent::Phase(_) =\u003e {}\n        }\n    }\n\n    /// Flush held text, print a final newline, and return the parsed answer.\n    pub fn finish(\u0026mut self) -\u003e Parsed {\n        let (tail, raw) = self.filter.finish();\n        if !tail.is_empty() {\n            print!(\"{tail}\");\n            let _ = io::stdout().flush();\n            self.at_line_start = tail.ends_with('\\n');\n        }\n        self.newline();\n        parse(\u0026raw)\n    }\n\n    fn newline(\u0026mut self) {\n        if !self.at_line_start {\n            println!();\n            let _ = io::stdout().flush();\n            self.at_line_start = true;\n        }\n    }\n}\n\nimpl Default for Renderer {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Per-action approval for mutating tools. Reads one line from the terminal.\npub fn approve(request: \u0026ApprovalRequest) -\u003e bool {\n    println!();\n    println!(\"[approval] {}: {}\", request.tool, request.summary);\n    if let Some(preview) = \u0026request.preview {\n        for line in preview_lines(preview, 80) {\n            println!(\"{line}\");\n        }\n        if let Some(warning) = \u0026preview.warning {\n            println!(\"  warning: {warning}\");\n        }\n    }\n    print!(\"allow? [y/N] \");\n    let _ = io::stdout().flush();\n\n    let mut line = String::new();\n    if io::stdin().read_line(\u0026mut line).is_err() {\n        return false;\n    }\n    matches!(line.trim().to_lowercase().as_str(), \"y\" | \"yes\")\n}\n\n/// Read one line from stdin; `None` on EOF.\npub fn read_line() -\u003e Option\u003cString\u003e {\n    let mut line = String::new();\n    match io::stdin().read_line(\u0026mut line) {\n        Ok(0) =\u003e None,\n        Ok(_) =\u003e Some(line.trim_end().to_string()),\n        Err(_) =\u003e None,\n    }\n}\n\n/// Render the same structured preview niucode's TUI shows, capped so a large\n/// edit cannot swallow the terminal. The prompt stays after the diff.\nfn preview_lines(preview: \u0026ChangePreview, max_lines: usize) -\u003e Vec\u003cString\u003e {\n    let mut lines = Vec::new();\n    match \u0026preview.body {\n        PreviewBody::Diff { files } =\u003e {\n            for (index, file) in files.iter().enumerate() {\n                if index \u003e 0 {\n                    lines.push(String::new());\n                }\n                let marker = if file.is_new { \" (new)\" } else { \"\" };\n                lines.push(format!(\"--- {} {}\", file.path, marker));\n                for hunk in \u0026file.hunks {\n                    lines.push(format!(\n                        \"@@ -{},{} +{},{} @@\",\n                        hunk.old_start, hunk.old_len, hunk.new_start, hunk.new_len\n                    ));\n                    for line in \u0026hunk.lines {\n                        let prefix = match line.kind {\n                            LineKind::Context =\u003e ' ',\n                            LineKind::Add =\u003e '+',\n                            LineKind::Remove =\u003e '-',\n                        };\n                        lines.push(format!(\"{prefix}{}\", line.text.trim_end_matches('\\n')));\n                    }\n                }\n            }\n        }\n        PreviewBody::Command { command } =\u003e lines.push(format!(\"$ {command}\")),\n        PreviewBody::Note { message } =\u003e lines.push(message.clone()),\n    }\n\n    if lines.len() \u003e max_lines {\n        let omitted = lines.len() - max_lines;\n        lines.truncate(max_lines);\n        lines.push(format!(\"… {omitted} more line(s)\"));\n    }\n    lines\n}\n\nfn truncate(text: \u0026str, max_chars: usize) -\u003e String {\n    let mut out = String::new();\n    for (count, character) in text.chars().enumerate() {\n        if count \u003e= max_chars {\n            out.push('…');\n            break;\n        }\n        if character == '\\n' {\n            out.push(' ');\n        } else {\n            out.push(character);\n        }\n    }\n    out\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use niucode_tools::{ChangePreview, FilePreview, PreviewBody};\n\n    #[test]\n    fn diff_preview_shows_hunks_and_marks_additions() {\n        let file = FilePreview::from_text(\"a.txt\", \"alpha\\nbeta\\n\", \"alpha\\ngamma\\n\", false);\n        let preview = ChangePreview {\n            added: file.added,\n            removed: file.removed,\n            warning: None,\n            body: PreviewBody::Diff { files: vec![file] },\n        };\n        let lines = preview_lines(\u0026preview, 80);\n        assert!(lines.iter().any(|line| line == \"-beta\"));\n        assert!(lines.iter().any(|line| line == \"+gamma\"));\n        assert!(lines.iter().any(|line| line.starts_with(\"@@ \")));\n    }\n\n","truncated":true}]},{"id":"frontend","title":"Shared front end","layer":"interface","status":"planned","summary":"Reuse niucode's TUI and runtime through a library target plus turn hooks; retire niuse's renderer.","contract":"niucode-cli exposes a library and hooks for prompt augmentation, turn-end observation, and session lifecycle; niuse implements them.","paths":[],"notes":["Blocked on niucode M6 terminal ownership.","The hook surface must stay generic; memory policy remains in niuse."],"sources":[]},{"id":"prompt","title":"Prompt","layer":"engine","status":"done","summary":"Stable-prefix system prompt assembly with per-section budget trimming.","contract":"Takes the five stores and a date, returns a Composition; reads no disk, calls no model, writes no state.","paths":["crates/niuse-core/src/prompt.rs"],"notes":["Fixed order: persona → identity → user → memory → protocol → today → loops → journal.","Expired memory is not injected; entries older than 30 days carry an unverified label.","About 4k tokens; over budget, drop the oldest unverified facts first."],"sources":[{"path":"crates/niuse-core/src/prompt.rs","language":"rust","text":"//! System-prompt assembly.\n//!\n//! Stable sections come first (persona, identity, user, memory, protocol) so the\n//! provider can reuse its prompt cache; volatile sections (today, loops,\n//! journal) come last. The whole prompt is built once per session.\n\nuse crate::date::Date;\nuse crate::model::{JournalDay, LoopItem, MemoryEntry};\n\npub const IDENTITY_BUDGET: usize = 600;\npub const USER_BUDGET: usize = 600;\npub const MEMORY_BUDGET: usize = 2_000;\npub const LOOP_BUDGET: usize = 300;\npub const JOURNAL_BUDGET: usize = 600;\n\npub const BASE: \u0026str = \"你是 niuse，一个长期陪伴这位用户的工程伙伴。\\n\\\n你不是通用助手。你的价值不在「什么都能答」，而在三件事：记得他做过的判断、追踪你自己许下的承诺、在他判断错的时候开口。\\n\\\n工作方式：\\n\\\n- 具体优于笼统。引用过去的决定时说清楚是哪一次、为什么，不要泛泛地说「你喜欢简洁」。\\n\\\n- 不表演情绪，不用昵称轰炸，不主动抒情。\\n\\\n- 不同意就直说，给出理由，对事不对人。\\n\\\n- 不确定就去查；查不到就说不知道，不要补全。\\n\\\n- 记忆是偏好，不是法律。与当前证据冲突时以证据为准，并指出你不同意哪一条。\";\n\npub const PROTOCOL: \u0026str = \"## 记忆协议\\n\\\n你可以在回答的最后输出以下块。niuse 会解析它们，并从用户看到的文本里剥离；不要在正文里提到这些块。\\n\\n\\\n\u003c\u003cniuse:memory kind=preference tags=rust,testing\u003e\u003e\\n\\\n一句能独立看懂、跨项目仍然成立的结论\\n\\\n\u003c\u003c/niuse:memory\u003e\u003e\\n\\n\\\n\u003c\u003cniuse:loop due=2026-10-22\u003e\u003e\\n\\\n你答应过、或用户交代你下次要做的事\\n\\\n\u003c\u003c/niuse:loop\u003e\u003e\\n\\n\\\n\u003c\u003cniuse:journal\u003e\u003e\\n\\\n- 今天发生的决定、转折、未解问题或情绪变化（最多 3 条）\\n\\\n\u003c\u003c/niuse:journal\u003e\u003e\\n\\n\\\n规则：\\n\\\n- 每轮最多一个 memory 块；没有值得记的就不要输出，连续多轮没有候选是正常的。\\n\\\n- 只记「跨会话仍然有用、在仓库里 grep 不出来、一句话说得清」的内容。\\n\\\n- memory 写偏好、决策、踩坑；不要写代码事实、环境配置、别人的信息。\\n\\\n- 绝不把密钥、token、密码、客户名写进任何块。\\n\\\n- journal 只写与上次不同的东西；「今天修了个 bug」这种流水账不要写。\";\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct Composition {\n    pub system: String,\n    pub memory_injected: usize,\n    pub memory_dropped: usize,\n    pub tokens: usize,\n}\n\n/// Conservative token estimate: ASCII averages four characters per token,\n/// every non-ASCII character counts as one. Matches niucode's estimator.\npub fn estimate_text_tokens(text: \u0026str) -\u003e usize {\n    let mut ascii = 0usize;\n    let mut other = 0usize;\n    for character in text.chars() {\n        if character.is_ascii() {\n            ascii += 1;\n        } else {\n            other += 1;\n        }\n    }\n    ascii.div_ceil(4) + other\n}\n\npub fn compose(\n    identity: Option\u003c\u0026str\u003e,\n    user: Option\u003c\u0026str\u003e,\n    memories: \u0026[MemoryEntry],\n    loops: \u0026[LoopItem],\n    journal: \u0026[JournalDay],\n    today: Date,\n) -\u003e Composition {\n    let mut sections: Vec\u003c(\u0026str, String)\u003e = Vec::new();\n\n    if let Some(identity) = identity.map(str::trim).filter(|text| !text.is_empty()) {\n        sections.push((\"你是谁\", truncate_to_tokens(identity, IDENTITY_BUDGET)));\n    }\n    if let Some(user) = user.map(str::trim).filter(|text| !text.is_empty()) {\n        sections.push((\"你在和谁一起工作\", truncate_to_tokens(user, USER_BUDGET)));\n    }\n\n    let (memory_text, memory_injected, memory_dropped) = memory_section(memories, today);\n    if !memory_text.is_empty() {\n        sections.push((\n            \"长期记忆\",\n            format!(\n                \"以下是你和用户长期积累的判断。它们是偏好，不是法律；与当前证据冲突时以证据为准，并指出你不同意哪一条。\\n\\n{memory_text}\"\n            ),\n        ));\n    }\n\n    // Constant: keeping it before the volatile sections lengthens the stable\n    // cache prefix.\n    sections.push((\"记忆协议\", PROTOCOL.to_string()));\n    sections.push((\"今天\", today.format()));\n\n    let loop_text = loop_section(loops, today);\n    if !loop_text.is_empty() {\n        sections.push((\"未完成的承诺\", loop_text));\n    }\n\n    let journal_text = journal_section(journal);\n    if !journal_text.is_empty() {\n        sections.push((\"最近几天\", journal_text));\n    }\n\n    let mut system = String::from(BASE);\n    for (title, body) in \u0026sections {\n        system.push_str(\"\\n\\n## \");\n        system.push_str(title);\n        system.push('\\n');\n        system.push_str(body);\n    }\n\n    Composition {\n        tokens: estimate_text_tokens(\u0026system),\n        system,\n        memory_injected,\n        memory_dropped,\n    }\n}\n\nfn memory_section(memories: \u0026[MemoryEntry], today: Date) -\u003e (String, usize, usize) {\n    let mut ordered: Vec\u003c\u0026MemoryEntry\u003e = memories\n        .iter()\n        .filter(|entry| !entry.is_expired(today))\n        .collect();\n    ordered.sort_by_key(|entry| (entry.is_stale(today), std::cmp::Reverse(entry.confirmed)));\n\n    let mut lines = String::new();\n    let mut used = 0usize;\n    let mut injected = 0usize;\n    for entry in \u0026ordered {\n        let mut line = format!(\n            \"- [m-{} · {} · {}] {}\",\n            entry.id,\n            if entry.tags.is_empty() {\n                \"general\".to_string()\n            } else {\n                entry.tags.join(\", \")\n            },\n            entry.confirmed,\n            entry.text\n        );\n        if entry.is_stale(today) {\n            line.push_str(\u0026format!(\"（未验证，自 {} 起）\", entry.confirmed));\n        }\n        let cost = estimate_text_tokens(\u0026line) + 1;\n        if used + cost \u003e MEMORY_BUDGET {\n            continue;\n        }\n        used += cost;\n        injected += 1;\n        lines.push_str(\u0026line);\n        lines.push('\\n');\n    }\n\n    let dropped = memories.len().saturating_sub(injected);\n    (lines.trim_end().to_string(), injected, dropped)\n}\n\nfn loop_section(loops: \u0026[LoopItem], today: Date)
