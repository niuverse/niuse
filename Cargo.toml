[workspace]
resolver = "2"
members = ["crates/niuse-core", "crates/niuse-cli", "crates/xtask"]

[workspace.package]
version = "0.1.12"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/niuverse/niuse"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time"] }
toml = "0.8"
walkdir = "2.5"

# Local sibling checkout. A published build should pin a git revision instead;
# see docs/plan.md §8.
niucode-agent = { path = "../niucode/crates/niucode-agent", version = "0.1.6" }
niucode = { path = "../niucode/crates/niucode-cli", version = "0.1.6" }
niucode-auth = { path = "../niucode/crates/niucode-auth", version = "0.1.6" }
niucode-core = { path = "../niucode/crates/niucode-core", version = "0.1.6" }
niucode-mcp = { path = "../niucode/crates/niucode-mcp", version = "0.1.6" }
niucode-provider = { path = "../niucode/crates/niucode-provider", version = "0.1.6" }
niucode-tools = { path = "../niucode/crates/niucode-tools", version = "0.1.6" }
